<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordUp · 매일 영단어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --p:#3B5BDB;--pl:#748FFC;--pd:#2A47B0;--pb:#EEF2FF;
  --ok:#2F9E44;--okb:#D3F9D8;
  --bad:#C92A2A;--badb:#FFE3E3;
  --gold:#E9910A;--goldb:#FFF3BF;
  --bg:#EEF0FF;--card:#fff;
  --t1:#1A1E2E;--t2:#4A5268;--t3:#8892A6;
  --bd:#E0E4F0;--r:16px;--rs:10px
}
html,body{height:100%;background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--t1);font-size:14px}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}

/* ── Layout ── */
.scr{min-height:100vh;display:flex;flex-direction:column;padding-bottom:24px}
.px{padding-left:16px;padding-right:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:transform .12s,opacity .12s;-webkit-appearance:none;width:100%;text-align:center}
.btn:active{transform:scale(.97);opacity:.9}
.bp{background:var(--p);color:#fff}
.bs{background:var(--pb);color:var(--p)}
.bok{background:var(--ok);color:#fff}
.bo{background:transparent;color:var(--p);border:2px solid var(--p)}
.bgold{background:var(--gold);color:#fff}
.btn-sm{padding:9px 16px;font-size:13px}
.btn-dis{opacity:.4;pointer-events:none}

/* ── Progress ── */
.pbar{height:5px;background:var(--bd);border-radius:4px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--p),var(--pl));border-radius:4px;transition:width .4s ease}

/* ── SPLASH ── */
.splash-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:12px;background:linear-gradient(160deg,var(--pd) 0%,var(--p) 55%,var(--pl) 100%);min-height:100vh}
.splash-logo{font-size:72px;line-height:1;margin-bottom:8px}
.splash-t{font-size:36px;font-weight:900;color:#fff;letter-spacing:-1px}
.splash-s{font-size:15px;color:rgba(255,255,255,.8);line-height:1.7;margin-bottom:24px}
.splash-wrap .bp{background:#fff;color:var(--pd);max-width:280px}
.splash-wrap .bo{border-color:rgba(255,255,255,.5);color:#fff;max-width:280px;margin-top:4px}

/* ── ASSESSMENT ── */
.ah{background:var(--card);padding:16px 20px 12px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.aqn{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.aw{font-size:30px;font-weight:900;color:var(--p);letter-spacing:2px;margin-bottom:4px}
.ap{font-size:13px;color:var(--t2);margin-bottom:10px}
.aopts{padding:16px;display:flex;flex-direction:column;gap:10px}
.aopt{padding:15px 18px;background:var(--card);border-radius:var(--rs);border:2px solid var(--bd);font-size:16px;font-weight:500;color:var(--t1);cursor:pointer;transition:all .15s;-webkit-appearance:none;font-family:inherit;text-align:left}
.aopt:active{transform:scale(.98)}
.aopt.sel{border-color:var(--p);background:var(--pb);color:var(--p)}
.aopt.cor{border-color:var(--ok);background:var(--okb);color:var(--ok)}
.aopt.wrg{border-color:var(--bad);background:var(--badb);color:var(--bad)}

/* ── RESULT ── */
.rsc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:14px;text-align:center}
.remoji{font-size:72px;margin-bottom:4px;animation:drop .5s ease}
@keyframes drop{from{transform:scale(.5) translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rlevel{font-size:26px;font-weight:900;color:var(--p)}
.rdesc{font-size:14px;color:var(--t2);line-height:1.75;max-width:300px}

/* ── HOME ── */
.hdr{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;padding:22px 20px 30px}
.hgreet{font-size:13px;opacity:.8;margin-bottom:3px}
.htitle{font-size:21px;font-weight:900;margin-bottom:14px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstat{background:rgba(255,255,255,.18);border-radius:var(--rs);padding:9px 6px;text-align:center}
.hsv{font-size:20px;font-weight:900}
.hsl{font-size:10px;opacity:.8;margin-top:2px}
.hcont{padding:12px 14px 0;display:flex;flex-direction:column;gap:10px;margin-top:-18px}
.hcard{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 2px 14px rgba(59,91,219,.1)}
.hlbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.htit{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:3px}
.hsub{font-size:13px;color:var(--t2);margin-bottom:14px}
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.word-pill{background:var(--pb);border-radius:var(--rs);padding:7px 10px}
.wp-en{font-size:13px;font-weight:700;color:var(--p)}
.wp-ko{font-size:11px;color:var(--t3);margin-top:1px}

/* ── LEARN HEADER ── */
.lhdr{background:var(--card);padding:14px 20px 0;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.ltop{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.linfo{line-height:1.3}
.lsub{font-size:11px;color:var(--t3)}
.ltit{font-size:14px;font-weight:700}
.lcls{background:none;border:none;font-size:22px;cursor:pointer;color:var(--t3);padding:4px;-webkit-appearance:none}
.steps{display:flex;gap:4px;padding:8px 0 0}
.sdot{height:3px;flex:1;border-radius:2px;background:var(--bd);transition:background .3s}
.sdot.act{background:var(--p)}
.sdot.don{background:var(--ok)}

/* ── WORD CARD ── */
.wcard{margin:14px;background:linear-gradient(135deg,var(--p),var(--pl));border-radius:20px;padding:26px 22px;color:#fff;text-align:center;box-shadow:0 4px 20px rgba(59,91,219,.25);animation:si .3s ease}
@keyframes si{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wpos{font-size:11px;font-weight:500;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.wen{font-size:40px;font-weight:900;letter-spacing:1px;margin:6px 0 3px}
.wph{font-size:15px;font-weight:300;opacity:.8;margin-bottom:10px}
.wko{font-size:19px;font-weight:700;background:rgba(255,255,255,.22);padding:7px 18px;border-radius:20px;display:inline-block}

/* ── PRACTICE ── */
.parea{margin:0 14px;display:flex;flex-direction:column;gap:9px}
.spk-btn{background:var(--card);border:2px solid var(--p);color:var(--p);border-radius:50px;padding:13px 18px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:all .15s;-webkit-appearance:none;font-family:inherit;width:100%}
.spk-btn:active{transform:scale(.97)}
.spk-btn.mic{border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,42,42,.35)}50%{box-shadow:0 0 0 9px rgba(201,42,42,0)}}
.sbadge{padding:10px 14px;border-radius:var(--rs);font-size:13px;font-weight:600;text-align:center;display:none}
.sbadge.great{background:var(--okb);color:var(--ok);display:block}
.sbadge.ok{background:var(--goldb);color:var(--gold);display:block}
.sbadge.bad{background:var(--badb);color:var(--bad);display:block}
.sbadge.info{background:var(--pb);color:var(--p);display:block}
.nospeech{font-size:12px;color:var(--t3);text-align:center;padding:5px 0}

/* ── SENTENCES ── */
.scard{margin:12px 14px;background:var(--card);border-radius:var(--r);padding:22px 18px;box-shadow:0 2px 10px rgba(59,91,219,.07);min-height:190px;display:flex;flex-direction:column;animation:si .3s ease}
.snum{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.sen{font-size:18px;font-weight:600;color:var(--t1);line-height:1.65;flex:1}
.hl{color:var(--p);font-weight:900}
.sko{font-size:13px;color:var(--t2);line-height:1.65;display:none;background:var(--pb);border-radius:var(--rs);padding:10px 12px;margin-top:10px}
.sko.vis{display:block}
.sctl{display:flex;gap:7px;margin-top:10px}
.sdots{display:flex;gap:5px;justify-content:center;padding:6px 0}
.sdot2{width:7px;height:7px;border-radius:50%;background:var(--bd);transition:all .2s}
.sdot2.act{background:var(--p);width:22px;border-radius:4px}
.sdot2.don{background:var(--ok)}

/* ── ORDER ── */
.otgt{margin:10px 14px;min-height:64px;background:var(--card);border-radius:var(--rs);border:2px dashed var(--bd);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;transition:border-color .2s}
.otgt.cor{border-color:var(--ok);background:var(--okb)}
.otgt.wrg{border-color:var(--bad);background:var(--badb)}
.wpool{margin:8px 14px;display:flex;flex-wrap:wrap;gap:7px}
.wchip{padding:8px 13px;background:var(--card);border:2px solid var(--bd);border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;-webkit-appearance:none;font-family:inherit;color:var(--t1)}
.wchip:active{transform:scale(.94)}
.wchip.used{opacity:.35;pointer-events:none;background:var(--bd)}
.wchip.built{background:var(--p);border-color:var(--p);color:#fff;cursor:pointer}
.ohint{font-size:12px;color:var(--t3);text-align:center;padding:2px 14px}
.ofb{margin:6px 14px;border-radius:var(--rs);padding:11px 14px;font-size:13px}
.ofb.cor{background:var(--okb);color:var(--ok)}
.ofb.wrg{background:var(--badb);color:var(--bad)}

/* ── QUIZ ── */
.qqcard{margin:12px 14px;background:var(--card);border-radius:var(--r);padding:22px 18px;box-shadow:0 2px 10px rgba(59,91,219,.07)}
.qqtype{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.qqtext{font-size:22px;font-weight:700;color:var(--t1);line-height:1.4}
.qqsub{font-size:13px;color:var(--t2);margin-top:5px}
.qopts{margin:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt{padding:15px 10px;background:var(--card);border-radius:var(--rs);border:2px solid var(--bd);font-size:14px;font-weight:600;color:var(--t1);cursor:pointer;text-align:center;transition:all .15s;-webkit-appearance:none;font-family:inherit}
.qopt:active{transform:scale(.97)}
.qopt.ca{border-color:var(--ok);background:var(--okb);color:var(--ok)}
.qopt.wa{border-color:var(--bad);background:var(--badb);color:var(--bad)}

/* ── COMPLETE ── */
.cscr{flex:1;background:linear-gradient(160deg,var(--pd),var(--p));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 22px;gap:14px;text-align:center}
.cemoji{font-size:70px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.ctit{font-size:26px;font-weight:900}
.csub{font-size:14px;opacity:.85;line-height:1.7}
.cxp{background:rgba(255,255,255,.2);border-radius:10px;padding:10px 22px;font-size:21px;font-weight:900}
.cwsum{background:rgba(255,255,255,.12);border-radius:12px;padding:14px;width:100%;max-height:200px;overflow-y:auto;text-align:left}
.cwsi{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.1)}
.cscr .bo{border-color:rgba(255,255,255,.5);color:#fff;max-width:300px}
.cscr .bgold{max-width:300px}

/* ── WEEKLY ── */
.whdr{background:linear-gradient(135deg,var(--gold),#c77700);color:#fff;padding:22px 20px 28px}
.wfc{margin:14px;background:linear-gradient(135deg,var(--gold),#c77700);border-radius:20px;padding:26px 22px;color:#fff;text-align:center;animation:si .3s ease}

/* ── OVERLAY / TOAST ── */
#ov{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#ov.vis{display:flex}
.spin{width:38px;height:38px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--t1);color:#fff;padding:11px 18px;border-radius:20px;font-size:13px;font-weight:500;transition:transform .28s ease;z-index:95;white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ── MISC ── */
.ver{position:fixed;bottom:6px;right:10px;font-size:10px;color:var(--t3);pointer-events:none}
.row{display:flex;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div class="spin"></div><div style="font-size:14px;color:var(--t2);font-weight:500">예문 생성 중... 잠시만요 ✨</div></div>

// String similarity (Levenshtein)
function sim(a,b){
 a=a.toLowerCase().trim();b=b.toLowerCase().trim();
 if(a===b)return 1;
 const m=a.length,n=b.length;
 const d=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
  d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
 return 1-d[m][n]/Math.max(m,n);
}

// Shuffle
function shuf(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

}

// Get today's words
function getDayWords(){
 const lv=S.user.level,day=S.user.studyDay;
 const pool=WORDS[lv]||[];
 const start=((day-1)*10)%pool.length;
 const base=pool.slice(start,start+10);
 // If we need more (wrap around)
 const need=10-base.length;
 const words=need>0?[...base,...pool.slice(0,need)]:base;
 // Week 2+: mix in 3 review words, use 7 new
 if(day>6&&Object.keys(S.learned).length>0){
  const lkeys=Object.keys(S.learned);
  const rev=shuf(lkeys).slice(0,3).map(k=>pool.find(w=>w.w===k)).filter(Boolean);
  if(rev.length>0)return shuf([...words.slice(0,7),...rev]).slice(0,10);
 }
 return words;
}

// Get all learned words this week
function getWeekWords(){
 const lv=S.user.level;
 const pool=WORDS[lv]||[];
 const day=S.user.studyDay;
 const ws=Math.floor((day-1)/6)*6+1;
 let all=[];
 for(let d=ws;d<=day;d++){
  const pd=S.progress['d'+d];
  if(pd&&pd.words)all.push(...pd.words.map(wn=>pool.find(x=>x.w===wn)).filter(Boolean));
 }
 return [...new Map(all.map(w=>[w.w,w])).values()];
}

// Update streak
function updateStreak(){
 const today=new Date().toDateString();
 if(S.user.lastDate===today)return;
 const yest=new Date(Date.now()-86400000).toDateString();
 S.user.streak=S.user.lastDate===yest?S.user.streak+1:1;
 S.user.lastDate=today;
}

// 5. CLAUDE API
// ═══════════════════════════════════════════════════
async function genSents(word,meaning){
 if(S.sc[word])return S.sc[word];
 try{
  const r=await fetch('https://api.anthropic.com/v1/messages',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    model:'claude-sonnet-4-6',max_tokens:800,
    messages:[{role:'user',content:
     `Generate 5 English example sentences for the word "${word}" (Korean: ${meaning}).\nRules: 6-12 words each, A2-B1 level, varied contexts (school, home, nature, work, daily life).\nReturn ONLY a JSON array: ["sentence1","sentence2","sentence3","sentence4","sentence5"]`
    }]
   })
  });
  const data=await r.json();
  const txt=data.content?.[0]?.text||'';
  const m=txt.match(/\[[\s\S]*?\]/);
  if(m){const s=JSON.parse(m[0]);S.sc[word]=s;saveS();return s;}
 }catch(e){}
 // Fallback
 const fb=[
  `I see a ${word} near my house.`,
  `She learned about ${word} at school.`,
  `The ${word} is very important today.`,
  `He wants to understand the ${word}.`,
  `They talked about ${word} together.`
 ];
 S.sc[word]=fb;saveS();return fb;
}

async function preload(words){
 ov(true);
 await Promise.all(words.map(w=>genSents(w.w,w.m)));
 ov(false);
}

  if(AS.idx>=AQ.length)finishAssess();else renderAssess();
 },750);
}

// 9. LEARNING SESSION
// ═══════════════════════════════════════════════════
let LS={
 words:[],idx:0,step:'intro',
 sentIdx:0,showKo:false,
 pronScore:null,pronTries:0,
 recActive:false,recognition:null,
 orderPool:[],orderBuilt:[],orderSent:'',orderWords:[],orderDone:false,orderOk:false
};

async function startLearn(){
 const words=getDayWords();
 if(!words.length){toast('단어를 불러올 수 없어요');showHome();return;}
 const dk='d'+S.user.studyDay;
 if(!S.progress[dk])S.progress[dk]={words:words.map(w=>w.w),done:false,date:new Date().toDateString()};
 saveS();
 LS={words,idx:0,step:'intro',sentIdx:0,showKo:false,pronScore:null,pronTries:0,recActive:false,recognition:null,orderPool:[],orderBuilt:[],orderSent:'',orderWords:[],orderDone:false,orderOk:false};
 await preload(words);
 renderLearn();
 setTimeout(()=>spk(words[0].w),350);
}

function renderLearn(){
 const w=LS.words[LS.idx];
 const total=LS.words.length;
 const pct=Math.round(LS.idx/total*100);
 const stepN={intro:0,sentences:1,order:2};
 const sn=stepN[LS.step]||0;
 const header=`
  <div class="lhdr">
   <div class="ltop">
    <div class="linfo"><div class="lsub">단어 ${LS.idx+1}/${total}</div><div class="ltit">오늘의 학습</div></div>
    <button class="lcls" onclick="showHome()">✕</button>
   </div>
   <div style="padding:0 0 0"><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div></div>
   <div class="steps">${[0,1,2].map(i=>`<div class="sdot ${i<sn?'don':i===sn?'act':''}"></div>`).join('')}</div>
  </div>`;
 if(LS.step==='intro')renderWordIntro(w,header);
 else if(LS.step==='sentences')renderSents(w,header);
 else renderOrder(w,header);
}

// Step 1: Word Introduction
function renderWordIntro(w,header){
 const hasSR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
 let badge='';
 if(LS.pronScore!==null){
  if(LS.pronScore<0)badge=`<div class="sbadge info">💬 음성인식 미지원 · 듣고 따라해 보세요!</div>`;
  else if(LS.pronScore>=0.75)badge=`<div class="sbadge great">🌟 ${Math.round(LS.pronScore*100)}% 일치 · 훌륭해요!</div>`;
  else if(LS.pronScore>=0.45)badge=`<div class="sbadge ok">🔁 ${Math.round(LS.pronScore*100)}% · 한 번 더!</div>`;
  else badge=`<div class="sbadge bad">💪 다시 도전해 보세요!</div>`;
 }
 const canNext=LS.pronScore!==null||LS.pronTries>=3||!hasSR;
 app().innerHTML=`
 <div class="scr" style="padding-bottom:0">
  ${header}
  <div class="wcard" id="wcard">
   <div class="wpos">${w.pos}</div>
   <div class="wen">${w.w.toUpperCase()}</div>
   <div class="wph">[${w.p}]</div>
   <div class="wko">${w.m}</div>
  </div>
  <div class="parea">
   <button class="spk-btn" onclick="spkW()">🔊 발음 듣기</button>
   ${hasSR?`<button class="spk-btn" id="micbtn" onclick="toggleRec()">🎤 따라 말하기 · 탭하여 시작</button>`:`<div class="nospeech">ℹ️ 이 브라우저는 음성인식 미지원 · Safari 또는 Chrome 권장</div>`}
   ${badge}
   <button class="btn ${canNext?'bp':'bs btn-dis'}" onclick="${canNext?'goSents()':'null'}">예문 보기 →</button>
   ${!hasSR?`<button class="btn bp" onclick="goSents()">예문 보기 →</button>`:''}
  </div>
 </div>`;
}
function spkW(){spk(LS.words[LS.idx].w);}
function toggleRec(){
 if(LS.recActive){stopRec();return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){LS.pronScore=-1;renderLearn();return;}
 LS.recActive=true;LS.pronTries++;
 const btn=$('micbtn');if(btn){btn.classList.add('mic');btn.textContent='🔴 녹음 중... · 탭하여 중지';}
 const r=new SR();r.lang='en-US';r.maxAlternatives=5;r.continuous=false;r.interimResults=false;
 r.onresult=(e)=>{
  let best=0;
  for(let i=0;i<e.results[0].length;i++){
   const s=sim(e.results[0][i].transcript,LS.words[LS.idx].w);
   if(s>best)best=s;
  }
  LS.recActive=false;LS.recognition=null;LS.pronScore=best;renderLearn();
  if(best>=0.75)setTimeout(()=>spk(LS.words[LS.idx].w),200);
 };
 r.onerror=()=>{LS.recActive=false;LS.recognition=null;LS.pronScore=0.3;renderLearn();};
 r.onend=()=>{LS.recActive=false;LS.recognition=null;};
 LS.recognition=r;
 try{r.start();setTimeout(()=>{if(LS.recActive&&LS.recognition)try{LS.recognition.stop();}catch(e){}},5500);}
 catch(e){LS.recActive=false;LS.pronScore=-1;renderLearn();}
}
function stopRec(){if(LS.recognition)try{LS.recognition.stop();}catch(e){}LS.recActive=false;}

// Step 2: Example Sentences
function goSents(){LS.step='sentences';LS.sentIdx=0;LS.showKo=false;renderLearn();const sents=S.sc[LS.words[LS.idx].w]||[];if(sents[0])setTimeout(()=>spk(sents[0]),350);}
function renderSents(w,header){
 const sents=S.sc[w.w]||[`I use ${w.w} every day.`];
 const s=sents[LS.sentIdx]||sents[0];
 const hl=s.replace(new RegExp(`\\b${w.w}\\b`,'gi'),`<span class="hl">$&</span>`);
 const isLast=LS.sentIdx>=sents.length-1;
 app().innerHTML=`
 <div class="scr" style="padding-bottom:0">
  ${header}
  <div class="scard">
   <div class="snum">예문 ${LS.sentIdx+1} / ${sents.length}</div>
   <div class="sen">${hl}</div>
   <div class="sko ${LS.showKo?'vis':''}" id="sko">
    <strong style="color:var(--p)">${w.w}</strong> = <strong>${w.m}</strong>
   </div>
   <div class="sctl">
    <button class="btn bs btn-sm" style="width:auto;flex:1" onclick="spkS()">🔊 듣기</button>
    <button class="btn bo btn-sm" style="width:auto;flex:1" onclick="togKo()">${LS.showKo?'🙈 숨기기':'🇰🇷 뜻 보기'}</button>
   </div>
  </div>
  <div class="sdots">${sents.map((_,i)=>`<div class="sdot2 ${i<LS.sentIdx?'don':i===LS.sentIdx?'act':''}"></div>`).join('')}</div>
  <div class="row px mt8">
   ${LS.sentIdx>0?`<button class="btn bo" style="flex:1" onclick="chgS(-1)">← 이전</button>`:'<div style="flex:1"></div>'}
   ${!isLast?`<button class="btn bp" style="flex:1" onclick="chgS(1)">다음 →</button>`:`<button class="btn bok" style="flex:1" onclick="goOrder()">문장 배열 →</button>`}
  </div>
 </div>`;
}
function spkS(){const sents=S.sc[LS.words[LS.idx].w]||[];if(sents[LS.sentIdx])spk(sents[LS.sentIdx]);}
function togKo(){LS.showKo=!LS.showKo;renderLearn();}
function chgS(d){LS.sentIdx=Math.max(0,Math.min((S.sc[LS.words[LS.idx].w]||[]).length-1,LS.sentIdx+d));LS.showKo=false;renderLearn();const s=S.sc[LS.words[LS.idx].w]||[];if(s[LS.sentIdx])setTimeout(()=>spk(s[LS.sentIdx]),150);}

// Step 3: Sentence Ordering
function goOrder(){
 LS.step='order';LS.orderDone=false;LS.orderOk=false;
 const w=LS.words[LS.idx];
 const sents=S.sc[w.w]||[`I like ${w.w} very much.`];
 // Pick a suitable short sentence
 const good=sents.filter(s=>s.replace(/[.,!?]/g,'').split(' ').length<=10&&s.replace(/[.,!?]/g,'').split(' ').length>=4);
 const sent=(good[0]||sents[0]).replace(/[.,!?;:]$/,'');
 LS.orderSent=sent;
 LS.orderWords=sent.split(' ').filter(Boolean);
 LS.orderPool=shuf([...LS.orderWords]).map((wrd,i)=>({wrd,idx:i,used:false}));
 LS.orderBuilt=[];
 renderLearn();
}
function renderOrder(w,header){
 const pool=LS.orderPool;
 const built=LS.orderBuilt;
 const target=LS.orderWords;
 const builtStr=built.map(b=>b.wrd).join(' ');
 const targetStr=target.join(' ');
 const full=built.length===target.length;
 const isOk=full&&builtStr===targetStr;
 const isWrg=full&&!isOk;
 app().innerHTML=`
 <div class="scr" style="padding-bottom:0">
  ${header}
  <div class="px mt8" style="font-size:13px;color:var(--t2)">단어를 탭하여 올바른 순서로 배열하세요</div>
  <div class="otgt ${isOk?'cor':isWrg?'wrg':''}" id="otgt">
   ${built.length===0?`<div style="color:var(--t3);font-size:13px">여기에 단어를 추가하세요...</div>`:''}
   ${built.map((b,i)=>`<button class="wchip built" onclick="rmChip(${i})">${b.wrd}</button>`).join('')}
  </div>
  ${isOk?`<div class="ofb cor">🎉 정답! 훌륭해요! · <em>${targetStr}</em></div>`:isWrg?`<div class="ofb wrg">💪 아쉬워요! 힌트: "${target.slice(0,2).join(' ')}..."</div>`:''}
  <div class="wpool">
   ${pool.map((p,i)=>`<button class="wchip ${p.used?'used':''}" onclick="addChip(${i})">${p.wrd}</button>`).join('')}
  </div>
  <div class="ohint">탭→추가 / 위 단어 탭→제거</div>
  <div class="row px mt12">
   <button class="btn bo" style="flex:0 0 52px;padding:14px 0" onclick="clearOrder()">🔄</button>
   ${isOk?`<button class="btn bok" style="flex:1" onclick="advWord()">다음 단어 →</button>`:isWrg?`<div style="display:flex;gap:8px;flex:1"><button class="btn bp" style="flex:1" onclick="clearOrder()">다시</button><button class="btn bs" style="flex:1" onclick="advWord()">건너뛰기</button></div>`:`<button class="btn ${full?'bp':'bs btn-dis'}" style="flex:1" onclick="${full?'chkOrder()':'null'}">확인 ✓</button>`}
  </div>
 </div>`;
 if(isOk)setTimeout(()=>spk(LS.orderSent),200);
}
function addChip(i){
 const p=LS.orderPool[i];if(!p||p.used)return;
 const wcount=LS.orderWords.filter(w=>w===p.wrd).length;
 const bcount=LS.orderBuilt.filter(b=>b.wrd===p.wrd).length;
 if(bcount>=wcount)return;
 p.used=true;LS.orderBuilt.push({wrd:p.wrd,pidx:i});renderLearn();
}
function rmChip(i){
 const b=LS.orderBuilt[i];if(!b)return;
 LS.orderPool[b.pidx].used=false;
 LS.orderBuilt.splice(i,1);renderLearn();
}
function clearOrder(){LS.orderPool.forEach(p=>p.used=false);LS.orderBuilt=[];renderLearn();}
function chkOrder(){renderLearn();}

function advWord(){
 const w=LS.words[LS.idx];
 S.learned[w.w]={day:S.user.studyDay,mastered:false,rc:0};saveS();
 LS.idx++;
 if(LS.idx>=LS.words.length){startQuiz();return;}
 LS.step='intro';LS.sentIdx=0;LS.showKo=false;LS.pronScore=null;LS.pronTries=0;LS.recActive=false;LS.orderBuilt=[];LS.orderPool=[];
 renderLearn();
 setTimeout(()=>spk(LS.words[LS.idx].w),350);
}

// 10. DAILY QUIZ
// ═══════════════════════════════════════════════════
let QS={qs:[],idx:0,ans:[],retrying:false};
function startQuiz(){
 const words=LS.words;const lv=S.user.level;
 const pool=WORDS[lv]||[];
 const qs=words.map((w,i)=>{
  const t=i%3;
  const wrM=pool.filter(x=>x.w!==w.w).map(x=>x.m).sort(()=>Math.random()-.5).slice(0,3);
  const wrW=pool.filter(x=>x.w!==w.w).map(x=>x.w).sort(()=>Math.random()-.5).slice(0,3);
  if(t===0){const opts=shuf([w.m,...wrM]);return{type:'e2k',w,opts,a:opts.indexOf(w.m)};}
  if(t===1){const opts=shuf([w.w,...wrW]);return{type:'k2e',w,opts,a:opts.indexOf(w.w)};}
  const sents=S.sc[w.w]||[`I have a ${w.w}.`];
  const s=sents[0];
  const bl=s.replace(new RegExp(`\\b${w.w}\\b`,'i'),'______');
  const opts=shuf([w.w,...wrW]);
  return{type:'fill',w,sent:bl,opts,a:opts.indexOf(w.w)};
 });
 QS={qs,idx:0,ans:[],retrying:false};renderQuiz();
}
function renderQuiz(){
 const q=QS.qs[QS.idx];const total=QS.qs.length;
 const pct=Math.round(QS.idx/total*100);
 let qt='',qtext='',qsub='';
 if(q.type==='e2k'){qt='영어 → 한국어';qtext=q.w.w.toUpperCase();qsub='이 단어의 뜻은?';}
 else if(q.type==='k2e'){qt='한국어 → 영어';qtext=`"${q.w.m}"`;qsub='알맞은 영어 단어는?';}
 else{qt='빈칸 채우기';qtext=q.sent;qsub='빈칸에 들어갈 단어는?';}
 app().innerHTML=`
 <div class="scr" style="padding-bottom:0">
  <div class="lhdr">
   <div class="ltop">
    <div class="linfo"><div class="lsub">📝 오늘의 퀴즈</div><div class="ltit">${QS.idx+1} / ${total}</div></div>
    <button class="lcls" onclick="showHome()">✕</button>
   </div>
   <div style="padding:0 0 0"><div class="pbar" style="height:6px"><div class="pfill" style="width:${pct}%"></div></div></div>
  </div>
  <div class="qqcard">
   <div class="qqtype">${qt}</div>
   <div class="qqtext">${qtext}</div>
   <div class="qqsub">${qsub}</div>
  </div>
  <div class="qopts" id="qopts">
   ${q.opts.map((o,i)=>`<button class="qopt" onclick="selQ(${i})">${o}</button>`).join('')}
  </div>
 </div>`;
}
let qlocked=false;
function selQ(idx){
 if(qlocked)return;qlocked=true;
 const q=QS.qs[QS.idx];const ok=idx===q.a;
 QS.ans.push({ok,w:q.w});
 document.querySelectorAll('.qopt').forEach((el,i)=>{if(i===idx)el.classList.add(ok?'ca':'wa');if(i===q.a)el.classList.add('ca');});
 spk(q.w.w);
 setTimeout(()=>{qlocked=false;QS.idx++;QS.idx>=QS.qs.length?finishQuiz():renderQuiz();},850);
}
function finishQuiz(){
 const cor=QS.ans.filter(a=>a.ok).length;
 const tot=QS.ans.length;
 if(cor===tot){completeDay(cor,tot);return;}
 // Show retry screen
 const wrong=QS.ans.filter(a=>!a.ok).map(a=>a.w);
 app().innerHTML=`
 <div class="scr" style="align-items:center;justify-content:center;padding:28px 20px;gap:14px;text-align:center">
  <div style="font-size:56px">😅</div>
  <div style="font-size:24px;font-weight:900">${cor} / ${tot} 정답</div>
  <div style="font-size:14px;color:var(--t2)">100점을 맞아야 오늘 학습이 완료돼요!</div>
  <div style="background:var(--badb);border-radius:var(--rs);padding:14px;width:100%;max-width:310px;text-align:left">
   <div style="font-size:11px;font-weight:700;color:var(--bad);margin-bottom:8px">❌ 틀린 단어</div>
   ${wrong.map(w=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px;border-bottom:1px solid rgba(201,42,42,.1)"><strong>${w.w}</strong><span style="color:var(--t3)">${w.m}</span></div>`).join('')}
  </div>
  <button class="btn bp" style="max-width:290px" onclick="retryWrong()">🔁 틀린 단어 다시 풀기</button>
 </div>`;
}
function retryWrong(){
 const wrong=QS.ans.filter(a=>!a.ok).map(a=>a.w);
 const lv=S.user.level;const pool=WORDS[lv]||[];
 const qs=wrong.map(w=>{
  const wrM=pool.filter(x=>x.w!==w.w).map(x=>x.m).sort(()=>Math.random()-.5).slice(0,3);
  const opts=shuf([w.m,...wrM]);
  return{type:'e2k',w,opts,a:opts.indexOf(w.m)};
 });
 QS={qs,idx:0,ans:[],retrying:true};renderQuiz();
}

 S.progress['d'+day].done=true;S.progress['d'+day].score=Math.round(cor/tot*100);
 S.user.xp+=xp;LS.words.forEach(w=>{if(S.learned[w.w])S.learned[w.w].mastered=true;});
 updateStreak();saveS();
 const isWeekEnd=day%6===0;
 app().innerHTML=`
 <div class="scr">
  <div class="cscr">
   <div class="cemoji">🎉</div>
   <div class="ctit">완벽해요!</div>
   <div class="csub">${day}일차 완료!<br>오늘 10개 단어를 마스터했어요.</div>
   <div class="cxp">+${xp} XP 획득! ⚡</div>
   <div style="display:flex;gap:10px">
    <div style="background:rgba(255,255,255,.2);border-radius:10px;padding:10px 16px;text-align:center">
     <div style="font-size:19px;font-weight:900">🔥${S.user.streak}</div>
     <div style="font-size:10px;opacity:.8">연속일</div>
    </div>
    <div style="background:rgba(255,255,255,.2);border-radius:10px;padding:10px 16px;text-align:center">
     <div style="font-size:19px;font-weight:900">${S.user.xp}</div>
     <div style="font-size:10px;opacity:.8">총 XP</div>
    </div>
   </div>
   <div class="cwsum">
    <div style="font-size:11px;opacity:.7;margin-bottom:7px">오늘 배운 10단어</div>
    ${LS.words.map(w=>`<div class="cwsi"><span><strong>${w.w}</strong> [${w.p}]</span><span style="opacity:.8">${w.m}</span></div>`).join('')}
   </div>
   ${isWeekEnd?`<button class="btn bgold" style="max-width:280px" onclick="startWeekly()">⭐ 주간 복습하기</button>`:''}
   <button class="btn bo" style="max-width:280px" onclick="showHome()">홈으로 →</button>
  </div>
 </div>`;
}

// 12. WEEKLY REVIEW
// ═══════════════════════════════════════════════════
let WS={words:[],idx:0,qs:[],qidx:0,qans:[],phase:'review'};
function startWeekly(){
 const all=getWeekWords();
 if(!all.length){toast('복습할 단어가 없어요');showHome();return;}
 WS={words:shuf(all),idx:0,qs:[],qidx:0,qans:[],phase:'review'};
 renderWeekly();
}
function renderWeekly(){
 if(WS.phase==='review')renderWR();else renderWQ();
}
function renderWR(){
 const w=WS.words[WS.idx];const total=WS.words.length;
 const pct=Math.round(WS.idx/total*100);
 const isLast=WS.idx>=total-1;
 app().innerHTML=`
 <div class="scr" style="padding-bottom:0">
  <div class="whdr">
   <div style="font-size:11px;opacity:.8;margin-bottom:4px">⭐ 주간 복습 · ${WS.idx+1}/${total}</div>
   <div style="font-size:19px;font-weight:900">이번 주 단어 복습</div>
   <div class="pbar mt8" style="background:rgba(255,255,255,.3)"><div class="pfill" style="width:${pct}%;background:#fff"></div></div>
  </div>
  <div class="wfc">
   <div style="font-size:12px;opacity:.75">${w.pos}</div>
   <div style="font-size:38px;font-weight:900;margin:6px 0">${w.w.toUpperCase()}</div>
   <div style="font-size:14px;opacity:.8;margin-bottom:10px">[${w.p}]</div>
   <div style="background:rgba(255,255,255,.25);padding:7px 18px;border-radius:20px;font-size:18px;font-weight:700;display:inline-block">${w.m}</div>
  </div>
  <div class="parea">
   <button class="spk-btn" onclick="spk('${w.w.replace(/'/g,"\\'")}')">🔊 발음 듣기</button>
   <div class="row">
    ${WS.idx>0?`<button class="btn bo" style="flex:1" onclick="wNav(-1)">← 이전</button>`:'<div style="flex:1"></div>'}
    ${!isLast?`<button class="btn bp" style="flex:1" onclick="wNav(1)">다음 →</button>`:`<button class="btn bok" style="flex:1" onclick="startWQ()">퀴즈 시작 →</button>`}
   </div>
  </div>
 </div>`;
 setTimeout(()=>spk(w.w),250);
}
function wNav(d){WS.idx=Math.max(0,Math.min(WS.words.length-1,WS.idx+d));renderWeekly();}
function startWQ(){
 const lv=S.user.level;const pool=WORDS[lv]||[];
 const qs=shuf([...WS.words]).slice(0,Math.min(20,WS.words.length)).map(w=>{
  const wrM=pool.filter(x=>x.w!==w.w).map(x=>x.m).sort(()=>Math.random()-.5).slice(0,3);
  const opts=shuf([w.m,...wrM]);
  return{w,opts,a:opts.indexOf(w.m)};
 });
 WS.qs=qs;WS.qidx=0;WS.qans=[];WS.phase='quiz';renderWeekly();
}
let wqlocked=false;
function renderWQ(){
 const q=WS.qs[WS.qidx];const total=WS.qs.length;
 const pct=Math.round(WS.qidx/total*100);
 app().innerHTML=`
 <div class="scr" style="padding-bottom:0">
  <div class="lhdr">
   <div class="ltop">
    <div class="linfo"><div class="lsub">⭐ 주간 퀴즈</div><div class="ltit">${WS.qidx+1} / ${total}</div></div>
   </div>
   <div style="padding:0 0 0"><div class="pbar" style="height:7px"><div class="pfill" style="width:${pct}%;background:linear-gradient(90deg,var(--gold),#c77700)"></div></div></div>
  </div>
  <div class="qqcard" style="border-left:4px solid var(--gold)">
   <div class="qqtype" style="color:var(--gold)">영어 → 한국어</div>
   <div class="qqtext">${q.w.w.toUpperCase()}</div>
   <div class="qqsub">이 단어의 뜻은?</div>
  </div>
  <div class="qopts" id="wqopts">
   ${q.opts.map((o,i)=>`<button class="qopt" onclick="selWQ(${i})">${o}</button>`).join('')}
  </div>
 </div>`;
}
function selWQ(idx){
 if(wqlocked)return;wqlocked=true;
 const q=WS.qs[WS.qidx];const ok=idx===q.a;
 WS.qans.push({ok,w:q.w});
 document.querySelectorAll('#wqopts .qopt').forEach((el,i)=>{if(i===idx)el.classList.add(ok?'ca':'wa');if(i===q.a)el.classList.add('ca');});
 spk(q.w.w);
 setTimeout(()=>{wqlocked=false;WS.qidx++;WS.qidx>=WS.qs.length?finishWQ():renderWQ();},850);
}
function finishWQ(){
 const cor=WS.qans.filter(a=>a.ok).length;
 const tot=WS.qans.length;
 const pct=Math.round(cor/tot*100);
 const passed=pct>=80;
 if(passed){
  const wn=Math.ceil(S.user.studyDay/6);
  S.progress['wr'+wn]={done:true,score:pct,date:new Date().toDateString()};
  S.user.xp+=200;S.user.weekNum++;
  S.user.studyDay++;updateStreak();saveS();
 }
 app().innerHTML=`
 <div class="scr" style="background:${passed?'linear-gradient(160deg,var(--ok),#40C057)':'var(--bg)'};min-height:100vh;align-items:center;justify-content:center;padding:32px 22px;gap:14px;text-align:center;display:flex;flex-direction:column;color:${passed?'#fff':'var(--t1)'}">
  <div style="font-size:56px">${passed?'🏆':'💪'}</div>
  <div style="font-size:24px;font-weight:900">${passed?'주간 마스터!':'조금 더 노력해봐요'}</div>
  <div style="font-size:15px;opacity:.9">${cor}/${tot}문제 · ${pct}%</div>
  ${passed?`<div style="background:rgba(255,255,255,.2);border-radius:10px;padding:10px 22px;font-size:19px;font-weight:900">+200 XP ⚡</div>`:`<div style="background:var(--badb);border-radius:10px;padding:12px 18px;font-size:14px;color:var(--bad)">80% 이상 맞혀야 통과!<br>다시 복습해 보세요.</div>`}
  ${passed?`<button class="btn" style="background:rgba(255,255,255,.25);color:#fff;max-width:280px;border:2px solid rgba(255,255,255,.4)" onclick="showHome()">홈으로 →</button>`:`
   <button class="btn bp" style="max-width:280px" onclick="startWeekly()">🔄 다시 복습</button>
   <button class="btn bs" style="max-width:280px" onclick="showHome()">나중에 하기</button>`}
 </div>`;
}

// ═══════════════════════════════════════════════════
// 13. INIT
// ═══════════════════════════════════════════════════
loadS();
if(!S.user.level)showSplash();else showHome();
</script>
</body>
</html>
