<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title>차량 오디오 주파수 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e2e6ec;
    --txt:#2b2f36; --sub:#6b7280; --accent:#2563eb; --accent2:#0891b2;
    --danger:#dc2626; --ok:#16a34a; --warn:#d97706;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;
       display:flex;flex-direction:column;}
  a{ pointer-events:none; }

  .nav{background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto;}
  .nav-inner{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .brand{font-weight:900;font-size:15px;}
  .ver{font-size:11px;color:var(--sub);background:#eef2f7;padding:2px 8px;border-radius:10px;margin-left:6px;}
  .modeToggle{display:flex;background:#eef1f5;border-radius:8px;padding:3px;gap:3px;}
  .modeToggle button{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;touch-action:manipulation;}
  .modeToggle button.active{background:var(--accent);color:#fff;}

  .tabbar{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:6px 10px;}
  .tabbar button{flex:1;border:1px solid var(--line);background:#f8fafc;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;touch-action:manipulation;}
  .tabbar button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  #liveTab{flex:1 1 auto;display:none;flex-direction:column;min-height:0;background:#0f172a;}
  #liveCanvasWrap{flex:1 1 auto;min-height:0;position:relative;}
  #liveCanvas{width:100%;height:100%;display:block;}
  #liveOverlay{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;}
  #liveOverlay .status{background:rgba(0,0,0,0.45);color:#e5e7eb;font-size:12px;padding:4px 12px;border-radius:12px;}
  #liveOverlay .status.on{color:#4ade80;font-weight:700;}

  #controlBar{flex:0 0 auto;background:#111827;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;}
  #controlBar button{touch-action:manipulation;font-family:inherit;font-weight:800;border:none;border-radius:10px;cursor:pointer;font-size:14px;padding:14px 10px;}
  #btnToggleMeasure{flex:1.3;background:var(--accent);color:#fff;}
  #btnToggleMeasure.recording{background:var(--danger);}
  #btnAnalyze{flex:1;background:var(--ok);color:#fff;}
  #btnAnalyze:disabled{background:#374151;color:#6b7280;cursor:not-allowed;}

  .bandLegend{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;pointer-events:none;}
  .bandLegend span{font-size:10px;color:rgba(255,255,255,0.65);background:rgba(0,0,0,0.35);padding:2px 7px;border-radius:8px;}

  #analyzeSheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;
    box-shadow:0 -6px 24px rgba(0,0,0,0.25);padding:16px;transform:translateY(110%);
    transition:transform .25s ease;z-index:200;max-height:82vh;overflow-y:auto;}
  #analyzeSheet.open{transform:translateY(0);}
  #analyzeSheet h3{margin:0 0 10px;font-size:15px;}
  .bandRow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .bandRow b{color:var(--txt);}
  .bandRow .val{font-weight:800;color:var(--accent);}
  #dimOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:190;}
  #dimOverlay.show{display:block;}
  #analyzeSheet input[type=text]{font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;margin:10px 0;color:var(--txt);}
  #analyzeSheet .row{display:flex;gap:8px;}
  #analyzeSheet .row button{flex:1;font-family:inherit;font-weight:800;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:13px;}
  #analyzeSheet .btnSave{background:var(--ok);color:#fff;}
  #analyzeSheet .btnClose{background:#6b7280;color:#fff;}

  #compareTab{flex:1 1 auto;display:none;overflow-y:auto;}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .card h2{font-size:14px;margin:0 0 8px;color:var(--txt);}
  button.btn{font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;color:#fff;background:var(--accent);touch-action:manipulation;}
  button.btn.gray{background:#6b7280;}
  button.btn.danger{background:var(--danger);}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;color:var(--txt);}
  th{color:var(--sub);font-weight:700;background:#f8fafc;}
  .chk{width:16px;height:16px;}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:var(--accent);font-weight:700;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--sub);}
  .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  #cmpCanvas{width:100%;background:#0f172a;border-radius:10px;}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div><span class="brand">🚗 차량 오디오 주파수 분석기</span><span class="ver">v2.1</span></div>
    <div class="modeToggle">
      <button id="modeMobile" class="active">모바일</button>
      <button id="modePc">PC</button>
    </div>
  </div>
</div>

<div class="tabbar">
  <button class="tabBtn active" data-tab="live">실시간 측정</button>
  <button class="tabBtn" data-tab="compare">저장 데이터 비교</button>
</div>

<div id="liveTab">
  <div id="liveCanvasWrap">
    <canvas id="liveCanvas"></canvas>
    <div id="liveOverlay"><span class="status" id="micStatus">버튼을 눌러 측정을 시작하세요</span></div>
    <div class="bandLegend">
      <span>저음 20-250Hz</span><span>중저음 250-500Hz</span><span>중음 500-2k</span><span>중고음 2k-6k</span><span>고음 6k-20k</span>
    </div>
  </div>
  <div id="controlBar">
    <button id="btnToggleMeasure">🎙 측정 시작</button>
    <button id="btnAnalyze" disabled>📊 분석 (3초)</button>
  </div>
</div>

<div id="dimOverlay"></div>
<div id="analyzeSheet">
  <h3>분석 결과</h3>
  <div id="bandResults"></div>
  <input type="text" id="carName" placeholder="차량명/조건 입력 (예: 소나타DN8_기본세팅)">
  <div id="saveError" style="display:none;background:#fef2f2;color:#b91c1c;font-size:12px;padding:8px 10px;border-radius:8px;margin-bottom:8px;white-space:pre-wrap;"></div>
  <div class="row">
    <button class="btnSave" id="btnSave">Firebase에 저장</button>
    <button class="btnClose" id="btnCloseSheet">닫기</button>
  </div>
</div>

<div id="compareTab">
  <div class="wrap">
    <div class="card">
      <h2>저장된 측정 목록 (최대 2개 선택하여 비교)</h2>
      <div class="row" style="margin-bottom:8px;">
        <button class="btn gray" id="btnRefresh">목록 새로고침</button>
      </div>
      <table id="listTable">
        <thead><tr><th></th><th>차량/조건명</th><th>측정일시</th><th>삭제</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>비교 그래프</h2>
      <canvas id="cmpCanvas" width="1000" height="360"></canvas>
      <div class="legend" id="cmpLegend"></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBYqd2uRr1ZvFLDCWuS15h9qFkT-Dvg5Es",
  authDomain: "insys-work.firebaseapp.com",
  projectId: "insys-work",
  storageBucket: "insys-work.appspot.com",
  messagingSenderId: "225275784859",
  appId: "1:225275784859:web:bd12815c6dc47c0c49e03e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL = "audio_freq_measurements";
let authReady = false;
firebase.auth().signInAnonymously()
  .then(()=>{ authReady = true; })
  .catch(e=>{ console.warn('익명 로그인 실패(계속 진행):', e.code, e.message); });

document.getElementById('modeMobile').onclick = function(){this.classList.add('active');document.getElementById('modePc').classList.remove('active');};
document.getElementById('modePc').onclick = function(){this.classList.add('active');document.getElementById('modeMobile').classList.remove('active');};

const liveTab = document.getElementById('liveTab');
const compareTab = document.getElementById('compareTab');
document.querySelectorAll('.tabBtn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(b.dataset.tab==='live'){
      liveTab.style.display='flex'; compareTab.style.display='none';
      resizeCanvas();
    }else{
      liveTab.style.display='none'; compareTab.style.display='block';
      loadList();
    }
  };
});

let audioCtx, analyser, micSource, dataArray, rafId, mediaStream;
let sampleRate = 44100;
const FFT_SIZE = 8192;
const FREQ_MIN = 20, FREQ_MAX = 20000;
let measuring = false;
let accumulating = false;
let accumSum = null, accumCount = 0, accumTarget = 30;

const liveCanvas = document.getElementById('liveCanvas');
const lctx = liveCanvas.getContext('2d');

function resizeCanvas(){
  const wrap = document.getElementById('liveCanvasWrap');
  liveCanvas.width = wrap.clientWidth;
  liveCanvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

document.getElementById('btnToggleMeasure').onclick = async ()=>{
  if(!measuring){
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      sampleRate = audioCtx.sampleRate;
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = FFT_SIZE;
      analyser.smoothingTimeConstant = 0.55;
      micSource = audioCtx.createMediaStreamSource(mediaStream);
      micSource.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      measuring = true;
      resizeCanvas();
      document.getElementById('micStatus').textContent = '측정 중 (SR:'+sampleRate+'Hz)';
      document.getElementById('micStatus').classList.add('on');
      const btn = document.getElementById('btnToggleMeasure');
      btn.textContent = '⏹ 측정 정지';
      btn.classList.add('recording');
      document.getElementById('btnAnalyze').disabled = false;
      draw();
    }catch(e){
      alert('마이크 접근 실패: '+e.message);
    }
  } else {
    stopMeasuring();
  }
};

function stopMeasuring(){
  measuring = false;
  accumulating = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
  if(audioCtx) audioCtx.close();
  document.getElementById('micStatus').textContent = '측정 정지됨';
  document.getElementById('micStatus').classList.remove('on');
  const btn = document.getElementById('btnToggleMeasure');
  btn.textContent = '🎙 측정 시작';
  btn.classList.remove('recording');
  document.getElementById('btnAnalyze').disabled = true;
}

function freqToBin(freq){
  return Math.min(analyser.frequencyBinCount-1, Math.round(freq / (sampleRate/2) * analyser.frequencyBinCount));
}

function draw(){
  if(!measuring) return;
  analyser.getByteFrequencyData(dataArray);
  const w = liveCanvas.width, h = liveCanvas.height;
  lctx.clearRect(0,0,w,h);
  lctx.fillStyle = '#0f172a';
  lctx.fillRect(0,0,w,h);

  const barCount = Math.max(28, Math.min(80, Math.floor(w/14)));
  const gap = 3;
  const barW = (w - gap*(barCount-1)) / barCount;
  const logMin = Math.log10(FREQ_MIN), logMax = Math.log10(FREQ_MAX);

  for(let i=0;i<barCount;i++){
    const t = (i+0.5)/barCount;
    const freq = Math.pow(10, logMin + t*(logMax-logMin));
    const bin = freqToBin(freq);
    const val = dataArray[bin] || 0;
    const barH = (val/255)*h*0.92;
    const hue = 260 - t*260;
    const x = i*(barW+gap);
    const y = h - barH;
    const grad = lctx.createLinearGradient(0,y,0,h);
    grad.addColorStop(0, `hsl(${hue},90%,60%)`);
    grad.addColorStop(1, `hsl(${hue},90%,35%)`);
    lctx.fillStyle = grad;
    lctx.fillRect(x, y, barW, barH);
  }

  lctx.font = '10px Noto Sans KR';
  lctx.fillStyle = 'rgba(255,255,255,0.5)';
  [20,50,100,200,500,1000,2000,5000,10000,20000].forEach(f=>{
    const xt = ((Math.log10(f)-logMin)/(logMax-logMin))*w;
    const label = f>=1000 ? (f/1000)+'k' : f;
    lctx.fillText(label, Math.min(xt,w-24), h-4);
  });

  if(accumulating){
    for(let b=0;b<dataArray.length;b++) accumSum[b]+=dataArray[b];
    accumCount++;
    const pct = Math.round(accumCount/accumTarget*100);
    document.getElementById('micStatus').textContent = '분석 중... '+pct+'%';
    if(accumCount>=accumTarget){
      finishAnalyze();
    }
  }

  rafId = requestAnimationFrame(draw);
}

let lastAnalysis = null;
document.getElementById('btnAnalyze').onclick = ()=>{
  if(!measuring || accumulating) return;
  accumSum = new Float64Array(analyser.frequencyBinCount);
  accumCount = 0;
  accumulating = true;
  document.getElementById('btnAnalyze').disabled = true;
};

function bandAvg(points, lo, hi){
  const filtered = points.filter(p=>p.f>=lo && p.f<hi);
  if(filtered.length===0) return 0;
  return Math.round(filtered.reduce((s,p)=>s+p.v,0)/filtered.length*10)/10;
}

function finishAnalyze(){
  accumulating = false;
  document.getElementById('btnAnalyze').disabled = false;
  document.getElementById('micStatus').textContent = measuring ? ('측정 중 (SR:'+sampleRate+'Hz)') : '측정 정지됨';

  const logMin = Math.log10(FREQ_MIN), logMax = Math.log10(FREQ_MAX);
  const points = [];
  for(let i=0;i<150;i++){
    const freq = Math.pow(10, logMin + (i/149)*(logMax-logMin));
    const bin = freqToBin(freq);
    const avg = (accumSum[bin]||0)/accumCount;
    points.push({f:Math.round(freq), v:Math.round(avg*10)/10});
  }
  lastAnalysis = points;

  const bands = [
    {name:'저음 (20-250Hz)', lo:20, hi:250},
    {name:'중저음 (250-500Hz)', lo:250, hi:500},
    {name:'중음 (500Hz-2kHz)', lo:500, hi:2000},
    {name:'중고음 (2k-6kHz)', lo:2000, hi:6000},
    {name:'고음 (6k-20kHz)', lo:6000, hi:20000},
  ];
  let html = '';
  bands.forEach(b=>{
    const avg = bandAvg(points, b.lo, b.hi);
    html += `<div class="bandRow"><b>${b.name}</b><span class="val">${avg} / 255</span></div>`;
  });
  document.getElementById('bandResults').innerHTML = html;
  openSheet();
}

function openSheet(){
  document.getElementById('analyzeSheet').classList.add('open');
  document.getElementById('dimOverlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('analyzeSheet').classList.remove('open');
  document.getElementById('dimOverlay').classList.remove('show');
}
document.getElementById('btnCloseSheet').onclick = closeSheet;
document.getElementById('dimOverlay').onclick = closeSheet;

document.getElementById('btnSave').onclick = async ()=>{
  const errBox = document.getElementById('saveError');
  errBox.style.display = 'none';
  const name = document.getElementById('carName').value.trim();
  if(!name){ alert('차량명/조건을 입력하세요.'); return; }
  if(!lastAnalysis){ alert('먼저 분석을 진행하세요.'); return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    await db.collection(COL).add({
      name: name,
      points: lastAnalysis,
      sampleRate: sampleRate,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('저장 완료되었습니다.');
    document.getElementById('carName').value='';
    closeSheet();
  }catch(e){
    console.error('Firestore 저장 오류:', e);
    errBox.style.display = 'block';
    errBox.textContent = '저장 실패 [' + (e.code||'unknown') + ']\n' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Firebase에 저장';
};

const cmpCanvas = document.getElementById('cmpCanvas');
const cctx = cmpCanvas.getContext('2d');
const COLORS = ['#22d3ee','#f97316','#a3e635','#f472b6'];
let allDocs = [];

function freqToX(freq, width){
  const logMin = Math.log10(FREQ_MIN), logMax = Math.log10(FREQ_MAX);
  return ( (Math.log10(freq)-logMin) / (logMax-logMin) ) * width;
}

async function loadList(){
  const body = document.getElementById('listBody');
  body.innerHTML = '<tr><td colspan="4">불러오는 중...</td></tr>';
  let snap;
  try{
    snap = await db.collection(COL).orderBy('createdAt','desc').limit(50).get();
  }catch(e){
    console.error('Firestore 조회 오류:', e);
    body.innerHTML = '<tr><td colspan="4" style="color:#b91c1c;">목록 조회 실패 ['+(e.code||'unknown')+'] '+e.message+'</td></tr>';
    return;
  }
  allDocs = [];
  snap.forEach(doc=>allDocs.push({id:doc.id, ...doc.data()}));
  if(allDocs.length===0){ body.innerHTML='<tr><td colspan="4">저장된 데이터가 없습니다.</td></tr>'; return; }
  body.innerHTML = allDocs.map((d,i)=>{
    const dt = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleString('ko-KR') : '-';
    return `<tr>
      <td><input type="checkbox" class="chk cmpChk" data-idx="${i}"></td>
      <td><span class="tag">${escapeHtml(d.name)}</span></td>
      <td>${dt}</td>
      <td><button class="btn danger" style="padding:4px 10px;font-size:11px;" onclick="delDoc('${d.id}')">삭제</button></td>
    </tr>`;
  }).join('');
  document.querySelectorAll('.cmpChk').forEach(c=>c.onchange=onChkChange);
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function onChkChange(){
  const checked = [...document.querySelectorAll('.cmpChk:checked')];
  if(checked.length>2){
    this.checked=false;
    alert('최대 2개까지 비교 가능합니다.');
    return;
  }
  drawCompare(checked.map(c=>allDocs[c.dataset.idx]));
}

function drawCompare(docs){
  const w=cmpCanvas.width,h=cmpCanvas.height;
  drawGridStatic(cctx,w,h);
  const legend = document.getElementById('cmpLegend');
  legend.innerHTML = '';
  docs.forEach((d,idx)=>{
    const color = COLORS[idx%COLORS.length];
    cctx.beginPath();
    cctx.strokeStyle = color;
    cctx.lineWidth = 2;
    d.points.forEach((p,i)=>{
      const x = freqToX(p.f,w);
      const y = h-(p.v/255)*h;
      if(i===0) cctx.moveTo(x,y); else cctx.lineTo(x,y);
    });
    cctx.stroke();
    legend.innerHTML += `<span><span class="dot" style="background:${color}"></span>${escapeHtml(d.name)}</span>`;
  });
}

function drawGridStatic(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  const marks=[20,50,100,200,500,1000,2000,5000,10000,20000];
  ctx.font='10px Noto Sans KR';
  marks.forEach(f=>{
    const x=freqToX(f,w);
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.45)';
    const label = f>=1000?(f/1000)+'k':f;
    ctx.fillText(label+'Hz', Math.min(x+3,w-30), h-4);
  });
  for(let db=0;db<=100;db+=20){
    const y=h-(db/100)*h;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillText(db,4,y-2);
  }
}

window.delDoc = async function(id){
  if(!confirm('이 측정 데이터를 삭제하시겠습니까?')) return;
  await db.collection(COL).doc(id).delete();
  loadList();
};

document.getElementById('btnRefresh').onclick = loadList;

liveTab.style.display='flex';
resizeCanvas();
</script>
