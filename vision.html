<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB 비전 검사 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E3A5F; --navy-dark:#122540; --text:#2B3648; --text-light:#5B6472;
    --bg:#F3F5F9; --card-bg:#FFFFFF; --card-header-bg:#E7EFFA; --border:#E1E6ED;
    --accent:#2D5C99; --success:#16A34A; --danger:#DC2626; --warning:#C2740A; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;}
  header.cover{background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#F4F7FB;padding:14px 20px;}
  header.cover .inner{max-width:1200px;margin:0 auto;text-align:center;}
  header.cover h1{font-size:21px;font-weight:900;margin:0 0 4px;}
  header.cover p{margin:0;font-size:12.5px;color:#C7D4E6;}
  .container{max-width:1200px;margin:0 auto;padding:16px 20px 50px;}
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(20,40,63,.05);margin-bottom:16px;}
  .card-header{background:var(--card-header-bg);padding:11px 16px;font-weight:700;color:var(--navy-dark);font-size:14.5px;border-bottom:1px solid var(--border);}
  .card-body{padding:14px 16px;}
  .grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:start;}
  .left-col{display:flex;flex-direction:column;}
  @media (max-width:900px){.grid2{grid-template-columns:1fr;}}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  button{font-family:inherit;font-size:13.5px;font-weight:700;padding:10px 15px;border-radius:8px;border:1px solid var(--border);background:#F5F7FA;color:var(--navy-dark);cursor:pointer;}
  button:hover{background:#EAF0F8;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  button.primary:hover{background:var(--navy-dark);}
  button.sig{background:#FDF3E3;color:#8A5407;border-color:#E6C79A;}
  button.sig:not(:disabled){background:var(--warning);color:#fff;border-color:var(--warning);animation:sigPulse 1.1s ease-in-out infinite;}
  button.resume:not(:disabled){background:var(--danger);color:#fff;border-color:var(--danger);animation:sigPulse .8s ease-in-out infinite;}
  @keyframes sigPulse{0%,100%{box-shadow:0 0 0 0 rgba(194,116,10,.5);}50%{box-shadow:0 0 0 7px rgba(194,116,10,0);}}
  button.danger{background:#FCEBEA;color:var(--danger);border-color:#F4C6C3;}
  select,input[type=range]{font-family:inherit;font-size:13.5px;}
  select{padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);}
  .hint{font-size:12px;color:var(--text-light);margin-top:8px;}
  svg{width:100%;height:auto;display:block;}
  .statechips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text-light);background:#F7F9FC;}
  .chip b{color:var(--navy-dark);}
  .chip.on{background:var(--success);color:#fff;border-color:var(--success);}
  .chip.on b{color:#fff;}
  .chip.focus{background:#EAF1FB;border-color:#BCD3EF;}
  .chip.focus b{color:var(--accent);}
  .verdict-box{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .verdict-lamp{flex:0 0 auto;width:82px;height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;color:#fff;background:#C9CDD3;letter-spacing:1px;}
  .verdict-lamp.ok{background:var(--success);}
  .verdict-lamp.ng{background:var(--danger);}
  .mes-ind{font-size:12.5px;font-weight:700;color:var(--text-light);}
  .mes-ind.sending{color:var(--accent);}
  .mes-ind .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#C9CDD3;margin-right:5px;}
  .mes-ind.sending .dot{background:var(--accent);animation:sigPulse 1s infinite;}
  .alarm-banner{display:none;background:var(--danger);color:#fff;font-weight:900;text-align:center;padding:10px;border-radius:8px;margin-bottom:10px;animation:alarmBlink .7s step-end infinite;}
  .alarm-banner.show{display:block;}
  @keyframes alarmBlink{0%,100%{opacity:1;}50%{opacity:.55;}}
  .blinkRed{animation:alarmBlink .7s step-end infinite;}
  .steps{overflow:visible;}
  .step{display:flex;gap:9px;align-items:flex-start;padding:6px 9px;border-radius:7px;font-size:12px;border:1px solid transparent;}
  .step .no{flex:0 0 20px;height:20px;border-radius:50%;background:#EDEFF3;color:var(--text-light);font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center;}
  .step.done .no{background:var(--success);color:#fff;}
  .step.cur{background:#EAF1FB;border-color:#BCD3EF;}
  .step.cur .no{background:var(--navy);color:#fff;}
  .step.wait.cur{background:#FBF1DF;border-color:#E6C79A;}
  .step.wait.cur .no{background:var(--warning);color:#fff;}
  .phase-h{font-size:11.5px;font-weight:900;color:var(--navy-dark);margin:10px 0 4px;padding-left:4px;}
  .phase-h:first-child{margin-top:0;}
  .log-card pre{margin:0;max-height:150px;overflow-y:auto;background:#F8F9FB;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:'Noto Sans KR',monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;}
  label.ck{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy-dark);cursor:pointer;}
  footer{text-align:center;padding:10px 20px 18px;font-size:11.5px;color:var(--text-light);}
  .counter{font-size:12.5px;font-weight:700;color:var(--navy-dark);}

  /* ===== 여백 축소 ===== */
  header.cover{padding:9px 16px;}
  header.cover h1{font-size:18px;margin:0;}
  .container{padding:10px 14px 24px;}
  .card{margin-bottom:10px;}
  .card-header{padding:7px 12px;font-size:13.5px;}
  .card-body{padding:9px 12px;}
  .grid2{gap:10px;}
  .statechips{gap:5px;margin-bottom:7px;}
  .chip{font-size:11px;padding:4px 8px;}
  .verdict-box{gap:10px;margin-bottom:7px;}
  .verdict-lamp{width:66px;height:44px;font-size:18px;}
  .alarm-banner{padding:8px;margin-bottom:7px;font-size:13px;}
  button{padding:8px 13px;font-size:13px;}
  .step{padding:4px 8px;}
  .phase-h{margin:7px 0 3px;}

  /* ===== 모바일: 애니메이션 상단 고정 + 진행 스텝 1줄 ===== */
  .step-mobile{display:none;}
  @media (max-width:900px){
    .grid2{grid-template-columns:1fr;}
    .left-col{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:2px;}
    .left-col .card:first-child{margin-bottom:6px;}
    /* 전체 플로우 목록은 감추고, 현재 진행 1줄만 표시 */
    .flow-card{display:none;}
    .step-mobile{
      display:flex;align-items:center;gap:8px;
      background:#EAF1FB;border:1px solid #BCD3EF;border-radius:8px;
      padding:7px 10px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--navy-dark);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .step-mobile .no{flex:0 0 20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
      font-size:10.5px;display:flex;align-items:center;justify-content:center;}
    .step-mobile.wait{background:#FBF1DF;border-color:#E6C79A;}
    .step-mobile.wait .no{background:var(--warning);}
    .step-mobile.alarm{background:#FCEBEA;border-color:#F4C6C3;color:var(--danger);}
    .step-mobile.alarm .no{background:var(--danger);}
    .container{padding:8px 10px 20px;}
    .verdict-lamp{width:58px;height:40px;font-size:16px;}
    .log-card pre{max-height:110px;}
    #curStateText{display:none;}
  }
</style>
</head>
<body>

<header class="cover">
  <div class="inner">
    <h1>PCB 비전 검사 시뮬레이터</h1>
  </div>
</header>

<main class="container">
  <div class="grid2">
    <div class="left-col">
    <section class="card">
      <div class="card-header">동작 애니메이션</div>
      <div class="card-body">
        <div id="stepMobile" class="step-mobile"><span class="no">1</span><span id="stepMobileText">START 대기</span></div>
        <div id="alarmBanner" class="alarm-banner">⚠ NG 검사 중단 — NG품 제거 후 [검사 계속]</div>
        <div class="statechips">
          <span class="chip focus">초점 <b id="focalVal">-</b></span>
          <span class="chip focus">기울기 <b id="tiltVal">-</b></span>
          <span class="chip focus">정렬 <b id="alignVal">-</b></span>
          <span class="chip" id="chipLamp">조명 <b id="lampVal">OFF</b></span>
          <span class="chip" id="chipSen">센서 <b id="senVal">OFF</b></span>
        </div>

        <div class="verdict-box">
          <div class="verdict-lamp" id="verdictLamp">--</div>
          <div>
            <div style="font-size:11.5px;color:var(--text-light);">판정</div>
            <div class="mes-ind" id="mesInd"><span class="dot"></span>MES 전송: 대기</div>
          </div>
          <div style="margin-left:auto;">
            <div style="font-size:11px;color:var(--text-light);margin-bottom:3px;">데모</div>
            <select id="verdictSel">
              <option value="auto">자동</option>
              <option value="OK">항상 OK</option>
              <option value="NG">항상 NG</option>
            </select>
          </div>
        </div>

        <svg viewBox="20 -112 660 478" id="scene"></svg>
        <div class="row" style="margin-top:4px;gap:8px;">
          <span style="font-size:12px;color:var(--text-light);white-space:nowrap;">시점 <b id="yawVal" style="color:var(--navy-dark);">35°</b></span>
          <input type="range" id="viewYaw" min="0" max="90" value="35" style="flex:1;min-width:120px;">
          <button id="btnFront" style="padding:4px 9px;font-size:11.5px;">정면</button>
          <button id="btnIso" style="padding:4px 9px;font-size:11.5px;">45°</button>
          <button id="btnSide" style="padding:4px 9px;font-size:11.5px;">측면</button>
        </div>
        <div class="row" style="margin-top:6px;">
          <span class="counter">완료 <span id="cycleCount">0</span></span>
          <span class="counter" style="color:var(--success);">OK <span id="okCount">0</span></span>
          <span class="counter" style="color:var(--danger);">NG <span id="ngCount">0</span></span>
        </div>
        <p class="hint" id="curStateText"></p>
      </div>
    </section>

    <section class="card">
      <div class="card-header">운전 / 신호 제어</div>
      <div class="card-body">
        <div class="row" style="margin-bottom:12px;">
          <button id="btnRun" class="primary">▶ 자동 운전 시작</button>
          <button id="btnStop" class="danger">■ 정지</button>
          <button id="btnReset">↺ 초기화</button>
          <label class="ck"><input type="checkbox" id="autoSig" checked> 자동신호</label>
          <span style="margin-left:auto;display:flex;align-items:center;gap:8px;">
            <span style="font-size:12px;color:var(--text-light);">속도</span>
            <input type="range" id="speed" min="1" max="10" value="6" style="width:130px;">
          </span>
        </div>
        <div class="row">
          <button id="sigStart" class="sig" disabled>START</button>
          <button id="btnResume" class="resume" disabled>검사 계속</button>
        </div>
      </div>
    </section>
    </div><!-- /left-col -->

    <section class="card flow-card">
      <div class="card-header">전체 로직 플로우</div>
      <div class="card-body"><div class="steps" id="stepList"></div></div>
    </section>
  </div>

  <section class="card log-card">
    <div class="card-header">동작 로그</div>
    <div class="card-body">
      <div class="row" style="margin-bottom:10px;"><button id="clearLog">로그 지우기</button></div>
      <pre id="logBox"></pre>
    </div>
  </section>
</main>

<footer>인시스 AI혁신 연구개발실 · ys.kim@in-sys.co.kr · v1.3</footer>

<script>
  // ===== 3D 월드 좌표 (X:컨베이어 방향, Y:안쪽 깊이, Z:높이) =====
  const BELT_X0=40, BELT_X1=660;          // 컨베이어 길이
  const BELT_Y0=0,  BELT_Y1=70;           // 컨베이어 폭(깊이)
  const BELT_Z=60,  BELT_TH=18;           // 벨트 상면 높이 / 두께
  const RAIL_W=9,   RAIL_Z=64;            // 알루미늄 사이드 프레임(가장자리 낮춤)
  const INSPECT_X=330;                    // 검사위치
  const PCB_Z=BELT_Z+3, PCB_YC=(BELT_Y0+BELT_Y1)/2;
  const FOCUS_PX=90, FOCUS_MM=300;        // 90 world unit ≙ 300mm
  const S3={X:470, Y:190, Z:150};         // 로봇 어깨(컨베이어 뒤쪽)
  const L1=125, L2=115;                   // 링크 길이
  const HOME={X:470, Y:120, Z:205, cam:0};// 대기 자세(렌즈 위치/카메라 기울기)
  // 시점(축측 투영): yaw 0°=정면, 90°=측면
  const VIEW={yaw:35, pitch:22};
  const VCX=350, VCY=236, VOX=330, VOY=60;
  function P(X,Y,Z){
    const ty=VIEW.yaw*Math.PI/180, tp=VIEW.pitch*Math.PI/180;
    const x0=X-VOX, y0=Y-VOY;
    const sx=VCX + x0*Math.cos(ty) - y0*Math.sin(ty);
    const dep=x0*Math.sin(ty) + y0*Math.cos(ty);
    const sy=VCY - Z*Math.cos(tp) - dep*Math.sin(tp);
    return {x:sx, y:sy, d:dep};
  }
  const pt=p=>p.x.toFixed(1)+','+p.y.toFixed(1);
  function quad(a,b,c,d,fill,stroke,sw){
    return `<polygon points="${pt(a)} ${pt(b)} ${pt(c)} ${pt(d)}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw||1}"`:''}/>`;
  }

  // ===== 로직 플로우 =====
  const STATES=[
    { phase:'대기', type:'wait', signal:'START', label:'START 대기' },
    // LOOP_START = 1
    { phase:'투입', type:'convIn', label:'PCB 투입 → 검사위치 정지' },
    { phase:'투입', type:'sensor', on:true, label:'검사위치 센서 감지' },
    { phase:'비전 정렬', type:'pose', to:'inspect', label:'카메라 접근 · 직각 정렬' },
    { phase:'비전 정렬', type:'aligned', label:'정렬 완료 · 초점 300mm' },
    { phase:'비전 검사', type:'light', on:true, label:'돔 조명 ON' },
    { phase:'비전 검사', type:'scan', label:'비전 스캔' },
    { phase:'판정', type:'verdict', label:'판정 + MES 전송' },
    { phase:'판정', type:'alarmwait', cond:'ng', signal:'RESUME', label:'NG 알람 · 제거 대기' },
    { phase:'배출', type:'light', on:false, label:'돔 조명 OFF' },
    { phase:'배출', type:'convOut', cond:'ok', label:'OK품 우측 배출' },
    { phase:'배출', type:'pose', to:'home', label:'대기 자세 복귀' }
  ];
  const LOOP_START=1;

  // ===== 런타임 =====
  let idx=0, running=false, waitingSignal=null;
  let pcbOn=false, pcbX=INSPECT_X, tiltDeg=0;   // PCB 상태
  let convActive=false, beltPhase=0;
  let lens={X:HOME.X, Y:HOME.Y, Z:HOME.Z}, camDeg=HOME.cam;  // 카메라 렌즈(3D)/기울기
  let lightOn=false, scanT=-1, s_in=false, alarm=false;
  let verdict=null, autoTog=0, cycleCount=0, okCount=0, ngCount=0;
  let animToken=0, autoTimer=null;

  const $=id=>document.getElementById(id);
  const logBox=$('logBox');
  function addLog(m){const t=new Date().toLocaleTimeString('ko-KR');logBox.textContent+='['+t+'] '+m+'\n';logBox.scrollTop=logBox.scrollHeight;}

  // ===== 그리기 (3D 축측 투영) =====
  function pcbCenter(){ return {X:pcbX, Y:PCB_YC, Z:PCB_Z}; }
  function pcbNormal(deg){ const t=(deg===undefined?tiltDeg:deg)*Math.PI/180; return {X:-Math.sin(t), Y:0, Z:Math.cos(t)}; }
  function pcbPt(u,v,dz){                       // PCB 평면 로컬좌표 → 월드
    const t=tiltDeg*Math.PI/180, c=pcbCenter(), n=pcbNormal(), h=dz||0;
    return {X:c.X+u*Math.cos(t)+n.X*h, Y:c.Y+v, Z:c.Z+u*Math.sin(t)+n.Z*h};
  }
  const PJ=(o)=>P(o.X,o.Y,o.Z);
  function ikElbow(W){                          // 3D 2링크 IK (팔꿈치 위쪽)
    const dx=W.X-S3.X, dy=W.Y-S3.Y, dz=W.Z-S3.Z;
    let hm=Math.hypot(dx,dy); if(hm<0.001) hm=0.001;
    const ux=dx/hm, uy=dy/hm;
    let d=Math.hypot(hm,dz);
    d=Math.max(Math.abs(L1-L2)+2, Math.min(L1+L2-2, d));
    const a=Math.atan2(dz,hm);
    const A=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
    const c1=a+A, c2=a-A;
    const c=(Math.sin(c1)>Math.sin(c2))?c1:c2;   // 팔꿈치가 위로
    return {X:S3.X+ux*L1*Math.cos(c), Y:S3.Y+uy*L1*Math.cos(c), Z:S3.Z+L1*Math.sin(c)};
  }

  const scene=$('scene');
  function draw(){
    let s='';
    // ── 0) 바닥면 (3D 기준면) ──
    s+=quad(P(20,-16,0),P(680,-16,0),P(680,250,0),P(20,250,0),'#E7EAEF','#D5DAE2',1);
    for(let gx=0; gx<=700; gx+=100){
      const q1=P(gx,-16,0), q2=P(gx,250,0);
      s+=`<line x1="${q1.x.toFixed(1)}" y1="${q1.y.toFixed(1)}" x2="${q2.x.toFixed(1)}" y2="${q2.y.toFixed(1)}" stroke="#DCE1E8"/>`; }
    for(let gy=-16; gy<=250; gy+=67){
      const q1=P(20,gy,0), q2=P(680,gy,0);
      s+=`<line x1="${q1.x.toFixed(1)}" y1="${q1.y.toFixed(1)}" x2="${q2.x.toFixed(1)}" y2="${q2.y.toFixed(1)}" stroke="#DCE1E8"/>`; }
    const nc=pcbNormal(camDeg);                       // 카메라 광축(현재 기울기)
    const W3={X:lens.X+nc.X*32, Y:lens.Y+nc.Y*32, Z:lens.Z+nc.Z*32};  // 손목
    const E3=ikElbow(W3);
    const c=pcbCenter();

    // ── 1) 로봇 베이스/기둥 (컨베이어 뒤 → 먼저) ──
    const b0=P(S3.X,S3.Y,0), b1=P(S3.X,S3.Y,S3.Z);
    s+=`<ellipse cx="${b0.x.toFixed(1)}" cy="${b0.y.toFixed(1)}" rx="48" ry="${(48*Math.sin(VIEW.pitch*Math.PI/180)).toFixed(1)}" fill="#C6CBD2" stroke="#9AA3AE"/>`;
    s+=`<rect x="${(b1.x-23).toFixed(1)}" y="${b1.y.toFixed(1)}" width="46" height="${(b0.y-b1.y).toFixed(1)}" rx="13" fill="#F6F7F9" stroke="#C2C8D0" stroke-width="2"/>`;
    s+=`<rect x="${(b1.x-23).toFixed(1)}" y="${(b1.y+5).toFixed(1)}" width="46" height="7" rx="3.5" fill="#2A2F3A"/>`;

    // ── 2) 컨베이어 (3D 박스) ──
    const yA=BELT_Y0+RAIL_W, yB=BELT_Y1-RAIL_W;
    // 벨트 상면
    s+=quad(P(BELT_X0,yA,BELT_Z),P(BELT_X1,yA,BELT_Z),P(BELT_X1,yB,BELT_Z),P(BELT_X0,yB,BELT_Z),'#3A4048','#2A2F35',1);
    // 벨트 롤러 무늬(이송 시 흐름)
    const sp=30, off=((beltPhase%sp)+sp)%sp;
    for(let rx=BELT_X0+12+off-sp; rx<BELT_X1-2; rx+=sp){ if(rx<=BELT_X0+2) continue;
      const a1=P(rx,yA,BELT_Z), a2=P(rx,yB,BELT_Z);
      s+=`<line x1="${pt(a1).split(',')[0]}" y1="${pt(a1).split(',')[1]}" x2="${pt(a2).split(',')[0]}" y2="${pt(a2).split(',')[1]}" stroke="#4C535C"/>`; }
    // 사이드 알루미늄 프레임(앞/뒤) 상면 + 앞면
    s+=quad(P(BELT_X0,BELT_Y1-RAIL_W,RAIL_Z),P(BELT_X1,BELT_Y1-RAIL_W,RAIL_Z),P(BELT_X1,BELT_Y1,RAIL_Z),P(BELT_X0,BELT_Y1,RAIL_Z),'#C3CAD3','#7C8896',1);
    s+=quad(P(BELT_X0,BELT_Y0,RAIL_Z),P(BELT_X1,BELT_Y0,RAIL_Z),P(BELT_X1,BELT_Y0+RAIL_W,RAIL_Z),P(BELT_X0,BELT_Y0+RAIL_W,RAIL_Z),'#D5DCE4','#7C8896',1);
    s+=quad(P(BELT_X0,BELT_Y0,RAIL_Z),P(BELT_X1,BELT_Y0,RAIL_Z),P(BELT_X1,BELT_Y0,BELT_Z-BELT_TH),P(BELT_X0,BELT_Y0,BELT_Z-BELT_TH),'#AEB7C2','#7C8896',1);
    s+=quad(P(BELT_X0,BELT_Y1,RAIL_Z),P(BELT_X1,BELT_Y1,RAIL_Z),P(BELT_X1,BELT_Y1,BELT_Z-BELT_TH),P(BELT_X0,BELT_Y1,BELT_Z-BELT_TH),'#9EA8B4','#7C8896',1);
    // 다리
    [BELT_X0+70, BELT_X1-70].forEach(lx=>{
      const t1=P(lx,PCB_YC,BELT_Z-BELT_TH), t2=P(lx,PCB_YC,0);
      s+=`<rect x="${(t1.x-6).toFixed(1)}" y="${t1.y.toFixed(1)}" width="12" height="${(t2.y-t1.y).toFixed(1)}" fill="#98A1AC"/>`; });
    // 이송 방향 화살표(벨트 위)
    const ar=[P(150,PCB_YC-9,BELT_Z+1),P(186,PCB_YC-9,BELT_Z+1),P(186,PCB_YC-19,BELT_Z+1),P(212,PCB_YC,BELT_Z+1),P(186,PCB_YC+19,BELT_Z+1),P(186,PCB_YC+9,BELT_Z+1),P(150,PCB_YC+9,BELT_Z+1)];
    s+=`<polygon points="${ar.map(pt).join(' ')}" fill="#F2C200" stroke="#B99400"/>`;
    // 검사위치 센서
    const sp1=P(INSPECT_X-52,BELT_Y0,RAIL_Z), sp2=P(INSPECT_X-52,BELT_Y0,RAIL_Z+20);
    s+=`<rect x="${(sp2.x-4).toFixed(1)}" y="${sp2.y.toFixed(1)}" width="8" height="${(sp1.y-sp2.y).toFixed(1)}" fill="#59616C"/>`;
    s+=`<circle cx="${sp2.x.toFixed(1)}" cy="${sp2.y.toFixed(1)}" r="4.5" fill="${s_in?'#16A34A':'#C9CDD3'}"/>`;
    const lb=P(INSPECT_X,BELT_Y0,BELT_Z-BELT_TH-14);
    s+=`<text x="${lb.x.toFixed(1)}" y="${lb.y.toFixed(1)}" text-anchor="middle" font-size="10" fill="#5B6472">검사위치</text>`;
    // 경광등
    const g0=P(650,150,0), g1=P(650,150,110);
    s+=`<rect x="${(g1.x-2).toFixed(1)}" y="${g1.y.toFixed(1)}" width="4" height="${(g0.y-g1.y).toFixed(1)}" fill="#7C8896"/>`;
    s+=`<rect x="${(g1.x-11).toFixed(1)}" y="${(g1.y-22).toFixed(1)}" width="22" height="22" rx="4" fill="#F3D6D3" stroke="#B24A42"/>`;
    s+=`<circle cx="${g1.x.toFixed(1)}" cy="${(g1.y-11).toFixed(1)}" r="6.5" fill="${alarm?'#DC2626':'#E4B7B2'}" class="${alarm?'blinkRed':''}"/>`;
    s+=`<rect x="${(g1.x-11).toFixed(1)}" y="${g1.y.toFixed(1)}" width="22" height="22" rx="4" fill="#D6EBDA" stroke="#3F7A4A"/>`;
    s+=`<circle cx="${g1.x.toFixed(1)}" cy="${(g1.y+11).toFixed(1)}" r="6.5" fill="${(running&&!alarm)?'#16A34A':'#B9D6BF'}"/>`;

    // ── 3) PCB (기울어진 평면 위, 케이스+기판+케이블) ──
    if(pcbOn){
      s+=quad(PJ(pcbPt(-62,-17)),PJ(pcbPt(62,-17)),PJ(pcbPt(62,17)),PJ(pcbPt(-62,17)),'#2B3037','#101215',1.2);   // 케이스 측면(바닥)
      s+=quad(PJ(pcbPt(-58,-14,7)),PJ(pcbPt(58,-14,7)),PJ(pcbPt(58,14,7)),PJ(pcbPt(-58,14,7)),'#23272C','#101215',1.2); // 케이스 상면
      s+=quad(PJ(pcbPt(-44,-10,9)),PJ(pcbPt(46,-10,9)),PJ(pcbPt(46,10,9)),PJ(pcbPt(-44,10,9)),'#B9BFC7','#8B939E',1);   // 알루미늄 커버
      s+=quad(PJ(pcbPt(-34,-8,11)),PJ(pcbPt(34,-8,11)),PJ(pcbPt(34,8,11)),PJ(pcbPt(-34,8,11)),'#2E7D36','#1F5C22',1);   // 초록 기판
      [[-24,-3,'#C9A227',6],[-8,-3,'#39434F',9],[12,-3,'#B03A2E',5]].forEach(q=>{
        s+=quad(PJ(pcbPt(q[0],q[1],12)),PJ(pcbPt(q[0]+q[3],q[1],12)),PJ(pcbPt(q[0]+q[3],q[1]+5,12)),PJ(pcbPt(q[0],q[1]+5,12)),q[2],'',0); });
      // 케이블 + 커넥터
      const cb=[pcbPt(-58,0,4), {X:pcbX-92,Y:PCB_YC-6,Z:BELT_Z+8}, {X:pcbX-118,Y:PCB_YC-14,Z:BELT_Z+4}].map(PJ);
      s+=`<path d="M${pt(cb[0])} Q${pt(cb[1])} ${pt(cb[2])}" stroke="#22262B" stroke-width="6" fill="none" stroke-linecap="round"/>`;
      const cn=P(pcbX-130,PCB_YC-16,BELT_Z+4);
      s+=`<rect x="${(cn.x-10).toFixed(1)}" y="${(cn.y-7).toFixed(1)}" width="20" height="14" rx="2" fill="#B7BCC4" stroke="#7C8896"/>`;
      s+=`<rect x="${(cn.x-5).toFixed(1)}" y="${(cn.y-4).toFixed(1)}" width="9" height="8" fill="#F08C1E"/>`;
    }

    // ── 4) 로봇 팔 + 카메라 (컨베이어 위를 지나므로 마지막) ──
    const pS=P(S3.X,S3.Y,S3.Z), pE=PJ(E3), pW=PJ(W3), pL=PJ(lens);
    s+=`<line x1="${pS.x.toFixed(1)}" y1="${pS.y.toFixed(1)}" x2="${pE.x.toFixed(1)}" y2="${pE.y.toFixed(1)}" stroke="#C8CDD5" stroke-width="26" stroke-linecap="round"/>`;
    s+=`<line x1="${pS.x.toFixed(1)}" y1="${pS.y.toFixed(1)}" x2="${pE.x.toFixed(1)}" y2="${pE.y.toFixed(1)}" stroke="#F6F7F9" stroke-width="19" stroke-linecap="round"/>`;
    s+=`<line x1="${pE.x.toFixed(1)}" y1="${pE.y.toFixed(1)}" x2="${pW.x.toFixed(1)}" y2="${pW.y.toFixed(1)}" stroke="#C8CDD5" stroke-width="21" stroke-linecap="round"/>`;
    s+=`<line x1="${pE.x.toFixed(1)}" y1="${pE.y.toFixed(1)}" x2="${pW.x.toFixed(1)}" y2="${pW.y.toFixed(1)}" stroke="#F6F7F9" stroke-width="15" stroke-linecap="round"/>`;
    s+=`<circle cx="${pS.x.toFixed(1)}" cy="${pS.y.toFixed(1)}" r="16" fill="#F6F7F9" stroke="#C2C8D0" stroke-width="2"/><circle cx="${pS.x.toFixed(1)}" cy="${pS.y.toFixed(1)}" r="6" fill="#2A2F3A"/>`;
    s+=`<circle cx="${pE.x.toFixed(1)}" cy="${pE.y.toFixed(1)}" r="12" fill="#F6F7F9" stroke="#C2C8D0" stroke-width="2"/><circle cx="${pE.x.toFixed(1)}" cy="${pE.y.toFixed(1)}" r="5" fill="#3C74B5"/>`;
    // 조명 빔
    if(lightOn && pcbOn){
      const cs=[pcbPt(-50,-24),pcbPt(50,-24),pcbPt(50,24),pcbPt(-50,24)].map(PJ);
      let mn=cs[0], mx=cs[0]; cs.forEach(q=>{ if(q.x<mn.x)mn=q; if(q.x>mx.x)mx=q; });
      s+=`<polygon points="${pt(pL)} ${pt(mn)} ${pt(mx)}" fill="rgba(255,214,64,0.25)"/>`;
    }
    // 카메라 몸체(렌즈→손목) + 돔조명
    s+=`<line x1="${pL.x.toFixed(1)}" y1="${pL.y.toFixed(1)}" x2="${pW.x.toFixed(1)}" y2="${pW.y.toFixed(1)}" stroke="#3B4552" stroke-width="21" stroke-linecap="butt"/>`;
    s+=`<line x1="${pL.x.toFixed(1)}" y1="${pL.y.toFixed(1)}" x2="${pW.x.toFixed(1)}" y2="${pW.y.toFixed(1)}" stroke="#4E5A69" stroke-width="13" stroke-linecap="butt"/>`;
    s+=`<circle cx="${pW.x.toFixed(1)}" cy="${pW.y.toFixed(1)}" r="10" fill="#F6F7F9" stroke="#C2C8D0" stroke-width="2"/>`;
    { // 돔(렌즈 주변 반원)
      const t=camDeg*Math.PI/180;
      const e1=PJ({X:lens.X+Math.cos(t)*17, Y:lens.Y, Z:lens.Z+Math.sin(t)*17});
      const e2=PJ({X:lens.X-Math.cos(t)*17, Y:lens.Y, Z:lens.Z-Math.sin(t)*17});
      const e3=PJ({X:lens.X, Y:lens.Y+17, Z:lens.Z});
      const e4=PJ({X:lens.X, Y:lens.Y-17, Z:lens.Z});
      s+=`<polygon points="${pt(e1)} ${pt(e3)} ${pt(e2)} ${pt(e4)}" fill="${lightOn?'#FFE9A0':'#EDE6C8'}" stroke="#C9A227" stroke-width="1.5" opacity="${lightOn?0.95:0.6}"/>`;
      s+=`<circle cx="${pL.x.toFixed(1)}" cy="${pL.y.toFixed(1)}" r="5" fill="#20262E"/>`;
      s+=`<text x="${(pW.x).toFixed(1)}" y="${(pW.y-15).toFixed(1)}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#3B4552">COGNEX</text>`;
    }
    // 초점축 + 거리 표시
    let mmNow=null;
    if(pcbOn){
      const pc=P(c.X,c.Y,c.Z);
      const dW=Math.hypot(lens.X-c.X, lens.Y-c.Y, lens.Z-c.Z);
      mmNow=dW/FOCUS_PX*FOCUS_MM;
      s+=`<line x1="${pL.x.toFixed(1)}" y1="${pL.y.toFixed(1)}" x2="${pc.x.toFixed(1)}" y2="${pc.y.toFixed(1)}" stroke="#2D5C99" stroke-width="1.5" stroke-dasharray="4 4"/>`;
      s+=`<text x="${((pL.x+pc.x)/2+10).toFixed(1)}" y="${((pL.y+pc.y)/2).toFixed(1)}" font-size="10.5" font-weight="900" fill="#2D5C99">${mmNow.toFixed(0)}mm</text>`;
    }
    // 스캔 라인
    if(scanT>=0 && pcbOn){
      const u=-46+92*scanT;
      const q1=PJ(pcbPt(u,-22,13)), q2=PJ(pcbPt(u,22,13));
      s+=`<line x1="${q1.x.toFixed(1)}" y1="${q1.y.toFixed(1)}" x2="${q2.x.toFixed(1)}" y2="${q2.y.toFixed(1)}" stroke="#E5484D" stroke-width="2.5"/>`;
    }

    scene.innerHTML=s;
    // 수치 표시
    $('focalVal').textContent = mmNow? (mmNow.toFixed(1)+' mm'+(Math.abs(mmNow-300)<1?' (300 유지)':'')) : '-';
    $('tiltVal').textContent = pcbOn? ((tiltDeg>=0?'+':'')+tiltDeg.toFixed(1)+'°') : '-';
    const aligned = pcbOn && Math.abs(camDeg-tiltDeg)<0.6 && Math.abs((mmNow||0)-300)<1;
    $('alignVal').textContent = pcbOn? (aligned? '⊥ 직각 ('+(camDeg>=0?'+':'')+camDeg.toFixed(1)+'°)' : (camDeg>=0?'+':'')+camDeg.toFixed(1)+'°') : '-';
    $('lampVal').textContent = lightOn?'ON':'OFF';
    $('chipLamp').classList.toggle('on',lightOn);
    $('senVal').textContent = s_in?'ON':'OFF';
    $('chipSen').classList.toggle('on',s_in);
  }

  const stepList=$('stepList');
  function renderSteps(){
    let html='',last=null;
    STATES.forEach((st,i)=>{
      if(st.phase!==last){html+=`<div class="phase-h">${st.phase}</div>`;last=st.phase;}
      const cls=(i<idx?'done ':'')+(i===idx?'cur ':'')+((st.type==='wait'||st.type==='alarmwait')?'wait ':'');
      html+=`<div class="step ${cls}"><span class="no">${i+1}</span><span>${st.label}</span></div>`;
    });
    stepList.innerHTML=html;
    const c=stepList.querySelector('.step.cur'); if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'});
    // 모바일 1줄 진행 표시
    const cs=STATES[idx];
    if(cs){
      $('stepMobileText').textContent=cs.label;
      $('stepMobile').querySelector('.no').textContent=(idx+1);
      const m=$('stepMobile');
      m.classList.toggle('wait', cs.type==='wait');
      m.classList.toggle('alarm', cs.type==='alarmwait');
    }
  }

  function durs(){const v=parseInt($('speed').value||6,10);return {move:1600-v*120, act:650-v*42};}

  function tweenPose(tl, tCam, done){   // 렌즈(3D)+카메라 기울기 보간
    const my=++animToken, s0={X:lens.X,Y:lens.Y,Z:lens.Z}, sc=camDeg, dur=durs().move, t0=performance.now();
    function f(now){ if(my!==animToken)return;
      let k=Math.min((now-t0)/dur,1); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      lens={X:s0.X+(tl.X-s0.X)*e, Y:s0.Y+(tl.Y-s0.Y)*e, Z:s0.Z+(tl.Z-s0.Z)*e};
      camDeg=sc+(tCam-sc)*e; draw();
      if(k<1)requestAnimationFrame(f); else {lens={X:tl.X,Y:tl.Y,Z:tl.Z};camDeg=tCam;draw();done&&done();} }
    requestAnimationFrame(f);
  }
  function tweenConv(fromX, toX, spawn, done){  // PCB 이송(벨트 동일 속도 연동)
    const my=++animToken, dur=durs().move, t0=performance.now();
    if(spawn){ pcbOn=true; tiltDeg=(Math.random()<0.5?-1:1)*(2+Math.random()*4); tiltDeg=Math.round(tiltDeg*10)/10; }
    convActive=true; let lastX=fromX; pcbX=fromX;
    function f(now){ if(my!==animToken)return;
      let k=Math.min((now-t0)/dur,1); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      pcbX=fromX+(toX-fromX)*e;
      beltPhase += (pcbX-lastX); lastX=pcbX;
      draw();
      if(k<1)requestAnimationFrame(f); else {convActive=false; draw(); done&&done();} }
    requestAnimationFrame(f);
  }
  function pause(ms,done){const my=++animToken;setTimeout(()=>{if(my===animToken)done&&done();},ms);}

  function inspectPose(){  // PCB 상면 법선 방향 300mm 지점
    const c=pcbCenter(), n=pcbNormal();
    return { l:{X:c.X+n.X*FOCUS_PX, Y:c.Y+n.Y*FOCUS_PX, Z:c.Z+n.Z*FOCUS_PX}, cam:tiltDeg };
  }

  function runState(){
    if(!running)return; renderSteps();
    const st=STATES[idx]; $('curStateText').textContent='진행: '+st.label;
    if(st.cond==='ng' && verdict!=='NG'){ return next(); }
    if(st.cond==='ok' && verdict!=='OK'){ return next(); }
    if(st.type==='convIn'){
      addLog('[컨베이어] '+st.label); tweenConv(-70, INSPECT_X, true, ()=>{ addLog('[투입] PCB 기울기 '+(tiltDeg>=0?'+':'')+tiltDeg.toFixed(1)+'° 로 안착'); next(); });
    } else if(st.type==='sensor'){
      s_in=st.on; addLog('[센서] '+st.label); draw(); pause(durs().act,next);
    } else if(st.type==='pose'){
      if(st.to==='inspect'){ const p=inspectPose(); addLog('[로봇] '+st.label); tweenPose(p.l, p.cam, next); }
      else { addLog('[로봇] '+st.label); tweenPose({X:HOME.X,Y:HOME.Y,Z:HOME.Z}, HOME.cam, next); }
    } else if(st.type==='aligned'){
      addLog('[정렬] 카메라 '+(camDeg>=0?'+':'')+camDeg.toFixed(1)+'° = PCB 기울기 → 직각 · 초점 300mm 유지'); draw(); pause(durs().act,next);
    } else if(st.type==='light'){
      lightOn=st.on; addLog('[조명] '+st.label); draw(); pause(durs().act,next);
    } else if(st.type==='scan'){
      addLog('[비전] 검사 스캔 시작');
      const my=++animToken, dur=durs().move+300, t0=performance.now();
      (function f(now){ if(my!==animToken)return;
        let k=Math.min(((now||performance.now())-t0)/dur,1); scanT=k; draw();
        if(k<1)requestAnimationFrame(f); else {scanT=-1; draw(); next();} })(performance.now());
    } else if(st.type==='verdict'){
      const sel=$('verdictSel').value;
      if(sel==='OK')verdict='OK'; else if(sel==='NG')verdict='NG'; else {verdict=(autoTog%3===2)?'NG':'OK';autoTog++;}
      $('verdictLamp').textContent=verdict; $('verdictLamp').className='verdict-lamp '+(verdict==='OK'?'ok':'ng');
      addLog('[판정] 비전 검사 결과: '+verdict);
      $('mesInd').className='mes-ind sending'; $('mesInd').innerHTML='<span class="dot"></span>MES 전송 중... ('+verdict+')'; draw();
      pause(durs().act+300,()=>{ $('mesInd').className='mes-ind'; $('mesInd').innerHTML='<span class="dot"></span>MES 전송 완료 ('+verdict+')'; addLog('[MES] '+verdict+' 전송 완료'); next(); });
    } else if(st.type==='alarmwait'){
      alarm=true; $('alarmBanner').classList.add('show');
      waitingSignal='RESUME'; updateSigBtns(); draw();
      addLog('⚠ [알람] NG 발생 — 검사 중단. NG품 제거 후 [검사 계속]');
      if($('autoSig').checked) autoTimer=setTimeout(()=>fireSignal('RESUME',true),2600);
    } else if(st.type==='convOut'){
      s_in=false; addLog('[컨베이어] '+st.label);
      tweenConv(pcbX, BELT_X1+120, false, ()=>{ pcbOn=false; draw(); next(); });
    } else if(st.type==='wait'){
      waitingSignal=st.signal; addLog('[대기] START 신호 대기...'); updateSigBtns(); draw();
      if($('autoSig').checked) autoTimer=setTimeout(()=>fireSignal(st.signal,true),1200);
    }
  }

  function next(){
    idx++;
    if(idx>=STATES.length){
      idx=LOOP_START; cycleCount++; $('cycleCount').textContent=cycleCount;
      if(verdict==='OK'){okCount++;$('okCount').textContent=okCount;} else if(verdict==='NG'){ngCount++;$('ngCount').textContent=ngCount;}
      addLog('=== 1개 검사 완료 (총 '+cycleCount+'개) ===');
    }
    if(running) runState();
  }

  function updateSigBtns(){ $('sigStart').disabled=(waitingSignal!=='START'); $('btnResume').disabled=(waitingSignal!=='RESUME'); }
  function fireSignal(sig,auto){
    if(waitingSignal!==sig)return;
    if(sig==='RESUME'){ pcbOn=false; s_in=false; alarm=false; $('alarmBanner').classList.remove('show'); addLog((auto?'[자동신호] ':'[신호입력] ')+'작업자 NG품 제거 확인 → 검사 재개'); }
    else { addLog((auto?'[자동신호] ':'[신호입력] ')+'START 수신 → 운전 개시'); }
    waitingSignal=null; updateSigBtns(); if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} next();
  }

  $('btnRun').addEventListener('click',()=>{ if(running)return; running=true; $('btnRun').disabled=true; addLog('▶ 자동 운전 시작'); runState(); });
  $('btnStop').addEventListener('click',()=>{ running=false; animToken++; if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} $('btnRun').disabled=false; addLog('■ 정지'); });
  $('btnReset').addEventListener('click',()=>{
    running=false; animToken++; if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}
    idx=0; waitingSignal=null; pcbOn=false; pcbX=INSPECT_X; tiltDeg=0; convActive=false; beltPhase=0;
    lens={X:HOME.X,Y:HOME.Y,Z:HOME.Z}; camDeg=HOME.cam; lightOn=false; scanT=-1; s_in=false; alarm=false;
    verdict=null; $('alarmBanner').classList.remove('show');
    $('verdictLamp').textContent='--'; $('verdictLamp').className='verdict-lamp';
    $('mesInd').className='mes-ind'; $('mesInd').innerHTML='<span class="dot"></span>MES 전송: 대기';
    $('btnRun').disabled=false; updateSigBtns(); draw(); renderSteps(); $('curStateText').textContent=''; addLog('↺ 초기화');
  });
  $('sigStart').addEventListener('click',()=>fireSignal('START',false));
  $('btnResume').addEventListener('click',()=>fireSignal('RESUME',false));
  $('clearLog').addEventListener('click',()=>logBox.textContent='');
  $('autoSig').addEventListener('change',()=>{ if($('autoSig').checked&&running&&waitingSignal) autoTimer=setTimeout(()=>fireSignal(waitingSignal,true),1200); });

  // 3D 시점 각도
  function setYaw(v){ VIEW.yaw=+v; $('viewYaw').value=v; $('yawVal').textContent=(+v).toFixed(0)+'°'; draw(); }
  $('viewYaw').addEventListener('input',e=>setYaw(e.target.value));
  $('btnFront').addEventListener('click',()=>setYaw(0));
  $('btnIso').addEventListener('click',()=>setYaw(45));
  $('btnSide').addEventListener('click',()=>setYaw(90));

  draw(); renderSteps(); updateSigBtns();
  addLog('비전 검사 시뮬레이터 v1.3 준비 완료. "자동 운전 시작"을 누르세요.');
</script>

<!-- 최신버전 자동 감지: 서버 파일이 바뀌면 새로고침 없이 자동 반영 -->
<script>
(function(){
  if(location.protocol==='file:') return;          // 로컬 파일은 미적용
  var cur=null, TICK=30000;                        // 30초마다 확인
  function fetchSelf(cb){
    fetch(location.pathname+'?_cb='+Date.now(), {cache:'no-store'})
      .then(function(r){return r.ok?r.text():null;})
      .then(function(t){ if(t) cb(hash(t)); })
      .catch(function(){});
  }
  function hash(s){ var h=0; for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }
  function banner(){
    if(document.getElementById('__upd')) return;
    var d=document.createElement('div'); d.id='__upd';
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1E3A5F;color:#fff;'+
      'font-family:"Noto Sans KR",sans-serif;font-size:13px;font-weight:700;padding:10px;text-align:center;cursor:pointer';
    d.textContent='새 버전이 있습니다 — 지금 적용하려면 여기를 누르세요';
    d.onclick=function(){ location.replace(location.pathname+'?v='+Date.now()); };
    document.body.appendChild(d);
    setTimeout(function(){ location.replace(location.pathname+'?v='+Date.now()); }, 5000); // 5초 후 자동 적용
  }
  fetchSelf(function(h){ cur=h; });
  setInterval(function(){ fetchSelf(function(h){ if(cur!==null && h!==cur) banner(); }); }, TICK);
})();
</script>
