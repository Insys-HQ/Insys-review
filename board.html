<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1.0">
<title>인시스 외근현황판 v1.4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
           onSnapshot, query, orderBy, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  const app = initializeApp({
    apiKey:"AIzaSyBYqd2uRr1ZvFLDCWuS15h9qFkT-Dvg5Es",
    authDomain:"insys-work.firebaseapp.com", projectId:"insys-work",
    storageBucket:"insys-work.firebasestorage.app",
    messagingSenderId:"225275784859",
    appId:"1:225275784859:web:bd12815c6dc47c0c49e03e"
  });
  const db = getFirestore(app);
  window.__db = db;
  window.__fs = { collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp };
  document.addEventListener('DOMContentLoaded', () => {
    const { collection:C, query:Q, orderBy:OB, onSnapshot:ON } = window.__fs;
    ON(Q(C(db,'outings'),OB('departTime')), s => { window.__outings=s.docs.map(d=>({id:d.id,...d.data()})); window.renderOutings&&window.renderOutings(); });
    ON(Q(C(db,'leaves'),OB('startDate')),   s => { window.__leaves =s.docs.map(d=>({id:d.id,...d.data()})); window.renderLeaves &&window.renderLeaves(); });
    ON(Q(C(db,'notices'),OB('createdAt')),  s => { window.__notices=s.docs.map(d=>({id:d.id,...d.data()})); window.renderNotices&&window.renderNotices(); });
    ON(C(db,'vehicles'), s => { window.__vehicles=s.docs.map(d=>({id:d.id,...d.data()})); window.renderVehicles&&window.renderVehicles(); });
    window.initApp && window.initApp();
  });
</script>

<style>
/* ===========================
   공통 기반
=========================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --P: #1a3a5c;  --P2: #2563a8;  --A: #0ea5e9;
  --W: #d97706;  --BG: #edf2f7;  --CARD: #fff;
  --BD: #d1dbe8; --T: #1e293b;   --T2: #475569;  --T3: #94a3b8;
  --TH: #dbeafe; --TH2: #1e3a5f;
  --F: 'Noto Sans KR', sans-serif;
}
html, body { height: 100%; font-family: var(--F); background: var(--BG); color: var(--T); }

/* ===========================
   세로HD 터치 레이아웃 (기본)
   1080px 고정 컨테이너
=========================== */
.touch-wrap {
  width: 1080px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* PC 레이아웃 */
.pc-wrap {
  display: none;
  width: 100%;
  height: 100vh;
  flex-direction: column;
  overflow: hidden;
}

/* 모바일 레이아웃 */
.mob-wrap {
  display: none;
  width: 100%;
  min-height: 100vh;
  flex-direction: column;
}

/* ===========================
   헤더 (터치/HD 기준)
=========================== */
.hd {
  background: var(--P);
  color: #fff;
  flex-shrink: 0;
}

/* 헤더 행1: 로고 + 뷰버튼 + 아이콘 */
.hd-r1 {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 24px;
}
.hd-logo {
  flex: 1;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.hd-logo em { color: var(--A); font-style: normal; }
.hd-ver {
  font-size: 11px;
  font-weight: 400;
  background: rgba(255,255,255,.2);
  border-radius: 10px;
  padding: 2px 9px;
}
.hd-acts { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* 헤더 행2: 날짜 + 시계 */
.hd-r2 {
  display: flex;
  align-items: stretch;
  border-top: 1px solid rgba(255,255,255,.1);
  padding: 0 24px;
}
.hd-date-blk { flex: 1; padding: 10px 0; display: flex; flex-direction: column; gap: 3px; }
.hd-date-sub  { font-size: 11px; opacity: .6; letter-spacing: .5px; }
.hd-date-val  { font-size: 18px; font-weight: 700; }
.hd-time-blk  {
  display: flex; align-items: center;
  border-left: 1px solid rgba(255,255,255,.15);
  padding: 10px 0 10px 24px;
}
.hd-time-val {
  font-size: 40px; font-weight: 900;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
}

/* 헤더 행3: 날씨 */
.hd-r3 {
  background: rgba(0,0,0,.2);
  border-top: 1px solid rgba(255,255,255,.07);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 20px;
}
.wt-cur { display: flex; align-items: center; gap: 10px; }
.wt-ico { font-size: 30px; line-height: 1; }
.wt-tmp { font-size: 28px; font-weight: 900; }
.wt-rng { font-size: 12px; opacity: .8; line-height: 1.5; }
.wt-div { width: 1px; height: 44px; background: rgba(255,255,255,.2); flex-shrink: 0; }
.wt-slots { display: flex; gap: 24px; }
.wt-slot  { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.wt-s-lbl { font-size: 11px; opacity: .6; }
.wt-s-ico { font-size: 20px; }
.wt-s-tmp { font-size: 14px; font-weight: 700; }
.wt-umb   { margin-left: auto; flex-shrink: 0; display: none; background: var(--W); color: #fff; border-radius: 6px; padding: 5px 14px; font-size: 14px; font-weight: 700; }
.wt-umb.on { display: block; }

/* ===========================
   Ticker
=========================== */
.ticker {
  background: #0c1e30;
  color: rgba(255,255,255,.85);
  padding: 7px 24px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
  flex-shrink: 0;
}
.ticker-lbl { background: var(--A); color: #fff; border-radius: 4px; padding: 2px 9px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.ticker-track { overflow: hidden; flex: 1; }
.ticker-inner { white-space: nowrap; display: inline-block; animation: tkr 50s linear infinite; }
@keyframes tkr { 0% { transform: translateX(1080px); } 100% { transform: translateX(-100%); } }

/* ===========================
   콘텐츠 영역
=========================== */
.content {
  flex: 1;
  padding: 18px 24px;
  display: flex; flex-direction: column; gap: 16px;
  overflow-y: auto;
}

/* ===========================
   카드
=========================== */
.card { background: var(--CARD); border-radius: 12px; box-shadow: 0 2px 14px rgba(26,58,92,.1); overflow: hidden; }
.card-hd {
  background: var(--P); color: #fff;
  padding: 13px 20px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 16px; font-weight: 700;
}
.card-hd-l { display: flex; align-items: center; gap: 8px; }
.card-hd-l svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ch-badge { font-size: 12px; background: rgba(255,255,255,.2); padding: 2px 12px; border-radius: 12px; }

.car-strip { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px; }
.car-tag { background: #dbeafe; color: #1e3a5f; border: 1px solid #93c5fd; border-radius: 6px; padding: 5px 14px; font-size: 14px; font-weight: 500; }
.car-tag.used { background: #fee2e2; color: #7f1d1d; border-color: #fca5a5; text-decoration: line-through; }

/* ===========================
   테이블
=========================== */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--TH); color: var(--TH2);
  padding: 11px 14px; text-align: center;
  font-size: 14px; font-weight: 700;
  border-bottom: 2px solid #93c5fd; white-space: nowrap;
}
tbody tr:nth-child(even) { background: #f8fafc; }
tbody tr:hover { background: #eff6ff; }
tbody td {
  padding: 12px 14px; text-align: center;
  font-size: 15px; border-bottom: 1px solid #e9f0f8;
  vertical-align: middle;
}
.td-n { font-weight: 700; color: var(--P); }
.td-d { font-weight: 500; color: var(--P2); }
.empty td { color: var(--T3); font-style: italic; padding: 28px !important; font-size: 14px; }

.badge { border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 700; display: inline-block; white-space: nowrap; }
.b-out   { background: #dbeafe; color: #1e40af; }
.b-back  { background: #f1f5f9; color: #475569; }
.b-biz   { background: #d1fae5; color: #065f46; }
.b-leave { background: #fef3c7; color: #92400e; }

.add-bar { padding: 14px 20px; border-top: 1px dashed var(--BD); display: flex; justify-content: flex-end; }
.btn-add {
  background: var(--P2); color: #fff; border: none; border-radius: 9px;
  padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: var(--F); display: flex; align-items: center; gap: 7px; transition: .15s;
}
.btn-add:hover { background: var(--P); }
.btn-add svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

.abt { border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--F); }
.abt-e { background: #eff6ff; color: #1d4ed8; }
.abt-d { background: #fff0f0; color: #b91c1c; }

/* ===========================
   뷰 버튼
=========================== */
.vbtn-grp { display: flex; gap: 6px; }
.vbtn {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.22);
  color: #fff; border-radius: 7px; padding: 7px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--F);
  display: flex; align-items: center; gap: 5px; white-space: nowrap; transition: .15s;
}
.vbtn:hover { background: rgba(255,255,255,.28); }
.vbtn.on { background: var(--A); border-color: var(--A); }
.vbtn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.ibtn {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.22);
  color: #fff; border-radius: 7px; padding: 9px;
  cursor: pointer; display: flex; align-items: center; font-family: var(--F); transition: .15s;
}
.ibtn:hover { background: rgba(255,255,255,.28); }
.ibtn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===========================
   PC 우측 패널
=========================== */
.pc-body { flex: 1; display: flex; overflow: hidden; }
.pc-main { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; }
.pc-aside {
  width: 280px; flex-shrink: 0; overflow-y: auto;
  background: #fff; border-left: 1px solid var(--BD);
  padding: 14px; display: flex; flex-direction: column; gap: 12px;
}
.rp-card { background: var(--CARD); border-radius: 10px; box-shadow: 0 1px 8px rgba(26,58,92,.1); overflow: hidden; margin-bottom: 0; }
.rp-hd { color: #fff; padding: 9px 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.rp-hd svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rp-bd { padding: 10px 12px; }
.ni { padding: 6px 10px; border-left: 3px solid var(--A); background: #f8fafc; border-radius: 0 5px 5px 0; margin-bottom: 5px; font-size: 11px; line-height: 1.5; color: var(--T2); }
.ni-dt { font-size: 10px; color: var(--T3); margin-bottom: 1px; }

/* PC 전용 헤더 축소 */
.pc-wrap .hd-r1 { padding: 0 20px; height: 50px; }
.pc-wrap .hd-logo { font-size: 17px; }
.pc-wrap .hd-r2 { padding: 0 20px; }
.pc-wrap .hd-date-val { font-size: 13px; }
.pc-wrap .hd-time-val { font-size: 22px; }
.pc-wrap .hd-r3 { padding: 7px 20px; }
.pc-wrap .wt-tmp { font-size: 18px; }
.pc-wrap .ticker { padding: 5px 20px; font-size: 12px; }
.pc-wrap .card-hd { padding: 9px 16px; font-size: 13px; }
.pc-wrap thead th { font-size: 12px; padding: 8px 10px; }
.pc-wrap tbody td { font-size: 12px; padding: 8px 10px; }
.pc-wrap .btn-add { font-size: 12px; padding: 8px 16px; }
.pc-wrap .abt { font-size: 11px; padding: 5px 9px; }
.pc-wrap .add-bar { padding: 9px 16px; }
.pc-wrap .car-strip { padding: 10px 16px; }
.pc-wrap .vbtn { font-size: 11px; padding: 5px 10px; }

/* 모바일 전용 헤더/레이아웃 */
.mob-wrap .hd-r1 { padding: 10px 14px; gap: 6px; }
.mob-wrap .hd-logo { font-size: 15px; }
.mob-wrap .hd-ver { font-size: 10px; padding: 1px 7px; }
.mob-wrap .hd-r2 { padding: 0 14px; }
.mob-wrap .hd-date-sub { font-size: 10px; }
.mob-wrap .hd-date-val { font-size: 14px; }
.mob-wrap .hd-time-blk { padding: 8px 0 8px 14px; }
.mob-wrap .hd-time-val { font-size: 26px; }
.mob-wrap .hd-r3 { padding: 8px 14px; gap: 12px; }
.mob-wrap .wt-ico { font-size: 22px; }
.mob-wrap .wt-tmp { font-size: 20px; }
.mob-wrap .wt-rng { font-size: 11px; }
.mob-wrap .wt-s-ico { font-size: 16px; }
.mob-wrap .wt-s-tmp { font-size: 12px; }
.mob-wrap .ticker { padding: 5px 14px; font-size: 12px; }
.mob-wrap .content { padding: 10px 12px; gap: 10px; }
.mob-wrap .card-hd { padding: 10px 14px; font-size: 13px; }
.mob-wrap thead th { font-size: 11px; padding: 7px 8px; }
.mob-wrap tbody td { font-size: 12px; padding: 7px 8px; }
.mob-wrap .btn-add { font-size: 12px; padding: 8px 14px; }
.mob-wrap .abt { font-size: 11px; padding: 4px 8px; }
.mob-wrap .add-bar { padding: 9px 14px; }
.mob-wrap .car-strip { padding: 9px 14px; gap: 6px; }
.mob-wrap .car-tag { font-size: 12px; padding: 4px 10px; }
.mob-wrap .vbtn { font-size: 11px; padding: 5px 9px; }
.mob-wrap .ibtn { padding: 7px; }
.mob-wrap .ibtn svg { width: 16px; height: 16px; }

/* ===========================
   모달
=========================== */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; }
.overlay.hidden { display: none; }
.modal { background: #fff; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 32px rgba(0,0,0,.2); }
.modal-handle { width: 36px; height: 4px; background: #d1d5db; border-radius: 2px; margin: 12px auto 4px; }
.modal-head { background: var(--P); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 16px; position: sticky; top: 0; z-index: 1; }
.modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--BD); display: flex; justify-content: flex-end; gap: 10px; }
.fg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.fg label { font-size: 12px; font-weight: 700; color: var(--T2); }
.fg input, .fg select, .fg textarea { border: 1px solid var(--BD); border-radius: 8px; padding: 11px 13px; font-size: 14px; font-family: var(--F); color: var(--T); outline: none; width: 100%; }
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--A); box-shadow: 0 0 0 3px rgba(14,165,233,.15); }
.fg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-cancel { background: #f1f5f9; color: var(--T2); border: 1px solid var(--BD); border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--F); }
.btn-save   { background: var(--P2); color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--F); }
.btn-save:hover { background: var(--P); }

/* 설정/검색 */
.set-ttl { font-size: 11px; font-weight: 700; color: var(--T3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.veh-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.veh-tag { background: #dbeafe; color: #1e3a5f; border: 1px solid #93c5fd; border-radius: 6px; padding: 5px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.veh-tag:hover { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
.veh-add { display: flex; gap: 8px; }
.veh-add input { flex: 1; border: 1px solid var(--BD); border-radius: 8px; padding: 10px 13px; font-size: 14px; font-family: var(--F); }
.sch-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.sch-area input, .sch-area select { border: 1px solid var(--BD); border-radius: 8px; padding: 10px 13px; font-size: 14px; font-family: var(--F); color: var(--T); outline: none; width: 100%; }
.sch-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
</style>
</head>
<body>

<!-- =============================================
  터치(세로HD) 레이아웃
============================================= -->
<div class="touch-wrap" id="lay-touch">
  <!-- 헤더 공통 컴포넌트 삽입됨 (JS로 클론) -->
</div>

<!-- =============================================
  PC 레이아웃
============================================= -->
<div class="pc-wrap" id="lay-pc">
</div>

<!-- =============================================
  모바일 레이아웃
============================================= -->
<div class="mob-wrap" id="lay-mob">
</div>

<!-- =============================================
  헤더 템플릿 (hidden, JS가 각 레이아웃에 클론)
============================================= -->
<template id="tpl-header">
  <header class="hd">
    <div class="hd-r1">
      <div class="hd-logo">🏢 <em>인시스</em> 외근현황판 <span class="hd-ver">v1.4</span></div>
      <div class="hd-acts">
        <div class="vbtn-grp">
          <button class="vbtn btn-v-touch">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>터치
          </button>
          <button class="vbtn btn-v-pc">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>PC
          </button>
          <button class="vbtn btn-v-mob">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>모바일
          </button>
        </div>
        <button class="ibtn btn-settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="ibtn btn-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </div>
    <div class="hd-r2">
      <div class="hd-date-blk">
        <div class="hd-date-sub">TODAY</div>
        <div class="hd-date-val js-date">----년 --월 --일 (-)</div>
      </div>
      <div class="hd-time-blk">
        <div class="hd-time-val js-time">--:--:--</div>
      </div>
    </div>
    <div class="hd-r3">
      <div class="wt-cur">
        <div class="wt-ico js-wt-ico">⛅</div>

<script>
/* ══ 상태 ══ */
window.__outings=window.__outings||[];window.__leaves=window.__leaves||[];
window.__notices=window.__notices||[];window.__vehicles=window.__vehicles||[];
const DOW=['일','월','화','수','목','금','토'];
const WMO={0:'☀️ 맑음',1:'🌤 대체로맑음',2:'⛅ 구름많음',3:'☁️ 흐림',45:'🌫 안개',48:'🌫 안개',51:'🌦 이슬비',53:'🌦 이슬비',61:'🌧 비',63:'🌧 비',65:'🌧 강한비',71:'🌨 눈',73:'🌨 눈',80:'🌦 소나기',81:'🌧 소나기',95:'⛈ 뇌우',96:'⛈ 뇌우'};
const wi=c=>(WMO[c]||'⛅ --').split(' ')[0];
const wt=c=>(WMO[c]||'⛅ --').split(' ').slice(1).join(' ');

/* ══ 뷰 관리 ══ */
let curView = 'touch'; // 기본: 세로HD 터치
let activeWrap = null;

function buildLayout(wrapEl, isPC) {
  wrapEl.innerHTML = '';
  // 헤더+티커
  const hTpl = document.getElementById('tpl-header').content.cloneNode(true);
  wrapEl.appendChild(hTpl);
  if (isPC) {
    // PC: hd-body 행 구조
    const body = document.createElement('div');
    body.className = 'pc-body';
    const mainTpl = document.getElementById('tpl-content').content.cloneNode(true);
    const mainEl = mainTpl.querySelector('.js-content');
    mainEl.className = 'pc-main';
    body.appendChild(mainTpl);
    const asideTpl = document.getElementById('tpl-aside').content.cloneNode(true);
    body.appendChild(asideTpl);
    wrapEl.appendChild(body);
  } else {
    const cTpl = document.getElementById('tpl-content').content.cloneNode(true);
    wrapEl.appendChild(cTpl);
  }
  bindLayoutEvents(wrapEl);
}

function setView(v) {
  curView = v;
  // viewport 조정
  const vp = document.getElementById('vp');
  if (v === 'touch') {
    vp.content = 'width=1080, initial-scale=1.0';
    document.body.style.minWidth = '';
  } else if (v === 'pc') {
    vp.content = 'width=device-width, initial-scale=1.0';
    document.body.style.minWidth = '900px';
  } else { // mobile
    vp.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
    document.body.style.minWidth = '';
  }
  // 래퍼 전환
  const touches = document.getElementById('lay-touch');
  const pcs     = document.getElementById('lay-pc');
  const mobs    = document.getElementById('lay-mob');
  touches.style.display = 'none';
  pcs.style.display     = 'none';
  mobs.style.display    = 'none';
  if (v === 'touch') {
    touches.style.display = 'flex';
    activeWrap = touches;
  } else if (v === 'pc') {
    pcs.style.display = 'flex';
    activeWrap = pcs;
    if (!pcs.querySelector('.hd')) buildLayout(pcs, true);
  } else {
    mobs.style.display = 'flex';
    activeWrap = mobs;
    if (!mobs.querySelector('.hd')) buildLayout(mobs, false);
  }
  // 버튼 active 갱신 (현재 활성 래퍼 내부)
  document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('on'));
  const cls = {touch:'btn-v-touch', pc:'btn-v-pc', mobile:'btn-v-mob'}[v];
  document.querySelectorAll('.'+cls).forEach(b => b.classList.add('on'));
  renderAll();
}

/* ══ 이벤트 바인딩 (각 레이아웃 빌드 후) ══ */
function bindLayoutEvents(wrap) {
  wrap.querySelectorAll('.btn-v-touch').forEach(b=>b.addEventListener('click',()=>setView('touch')));
  wrap.querySelectorAll('.btn-v-pc').forEach(b=>b.addEventListener('click',()=>setView('pc')));
  wrap.querySelectorAll('.btn-v-mob').forEach(b=>b.addEventListener('click',()=>setView('mobile')));
  wrap.querySelectorAll('.btn-settings').forEach(b=>b.addEventListener('click',openSettings));
  wrap.querySelectorAll('.btn-search').forEach(b=>b.addEventListener('click',openSearch));
  wrap.querySelectorAll('.js-btn-add-outing').forEach(b=>b.addEventListener('click',()=>openOutingModal()));
  wrap.querySelectorAll('.js-btn-add-leave').forEach(b=>b.addEventListener('click',()=>openLeaveModal()));
  wrap.querySelectorAll('.js-btn-add-notice').forEach(b=>b.addEventListener('click',()=>openNoticeModal()));
  wrap.querySelectorAll('.js-btn-news').forEach(b=>b.addEventListener('click',loadNews));
}

/* ══ INIT ══ */
window.initApp = function() {
  // 터치 레이아웃 빌드 (기본)
  buildLayout(document.getElementById('lay-touch'), false);
  document.getElementById('lay-touch').style.display = 'flex';
  document.getElementById('lay-pc').style.display = 'none';
  document.getElementById('lay-mob').style.display = 'none';
  activeWrap = document.getElementById('lay-touch');
  // 초기 버튼 active
  document.querySelectorAll('.btn-v-touch').forEach(b=>b.classList.add('on'));
  // 전역 모달 바인딩
  document.getElementById('btn-save-outing').addEventListener('click', saveOuting);
  document.getElementById('btn-save-leave').addEventListener('click', saveLeave);
  document.getElementById('btn-save-notice').addEventListener('click', saveNotice);
  document.getElementById('btn-add-veh').addEventListener('click', addVeh);
  document.getElementById('btn-do-search').addEventListener('click', doSearch);
  document.getElementById('sch-kw').addEventListener('keydown', e=>{if(e.key==='Enter')doSearch();});
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeModal(el.dataset.close)));
  document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.add('hidden');}));
  startClock(); loadWeather(); loadNews(); renderAll();
};

/* ══ 렌더 (활성 래퍼 대상) ══ */
function qA(sel){ return activeWrap ? activeWrap.querySelectorAll(sel) : []; }
function q1(sel){ return activeWrap ? activeWrap.querySelector(sel) : null; }
function stxt(sel, v){ q1(sel) && (q1(sel).textContent = v); }

function renderAll(){ renderVehicles(); renderOutings(); renderLeaves(); renderNotices(); }
window.renderOutings  = ()=>{ if(activeWrap) renderOutings(); };
window.renderLeaves   = ()=>{ if(activeWrap) renderLeaves(); };
window.renderNotices  = ()=>{ if(activeWrap) renderNotices(); };
window.renderVehicles = ()=>{ if(activeWrap) renderVehicles(); };

/* ══ CLOCK ══ */
function startClock(){
  function tick(){
    const n=new Date(),y=n.getFullYear(),mo=n.getMonth()+1,d=n.getDate(),dw=n.getDay();
    const hh=p(n.getHours()),mm=p(n.getMinutes()),ss=p(n.getSeconds());
    document.querySelectorAll('.js-date').forEach(el=>el.textContent=`${y}년 ${mo}월 ${d}일 (${DOW[dw]})`);
    document.querySelectorAll('.js-time').forEach(el=>el.textContent=`${hh}:${mm}:${ss}`);
    document.querySelectorAll('.js-big-d').forEach(el=>el.textContent=d);
    document.querySelectorAll('.js-big-dow').forEach(el=>el.textContent=DOW[dw]+'요일');
    document.querySelectorAll('.js-big-ym').forEach(el=>el.textContent=`${y}년 ${mo}월`);
  }
  tick(); setInterval(tick,1000);
}

/* ══ WEATHER ══ */
let weatherCache = null;
async function loadWeather(){
  if(!weatherCache){
    let lat=35.2279,lon=128.6812,loc='창원시';
    try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000}));lat=pos.coords.latitude;lon=pos.coords.longitude;try{const g=await(await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)).json();loc=g.address?.city||g.address?.county||loc;}catch{}}catch{}
    try{
      const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Seoul&forecast_days=1`)).json();
      const now=new Date().getHours();
      weatherCache={hi:Math.round(d.daily.temperature_2m_max[0]),lo:Math.round(d.daily.temperature_2m_min[0]),wc:d.daily.weathercode[0],pr:d.daily.precipitation_probability_max[0],cur:Math.round(d.hourly.temperature_2m[now]??0),amWc:d.hourly.weathercode[9],pmWc:d.hourly.weathercode[15],amT:Math.round(d.hourly.temperature_2m[9]),pmT:Math.round(d.hourly.temperature_2m[15]),loc};
    }catch(e){console.warn(e); return;}
  }
  applyWeather();
}
function applyWeather(){
  if(!weatherCache) return;
  const {hi,lo,wc,pr,cur,amWc,pmWc,amT,pmT,loc}=weatherCache;
  const needU=pr>40||[51,53,61,63,65,80,81,95,96].includes(wc);
  document.querySelectorAll('.js-wt-ico').forEach(e=>e.textContent=wi(wc));
  document.querySelectorAll('.js-wt-tmp').forEach(e=>e.textContent=cur+'°');
  document.querySelectorAll('.js-wt-rng').forEach(e=>e.textContent=`↑${hi}° ↓${lo}°`);
  document.querySelectorAll('.js-am-i').forEach(e=>e.textContent=wi(amWc));
  document.querySelectorAll('.js-am-t').forEach(e=>e.textContent=amT+'°');
  document.querySelectorAll('.js-pm-i').forEach(e=>e.textContent=wi(pmWc));
  document.querySelectorAll('.js-pm-t').forEach(e=>e.textContent=pmT+'°');
  document.querySelectorAll('.js-umb').forEach(e=>e.classList.toggle('on',needU));
  document.querySelectorAll('.js-rp-ico').forEach(e=>e.textContent=wi(wc));
  document.querySelectorAll('.js-rp-tmp').forEach(e=>e.textContent=cur+'°C');
  document.querySelectorAll('.js-rp-rng').forEach(e=>e.textContent=`최고 ${hi}° / 최저 ${lo}°`);
  document.querySelectorAll('.js-rp-pr').forEach(e=>e.textContent=`강수확률 ${pr}%`);
  document.querySelectorAll('.js-rp-loc').forEach(e=>e.textContent=loc);
  document.querySelectorAll('.js-rp-ai').forEach(e=>e.textContent=wi(amWc));
  document.querySelectorAll('.js-rp-at').forEach(e=>e.textContent=amT+'°');
  document.querySelectorAll('.js-rp-pi').forEach(e=>e.textContent=wi(pmWc));
  document.querySelectorAll('.js-rp-pt').forEach(e=>e.textContent=pmT+'°');
  document.querySelectorAll('.js-rp-umb').forEach(e=>e.style.display=needU?'block':'none');
}

/* ══ NEWS ══ */
async function loadNews(){
  document.querySelectorAll('.js-news-list').forEach(e=>e.innerHTML='<div style="color:var(--T3);font-size:11px;">불러오는 중...</div>');
  try{
    const d=await(await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss/search?q=경제+기업&hl=ko&gl=KR&ceid=KR:ko')}&count=6`)).json();
    if(d.status!=='ok'||!d.items?.length)throw new Error();
    const html=d.items.slice(0,6).map(it=>{
      const dt=new Date(it.pubDate).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<div class="ni" style="border-color:#0f6eb4;"><div class="ni-dt">${dt}</div><a href="${it.link}" target="_blank" style="color:var(--P);font-weight:500;font-size:11px;">${it.title}</a></div>`;
    }).join('');
    document.querySelectorAll('.js-news-list').forEach(e=>e.innerHTML=html);
    updateTicker(d.items.slice(0,5).map(i=>i.title).join('  ·  '));
  }catch{document.querySelectorAll('.js-news-list').forEach(e=>e.innerHTML='<div class="ni" style="border-color:#0f6eb4;">뉴스 로드 실패</div>');}
}

/* ══ TICKER ══ */
function updateTicker(news){
  const nc=window.__notices.map(n=>n.content).join('  |  ');
  const base=news||'인시스 외근현황판  |  오늘도 안전한 하루 되세요.';
  document.querySelectorAll('.js-ticker').forEach(e=>e.textContent=nc?`${nc}  ·  ${base}`:base);
}

/* ══ VEHICLES ══ */
function renderVehicles(){
  const vs=window.__vehicles,os=window.__outings;
  const used=os.filter(o=>o.status==='out').map(o=>o.vehicle).filter(Boolean);
  document.querySelectorAll('.js-car-list').forEach(cl=>{
    if(!vs.length){cl.innerHTML='<span style="color:var(--T3);font-size:13px;">등록된 차량 없음 — 설정에서 추가하세요</span>';}
    else{cl.innerHTML=vs.map(v=>{const u=used.includes(v.plate);return`<span class="car-tag ${u?'used':''}">${esc(v.plate)} ${u?'🔴':'🟢'}</span>`;}).join('');}
  });
  document.querySelectorAll('.js-car-sum').forEach(e=>e.textContent=!vs.length?'차량 없음':`가용 ${vs.filter(v=>!used.includes(v.plate)).length}/${vs.length}대`);
  const sel=document.getElementById('o-vehicle'),cur=sel.value;
  sel.innerHTML='<option value="">자가용/없음</option>';
  vs.forEach(v=>{const u=used.includes(v.plate),o=document.createElement('option');o.value=v.plate;o.textContent=v.plate+(u?' (사용중)':'');if(u)o.disabled=true;if(cur===v.plate)o.selected=true;sel.appendChild(o);});
  const ml=document.getElementById('veh-manage');
  if(ml){ml.innerHTML=vs.length?vs.map(v=>`<span class="veh-tag" data-vid="${v.id}">🚗 ${esc(v.plate)} ✕</span>`).join(''):'<span style="font-size:13px;color:var(--T3);">등록된 차량 없음</span>';ml.querySelectorAll('[data-vid]').forEach(t=>t.addEventListener('click',()=>delVeh(t.dataset.vid)));}
}
async function addVeh(){const inp=document.getElementById('veh-input'),plate=inp.value.trim();if(!plate)return alert('차량번호를 입력하세요.');if(window.__vehicles.some(v=>v.plate===plate))return alert('이미 등록됨');if(window.__db){await window.__fs.addDoc(window.__fs.collection(window.__db,'vehicles'),{plate,createdAt:window.__fs.serverTimestamp()});}else{window.__vehicles.push({id:Date.now()+'',plate});renderVehicles();}inp.value='';}
async function delVeh(id){if(!confirm('삭제?'))return;if(window.__db){await window.__fs.deleteDoc(window.__fs.doc(window.__db,'vehicles',id));}else{window.__vehicles=window.__vehicles.filter(v=>v.id!==id);renderVehicles();}}

/* ══ OUTINGS ══ */
function renderOutings(){
  const list=window.__outings;
  document.querySelectorAll('.js-outing-cnt').forEach(e=>e.textContent=list.filter(o=>o.status==='out').length+'명');
  document.querySelectorAll('.js-outing-tb').forEach(tb=>{
    if(!list.length){tb.innerHTML='<tr class="empty"><td colspan="8">등록된 외근자가 없습니다.</td></tr>';return;}
    tb.innerHTML=list.map(o=>`<tr><td class="td-n">${esc(o.name)}</td><td class="td-d">${esc(o.dest)}</td><td>${esc(o.purpose)}</td><td>${esc(o.departTime||'-')}</td><td>${esc(o.returnTime||'-')}</td><td>${o.vehicle?`<span class="car-tag" style="font-size:12px;padding:3px 10px;">${esc(o.vehicle)}</span>`:'-'}</td><td><span class="badge ${o.status==='out'?'b-out':'b-back'}">${o.status==='out'?'외근중':'복귀'}</span></td><td><button class="abt abt-e" data-oid="${o.id}">수정</button> <button class="abt abt-d" data-odid="${o.id}">삭제</button></td></tr>`).join('');
    tb.querySelectorAll('[data-oid]').forEach(b=>b.addEventListener('click',()=>editOuting(b.dataset.oid)));
    tb.querySelectorAll('[data-odid]').forEach(b=>b.addEventListener('click',()=>delOuting(b.dataset.odid)));
  });
  renderVehicles();
}
function openOutingModal(){document.getElementById('o-id').value='';['o-name','o-dest','o-purpose','o-depart','o-return'].forEach(id=>document.getElementById(id).value='');document.getElementById('o-vehicle').value='';document.getElementById('o-status').value='out';document.getElementById('m-outing-ttl').textContent='외근 등록';document.getElementById('m-outing').classList.remove('hidden');}
function editOuting(id){const o=window.__outings.find(x=>x.id===id);if(!o)return;document.getElementById('o-id').value=id;document.getElementById('o-name').value=o.name||'';document.getElementById('o-dest').value=o.dest||'';document.getElementById('o-purpose').value=o.purpose||'';document.getElementById('o-depart').value=o.departTime||'';document.getElementById('o-return').value=o.returnTime||'';document.getElementById('o-vehicle').value=o.vehicle||'';document.getElementById('o-status').value=o.status||'out';document.getElementById('m-outing-ttl').textContent='외근 수정';document.getElementById('m-outing').classList.remove('hidden');}
async function saveOuting(){const id=document.getElementById('o-id').value,name=document.getElementById('o-name').value.trim(),dest=document.getElementById('o-dest').value.trim(),purpose=document.getElementById('o-purpose').value.trim();if(!name||!dest||!purpose)return alert('성명, 행선지, 용무는 필수입니다.');const data={name,dest,purpose,departTime:document.getElementById('o-depart').value,returnTime:document.getElementById('o-return').value,vehicle:document.getElementById('o-vehicle').value,status:document.getElementById('o-status').value,updatedAt:new Date().toISOString()};if(window.__db){const{collection:C,doc:D,addDoc:A,updateDoc:U,serverTimestamp:S}=window.__fs;if(id){await U(D(window.__db,'outings',id),data);}else{data.createdAt=S();await A(C(window.__db,'outings'),data);}}else{if(id){const i=window.__outings.findIndex(x=>x.id===id);if(i>=0)window.__outings[i]={...window.__outings[i],...data};}else window.__outings.push({id:Date.now()+'', ...data});renderOutings();}closeModal('m-outing');}
async function delOuting(id){if(!confirm('삭제?'))return;if(window.__db){await window.__fs.deleteDoc(window.__fs.doc(window.__db,'outings',id));}else{window.__outings=window.__outings.filter(x=>x.id!==id);renderOutings();}}

/* ══ LEAVES ══ */
const tm={'연차':'b-leave','출장':'b-biz','병가':'b-out','반차(오전)':'b-leave','반차(오후)':'b-leave','특별휴가':'b-leave'};
function renderLeaves(){const list=window.__leaves;document.querySelectorAll('.js-leave-cnt').forEach(e=>e.textContent=list.length+'명');document.querySelectorAll('.js-leave-tb').forEach(tb=>{if(!list.length){tb.innerHTML='<tr class="empty"><td colspan="6">등록된 휴가·출장이 없습니다.</td></tr>';return;}tb.innerHTML=list.map(l=>`<tr><td class="td-n">${esc(l.name)}</td><td><span class="badge ${tm[l.type]||'b-back'}">${esc(l.type)}</span></td><td>${esc(l.startDate||'-')}</td><td>${esc(l.endDate||'-')}</td><td>${esc(l.note||'-')}</td><td><button class="abt abt-e" data-lid="${l.id}">수정</button> <button class="abt abt-d" data-ldid="${l.id}">삭제</button></td></tr>`).join('');tb.querySelectorAll('[data-lid]').forEach(b=>b.addEventListener('click',()=>editLeave(b.dataset.lid)));tb.querySelectorAll('[data-ldid]').forEach(b=>b.addEventListener('click',()=>delLeave(b.dataset.ldid)));});}
function openLeaveModal(){document.getElementById('l-id').value='';document.getElementById('l-name').value='';document.getElementById('l-type').value='연차';document.getElementById('l-start').value=today();document.getElementById('l-end').value=today();document.getElementById('l-note').value='';document.getElementById('m-leave-ttl').textContent='휴가/출장 등록';document.getElementById('m-leave').classList.remove('hidden');}
function editLeave(id){const l=window.__leaves.find(x=>x.id===id);if(!l)return;document.getElementById('l-id').value=id;document.getElementById('l-name').value=l.name||'';document.getElementById('l-type').value=l.type||'연차';document.getElementById('l-start').value=l.startDate||'';document.getElementById('l-end').value=l.endDate||'';document.getElementById('l-note').value=l.note||'';document.getElementById('m-leave-ttl').textContent='휴가/출장 수정';document.getElementById('m-leave').classList.remove('hidden');}
async function saveLeave(){const id=document.getElementById('l-id').value,name=document.getElementById('l-name').value.trim(),st=document.getElementById('l-start').value,en=document.getElementById('l-end').value;if(!name||!st||!en)return alert('필수항목 입력');const data={name,type:document.getElementById('l-type').value,startDate:st,endDate:en,note:document.getElementById('l-note').value.trim()};if(window.__db){const{collection:C,doc:D,addDoc:A,updateDoc:U,serverTimestamp:S}=window.__fs;if(id){await U(D(window.__db,'leaves',id),data);}else{data.createdAt=S();await A(C(window.__db,'leaves'),data);}}else{if(id){const i=window.__leaves.findIndex(x=>x.id===id);if(i>=0)window.__leaves[i]={...window.__leaves[i],...data};}else window.__leaves.push({id:Date.now()+'', ...data});renderLeaves();}closeModal('m-leave');}
async function delLeave(id){if(!confirm('삭제?'))return;if(window.__db){await window.__fs.deleteDoc(window.__fs.doc(window.__db,'leaves',id));}else{window.__leaves=window.__leaves.filter(x=>x.id!==id);renderLeaves();}}

/* ══ NOTICES ══ */
function renderNotices(){const list=window.__notices;document.querySelectorAll('.js-notice-tb').forEach(tb=>{if(!list.length){tb.innerHTML='<tr class="empty"><td colspan="4">등록된 공지가 없습니다.</td></tr>';return;}tb.innerHTML=list.map((n,i)=>`<tr><td>${i+1}</td><td style="text-align:left;">${esc(n.content)}</td><td>${n.createdAt?fmtD(n.createdAt):'-'}</td><td><button class="abt abt-e" data-nid="${n.id}">수정</button> <button class="abt abt-d" data-ndid="${n.id}">삭제</button></td></tr>`).join('');tb.querySelectorAll('[data-nid]').forEach(b=>b.addEventListener('click',()=>editNotice(b.dataset.nid)));tb.querySelectorAll('[data-ndid]').forEach(b=>b.addEventListener('click',()=>delNotice(b.dataset.ndid)));});const rHtml=list.length?list.slice(-5).reverse().map(n=>`<div class="ni"><div class="ni-dt">${n.createdAt?fmtD(n.createdAt):'-'}</div>${esc(n.content)}</div>`).join(''):'<div style="color:var(--T3);font-size:11px;">공지가 없습니다.</div>';document.querySelectorAll('.js-notice-right').forEach(e=>e.innerHTML=rHtml);updateTicker();}
function openNoticeModal(){document.getElementById('n-id').value='';document.getElementById('n-content').value='';document.getElementById('m-notice-ttl').textContent='공지 등록';document.getElementById('m-notice').classList.remove('hidden');}
function editNotice(id){const n=window.__notices.find(x=>x.id===id);if(!n)return;document.getElementById('n-id').value=id;document.getElementById('n-content').value=n.content||'';document.getElementById('m-notice-ttl').textContent='공지 수정';document.getElementById('m-notice').classList.remove('hidden');}
async function saveNotice(){const id=document.getElementById('n-id').value,cont=document.getElementById('n-content').value.trim();if(!cont)return alert('내용 입력');if(window.__db){const{collection:C,doc:D,addDoc:A,updateDoc:U,serverTimestamp:S}=window.__fs;if(id){await U(D(window.__db,'notices',id),{content:cont});}else{await A(C(window.__db,'notices'),{content:cont,createdAt:S()});}}else{if(id){const i=window.__notices.findIndex(x=>x.id===id);if(i>=0)window.__notices[i].content=cont;}else window.__notices.push({id:Date.now()+'',content:cont,createdAt:new Date().toISOString()});renderNotices();}closeModal('m-notice');}
async function delNotice(id){if(!confirm('삭제?'))return;if(window.__db){await window.__fs.deleteDoc(window.__fs.doc(window.__db,'notices',id));}else{window.__notices=window.__notices.filter(x=>x.id!==id);renderNotices();}}

/* ══ SEARCH / SETTINGS ══ */
function openSearch(){document.getElementById('sch-kw').value='';document.getElementById('sch-type').value='all';document.getElementById('sch-date').value='';document.getElementById('sch-result').innerHTML='';document.getElementById('m-search').classList.remove('hidden');}
function doSearch(){const kw=document.getElementById('sch-kw').value.toLowerCase().trim(),type=document.getElementById('sch-type').value,date=document.getElementById('sch-date').value;let html='';if(type!=='leave'){const items=window.__outings.filter(o=>{const mk=!kw||[o.name,o.dest,o.purpose,o.vehicle].some(s=>(s||'').toLowerCase().includes(kw));const md=!date||(o.updatedAt||'').startsWith(date);return mk&&md;});if(items.length){html+=`<div style="font-weight:700;color:var(--P);font-size:13px;margin-bottom:6px;">외근 현황 (${items.length}건)</div>`;html+=items.map(o=>`<div class="ni" style="border-color:var(--P2);"><b>${esc(o.name)}</b> → ${esc(o.dest)} | ${esc(o.purpose)} | 출발 ${esc(o.departTime||'-')} 복귀예정 ${esc(o.returnTime||'-')}<span class="badge ${o.status==='out'?'b-out':'b-back'}" style="margin-left:4px;">${o.status==='out'?'외근중':'복귀'}</span></div>`).join('');}}if(type!=='outing'){const items=window.__leaves.filter(l=>{const mk=!kw||[l.name,l.type,l.note].some(s=>(s||'').toLowerCase().includes(kw));const md=!date||l.startDate<=date&&date<=l.endDate;return mk&&md;});if(items.length){html+=`<div style="font-weight:700;color:var(--P);font-size:13px;margin:8px 0 6px;">휴가/출장 (${items.length}건)</div>`;html+=items.map(l=>`<div class="ni" style="border-color:#059669;"><b>${esc(l.name)}</b> <span class="badge b-leave">${esc(l.type)}</span> ${esc(l.startDate)} ~ ${esc(l.endDate)} ${l.note?'| '+esc(l.note):''}</div>`).join('');}}if(!html)html='<div style="color:var(--T3);font-size:13px;padding:16px;text-align:center;">검색 결과가 없습니다.</div>';document.getElementById('sch-result').innerHTML=html;}
function openSettings(){renderVehicles();document.getElementById('m-settings').classList.remove('hidden');}
function closeModal(id){document.getElementById(id).classList.add('hidden');}

/* ══ UTILS ══ */
const p=n=>String(n).padStart(2,'0');
const today=()=>new Date().toISOString().split('T')[0];
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD=v=>{try{return new Date(v.seconds?v.seconds*1000:v).toLocaleDateString('ko-KR');}catch{return '-';}};
</script>
