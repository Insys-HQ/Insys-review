<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록 v1.4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f4f8;color:#1e2d3d;font-size:14px;min-height:100vh}

/* NAV */
.nav{width:100%;background:#1b3a5c;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px}
.nav-right{display:flex;align-items:center;gap:10px}
.view-toggle{display:flex;background:#0d2440;border-radius:6px;overflow:hidden}
.view-toggle button{padding:6px 14px;border:none;background:transparent;color:#8fb3cc;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s}
.view-toggle button.active{background:#2e6da4;color:#fff}
.version-badge{color:#5a8db0;font-size:11px}

/* HERO HEADER */
.hero{width:100%;background:linear-gradient(135deg,#b91c1c 0%,#991b1b 60%,#7f1d1d 100%);padding:0}
.hero-inner{max-width:1100px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px}
.rc-logo{flex-shrink:0}
.rc-logo svg{display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.hero-text{flex:1}
.hero-text .main-title{font-size:17px;font-weight:900;color:#fff;letter-spacing:3px;line-height:1}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meeting-type-toggle{display:flex;background:rgba(0,0,0,0.25);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.2)}
.meeting-type-toggle button{padding:7px 18px;border:none;background:transparent;color:rgba(255,255,255,0.7);font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;letter-spacing:0.5px}
.meeting-type-toggle button.active{background:rgba(255,255,255,0.95);color:#991b1b}
.hero-version{color:rgba(255,255,255,0.45);font-size:11px}

/* NAV left side (simplified) */
.nav-left{color:rgba(255,255,255,0.6);font-size:12px;display:flex;align-items:center;gap:6px}
.nav-left .dot{width:5px;height:5px;background:#ef4444;border-radius:50%;animation:pulse 1.5s infinite}

/* LAYOUT */
.container{max-width:1100px;margin:0 auto;padding:20px 24px}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#fff;padding:6px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.tab-btn{flex:1;padding:10px 8px;border:none;background:transparent;border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;color:#5a7a96;cursor:pointer;transition:all .2s}
.tab-btn.active{background:#1b3a5c;color:#fff;box-shadow:0 2px 6px rgba(27,58,92,0.3)}
.tab-content{display:none}
.tab-content.active{display:block}

/* CARD */
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.card-title{font-size:14px;font-weight:700;color:#1b3a5c;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #e8edf2;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:16px}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:12px;font-weight:600;color:#3d5a72;margin-bottom:4px}
input[type=text],input[type=date],input[type=time],textarea,select{
  width:100%;padding:9px 12px;border:1.5px solid #d0dce8;border-radius:7px;
  font-family:'Noto Sans KR',sans-serif;font-size:13px;color:#1e2d3d;
  background:#fafcff;transition:border .2s;outline:none}
input:focus,textarea:focus,select:focus{border-color:#2e6da4;background:#fff}
textarea{resize:vertical;min-height:120px;line-height:1.6}

/* ATTENDEE */
.attendee-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.attendee-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.attendee-row input{margin-bottom:0}
.btn-icon{padding:8px 10px;border:1.5px solid #d0dce8;border-radius:7px;background:#fff;cursor:pointer;font-size:14px;color:#5a7a96;transition:all .2s}
.btn-icon:hover{background:#f0f4f8;border-color:#2e6da4}

/* BUTTONS */
.btn{padding:9px 18px;border:none;border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#1b3a5c;color:#fff}
.btn-primary:hover{background:#2e6da4}
.btn-success{background:#1a6e3a;color:#fff}
.btn-success:hover{background:#22884a}
.btn-warning{background:#b45309;color:#fff}
.btn-warning:hover{background:#d97706}
.btn-danger{background:#b91c1c;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-outline{background:#fff;color:#1b3a5c;border:1.5px solid #1b3a5c}
.btn-outline:hover{background:#f0f4f8}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* AI UPLOAD */
.upload-zone{border:2px dashed #bcd0e0;border-radius:10px;padding:30px;text-align:center;background:#f7fafd;cursor:pointer;transition:all .2s;margin-bottom:14px}
.upload-zone:hover,.upload-zone.dragover{border-color:#2e6da4;background:#ebf3fb}
.upload-zone .upload-icon{font-size:36px;margin-bottom:8px}
.upload-zone p{color:#5a7a96;font-size:13px}
.upload-zone p strong{color:#1b3a5c}
.preview-images{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.preview-images img{width:80px;height:80px;object-fit:cover;border-radius:6px;border:2px solid #d0dce8}
.ai-status{padding:10px 14px;border-radius:7px;font-size:12px;font-weight:500;margin-top:8px;display:none}
.ai-status.loading{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;display:block}
.ai-status.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
.ai-status.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}

/* MINUTES VIEW */
.minutes-header{text-align:center;margin-bottom:20px;padding:20px;background:linear-gradient(135deg,#1b3a5c,#2e6da4);border-radius:10px;color:#fff}
.minutes-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.minutes-header .meta{font-size:12px;opacity:.85;margin-top:8px}
.minutes-section{margin-bottom:16px}
.minutes-section h4{font-size:13px;font-weight:700;color:#1b3a5c;margin-bottom:8px;padding:6px 10px;background:#eef4fb;border-left:3px solid #2e6da4;border-radius:0 5px 5px 0}
.minutes-section .content{font-size:13px;line-height:1.7;color:#2c3e50;padding:0 10px;white-space:pre-wrap}
.attendee-table{width:100%;border-collapse:collapse;font-size:13px}
.attendee-table th{background:#eef4fb;color:#1b3a5c;padding:8px 12px;text-align:center;border:1px solid #d0dce8;font-weight:600;font-size:12px}
.attendee-table td{padding:7px 12px;text-align:center;border:1px solid #e8edf2;color:#2c3e50}
.attendee-table tr:nth-child(even) td{background:#fafcff}

/* ARCHIVE LIST */
.archive-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:8px;border:1.5px solid #e0eaf2;background:#fff;margin-bottom:8px;transition:all .2s;cursor:pointer}
.archive-item:hover{border-color:#2e6da4;box-shadow:0 2px 8px rgba(46,109,164,0.12)}
.archive-item .month-label{font-size:14px;font-weight:700;color:#1b3a5c}
.archive-item .meta-info{font-size:12px;color:#7a98b0;margin-top:2px}
.archive-actions{display:flex;gap:6px}
.archive-actions button{padding:6px 12px;border:1.5px solid #d0dce8;border-radius:6px;background:#fff;font-size:12px;color:#3d5a72;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:500;transition:all .2s}
.archive-actions button:hover{border-color:#2e6da4;color:#2e6da4}
.empty-state{text-align:center;padding:40px;color:#7a98b0}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}

/* PREVIEW MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:90%;max-width:780px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal-head{padding:14px 20px;background:#1b3a5c;color:#fff;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:14px;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:24px}
.modal-foot{padding:12px 20px;border-top:1px solid #e8edf2;display:flex;gap:8px;justify-content:flex-end;background:#f7fafd}
.modal-close{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px}

/* PRINT AREA */
#print-area{display:none}

/* LOADING */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#1b3a5c;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#1a6e3a}
.toast.error{background:#b91c1c}

/* MOBILE */
body.mobile .container{padding:12px}
body.mobile .form-row{grid-template-columns:1fr}
body.mobile .form-row.triple{grid-template-columns:1fr 1fr}
body.mobile .form-row[style*="160px"]{grid-template-columns:1fr 1fr!important}
body.mobile .btn-group{justify-content:stretch}
body.mobile .btn-group .btn{flex:1;justify-content:center}
body.mobile .archive-item{flex-direction:column;align-items:flex-start;gap:10px}
body.mobile .tabs{overflow-x:auto}
body.mobile .tab-btn{white-space:nowrap;font-size:12px;padding:8px 10px}
body.mobile .hero-inner{padding:12px 16px;gap:12px}
body.mobile .rc-logo svg{width:46px;height:46px}
body.mobile .hero-text .main-title{font-size:18px}
body.mobile .hero-text .main-title{font-size:14px}
body.mobile .meeting-type-toggle button{padding:6px 12px;font-size:12px}
body.mobile .hero-right{gap:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* SECTION DIVIDER */
.section-divider{height:1px;background:#e8edf2;margin:16px 0}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#d1fae5;color:#065f46}

@media print{
  .nav,.tabs,.btn-group,.upload-zone,.ai-status,.modal-overlay{display:none!important}
  #print-area{display:block!important}
  body{background:#fff}
}
</style>
</head>

<!-- MAIN -->
<div class="container">
  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('write')">✏️ 회의록 작성</button>
    <button class="tab-btn" onclick="switchTab('view')">📋 현재 회의록</button>
    <button class="tab-btn" onclick="switchTab('archive')">🗂️ 월별 보관함</button>
  </div>

  <!-- TAB: 작성 -->
  <div id="tab-write" class="tab-content active">

    <!-- AI 사진 분석 -->
    <div class="card">
      <div class="card-title"><span class="icon">📷</span> 회의록 사진 업로드 (AI 자동 추출)</div>
      <div class="upload-zone" id="upload-zone" onclick="document.getElementById('photo-input').click()"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="upload-icon">🖼️</div>
        <p><strong>사진을 클릭하거나 드래그하여 업로드</strong></p>
        <p>손으로 쓴 회의록 사진 → AI가 텍스트로 자동 변환</p>
        <p style="margin-top:6px;font-size:11px;color:#9ab0c0">JPG, PNG, HEIC 지원 · 여러 장 동시 업로드 가능</p>
      </div>
      <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event)">
      <div class="preview-images" id="preview-images"></div>
      <button class="btn btn-primary" id="btn-extract" style="display:none" onclick="extractFromPhotos()">
        <span class="spinner" id="extract-spinner" style="display:none"></span>
        🤖 AI로 텍스트 추출하기
      </button>
      <div class="ai-status" id="ai-status"></div>
    </div>

    <!-- 기본 정보 -->
    <div class="card">
      <div class="card-title"><span class="icon">📅</span> 기본 정보</div>
      <div class="form-row" style="grid-template-columns:160px 1fr 1fr 1fr">
        <div>
          <label>회의 구분</label>
          <select id="meeting-type" onchange="onTypeSelectChange(this.value)" style="font-weight:700;color:#991b1b">
            <option value="monthly">월 례 회</option>
            <option value="exec">임 원 회 의</option>
          </select>
        </div>
        <div>
          <label>회의 연월</label>
          <input type="month" id="meeting-month" value="">
        </div>
        <div>
          <label>회의 일시</label>
          <input type="date" id="meeting-date">
        </div>
        <div>
          <label>회의 시간</label>
          <input type="time" id="meeting-time" value="10:00">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>회의 장소</label>
          <input type="text" id="meeting-place" placeholder="예: 서울적십자 대회의실">
        </div>
        <div>
          <label>작성자 (이름 / 콜사인)</label>
          <input type="text" id="writer" placeholder="예: 홍길동 / HL2XXX">
        </div>
      </div>
    </div>

    <!-- 참석자 -->
    <div class="card">
      <div class="card-title"><span class="icon">👥</span> 참석자 명단</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <label style="margin:0;font-size:12px;color:#7a98b0;font-weight:600">이름</label>
        <label style="margin:0;font-size:12px;color:#7a98b0;font-weight:600">콜사인</label>
      </div>
      <div class="attendee-list" id="attendee-list"></div>
      <button class="btn btn-outline" onclick="addAttendee()" style="margin-top:4px">
        ➕ 참석자 추가
      </button>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
        <label style="margin:0">총 참석자</label>
        <input type="text" id="total-count" style="width:80px" placeholder="자동">
        <span style="font-size:12px;color:#7a98b0">명 (직접 입력 가능)</span>
      </div>
    </div>

    <!-- 회의 내용 -->
    <div class="card">
      <div class="card-title"><span class="icon">📝</span> 회의 내용</div>
      <div class="form-row single">
        <div>
          <label>1. 개회 선언 / 사회자</label>
          <input type="text" id="sect-open" placeholder="예: 회장 홍길동(HL0FRC) 개회 선언">
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label>2. 보고 사항</label>
          <textarea id="sect-report" placeholder="각 부서 보고 내용 입력..."></textarea>
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label>3. 안건 심의 / 결의 사항</label>
          <textarea id="sect-agenda" placeholder="안건별 심의 및 결의 내용 입력..."></textarea>
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label>4. 기타 사항 / 공지</label>
          <textarea id="sect-other" placeholder="기타 사항 및 공지 내용..."></textarea>
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label>5. 폐회 / 특이사항</label>
          <input type="text" id="sect-close" placeholder="예: 만세삼창 후 폐회 / 다음 회의 예정일 등">
        </div>
      </div>
    </div>

    <!-- 특별 사항 -->
    <div class="card">
      <div class="card-title"><span class="icon">⭐</span> 특별 기록</div>
      <div class="form-row single">
        <div>
          <label>표창 / 수상</label>
          <textarea id="sect-award" rows="3" placeholder="수상자 이름, 콜사인, 수상 내용..."></textarea>
        </div>
      </div>
      <div class="form-row single">
        <div>
          <label>훈련 / 활동 계획</label>
          <textarea id="sect-plan" rows="3" placeholder="향후 훈련 일정 및 활동 계획..."></textarea>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="previewMinutes()">👁️ 미리보기</button>
      <button class="btn btn-success" onclick="saveMinutes()">💾 Firebase 저장</button>
      <button class="btn btn-outline" onclick="clearForm()">🗑️ 초기화</button>
    </div>
  </div>

  <!-- TAB: 현재 회의록 -->
  <div id="tab-view" class="tab-content">
    <div class="card">
      <div class="card-title"><span class="icon">📋</span> 현재 작성 중인 회의록</div>
      <div id="current-view-area">
        <div class="empty-state">

// ===================== TABS =====================
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{

  });

// ===================== ATTENDEE =====================
function addAttendee(){
  const list = document.getElementById('attendee-list');
  const row = document.createElement('div');
  row.className = 'attendee-row';
  row.innerHTML = `
    <input type="text" placeholder="이름" class="att-name">
    <input type="text" placeholder="콜사인 (예: HL2XXX)" class="att-call">
    <button class="btn-icon" onclick="removeAttendee(this)" title="삭제">🗑️</button>
  `;
  list.appendChild(row);
  updateAttendeeCount();
}

function removeAttendee(btn){
  btn.closest('.attendee-row').remove();
  updateAttendeeCount();
}

function updateAttendeeCount(){
  const count = document.querySelectorAll('.att-name').length;
  const filled = [...document.querySelectorAll('.att-name')].filter(i=>i.value.trim()).length;
  if(!document.getElementById('total-count').value)
    document.getElementById('total-count').placeholder = filled || count;
}

function getAttendees(){
  const rows = document.querySelectorAll('.attendee-row');
  return [...rows].map(r=>({
    name: r.querySelector('.att-name').value.trim(),
    call: r.querySelector('.att-call').value.trim()
  })).filter(a=>a.name||a.call);
}

// ===================== PHOTO UPLOAD =====================
function onDragOver(e){e.preventDefault();document.getElementById('upload-zone').classList.add('dragover')}
function onDragLeave(e){document.getElementById('upload-zone').classList.remove('dragover')}
function onDrop(e){
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('dragover');
  handleFiles([...e.dataTransfer.files]);
}

function handlePhotoUpload(e){handleFiles([...e.target.files])}

function handleFiles(files){
  const imgFiles = files.filter(f=>f.type.startsWith('image/'));
  uploadedPhotos = [...uploadedPhotos, ...imgFiles];
  renderPreviews();
  document.getElementById('btn-extract').style.display = uploadedPhotos.length ? 'flex' : 'none';
}

function renderPreviews(){
  const container = document.getElementById('preview-images');
  container.innerHTML = '';
  uploadedPhotos.forEach((f,i)=>{
    const url = URL.createObjectURL(f);
    const img = document.createElement('img');
    img.src = url;
    img.title = f.name;
    container.appendChild(img);
  });
}

// ===================== AI EXTRACT =====================
async function extractFromPhotos(){
  if(!uploadedPhotos.length){showToast('사진을 먼저 업로드해주세요.','error');return}
  
  const statusEl = document.getElementById('ai-status');
  const spinner = document.getElementById('extract-spinner');
  spinner.style.display = 'inline-block';
  document.getElementById('btn-extract').disabled = true;
  statusEl.className = 'ai-status loading';
  statusEl.textContent = '🤖 AI가 사진을 분석 중입니다...';

  try {
    // Convert images to base64
    const imageContents = await Promise.all(uploadedPhotos.map(async f => {
      const b64 = await fileToBase64(f);
      return {
        type: "image",
        source: { type: "base64", media_type: f.type || "image/jpeg", data: b64 }
      };
    }));

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            ...imageContents,
            {
              type: "text",
              text: `이 사진은 아마추어 무선 봉사단체의 월례회 회의록 사진입니다.
사진에서 다음 항목을 추출하여 JSON으로만 응답하세요 (설명 없이 JSON만):
{
  "meeting_date": "YYYY-MM-DD 형식",
  "meeting_time": "HH:MM 형식",
  "meeting_place": "장소명",
  "attendees": [{"name":"이름","call":"콜사인"}],
  "open": "개회 관련 내용",
  "report": "보고 사항 내용",
  "agenda": "안건 및 결의 내용",
  "other": "기타 사항",
  "close": "폐회 관련 내용",
  "award": "표창/수상 내용",
  "plan": "활동 계획"
}
모르는 항목은 빈 문자열로. JSON만 응답.`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    const text = data.content?.map(c=>c.text||'').join('') || '';
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('JSON 파싱 실패');
    
    const extracted = JSON.parse(jsonMatch[0]);
    fillFormFromExtracted(extracted);
    
    statusEl.className = 'ai-status success';
    statusEl.textContent = '✅ AI 추출 완료! 내용을 확인하고 필요 시 수정하세요.';
    showToast('AI 텍스트 추출 완료!', 'success');
  } catch(err) {
    console.error(err);
    statusEl.className = 'ai-status error';
    statusEl.textContent = '❌ 추출 실패: ' + err.message + ' — 수동으로 입력해주세요.';
    showToast('AI 추출 실패. 수동 입력을 이용해주세요.', 'error');
  } finally {
    spinner.style.display = 'none';
    document.getElementById('btn-extract').disabled = false;
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function fillFormFromExtracted(d){
  if(d.meeting_date) document.getElementById('meeting-date').value = d.meeting_date;
  if(d.meeting_time) document.getElementById('meeting-time').value = d.meeting_time;
  if(d.meeting_place) document.getElementById('meeting-place').value = d.meeting_place;
  if(d.open) document.getElementById('sect-open').value = d.open;
  if(d.report) document.getElementById('sect-report').value = d.report;
  if(d.agenda) document.getElementById('sect-agenda').value = d.agenda;
  if(d.other) document.getElementById('sect-other').value = d.other;
  if(d.close) document.getElementById('sect-close').value = d.close;
  if(d.award) document.getElementById('sect-award').value = d.award;
  if(d.plan) document.getElementById('sect-plan').value = d.plan;
  
  if(d.attendees && d.attendees.length > 0){
    document.getElementById('attendee-list').innerHTML = '';
    d.attendees.forEach(a=>{
      addAttendee();
      const rows = document.querySelectorAll('.attendee-row');
      const last = rows[rows.length-1];
      last.querySelector('.att-name').value = a.name||'';
      last.querySelector('.att-call').value = a.call||'';
    });
    updateAttendeeCount();
  }
}

    report: document.getElementById('sect-report').value,

    award: document.getElementById('sect-award').value,
    plan: document.getElementById('sect-plan').value,
    createdAt: new Date().toISOString(),

  };
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===================== PREVIEW =====================
function previewMinutes(){
  const d = collectData();
  currentMinutesData = d;
  document.getElementById('modal-body').innerHTML = buildMinutesHTML(d);
  document.getElementById('preview-modal').classList.add('open');
}

function closeModal(){
  document.getElementById('preview-modal').classList.remove('open');
}

function renderCurrentView(){
  const d = collectData();
  if(!d.month && !d.date){
    document.getElementById('current-view-area').innerHTML = `
      <div class="empty-state"><div class="empty-icon">📝</div><p>작성 탭에서 내용을 입력해주세요.</p></div>`;
    document.getElementById('view-btn-group').style.display = 'none';
    return;
  }
  currentMinutesData = d;
  document.getElementById('current-view-area').innerHTML = buildMinutesHTML(d);
  document.getElementById('view-btn-group').style.display = 'flex';
}

// ===================== SAVE =====================
async function saveMinutes(){
  const d = collectData();
  if(!d.month){showToast('회의 연월을 입력해주세요.','error');return}
  
  showToast('저장 중...', '');
  try {
    d.updatedAt = new Date().toISOString();
    await db.collection('minutes_rcnet').doc(d.month).set(d);
    showToast('✅ Firebase에 저장되었습니다.', 'success');
    currentMinutesData = d;
    loadArchive();
    closeModal();
  } catch(err) {
    console.error(err);
    showToast('저장 실패: ' + err.message, 'error');
  }
}

// ===================== PDF =====================
function downloadPDF(){
  const d = currentMinutesData || collectData();
  const el = document.createElement('div');
  el.style.cssText = 'padding:20px;font-family:Noto Sans KR,sans-serif;max-width:700px;margin:0 auto';
  el.innerHTML = `
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
      *{font-family:'Noto Sans KR',sans-serif}
      .minutes-header{text-align:center;margin-bottom:20px;padding:16px;background:#1b3a5c;border-radius:8px;color:#fff}
      .minutes-header h2{font-size:18px;font-weight:900;letter-spacing:2px}
      .minutes-section{margin-bottom:14px}
      .minutes-section h4{font-size:12px;font-weight:700;color:#1b3a5c;margin-bottom:6px;padding:5px 8px;background:#eef4fb;border-left:3px solid #2e6da4}
      .minutes-section .content{font-size:12px;line-height:1.7;color:#2c3e50;padding:0 10px;white-space:pre-wrap}
      .attendee-table{width:100%;border-collapse:collapse;font-size:12px}
      .attendee-table th{background:#eef4fb;color:#1b3a5c;padding:6px 10px;text-align:center;border:1px solid #d0dce8;font-weight:600}
      .attendee-table td{padding:5px 10px;text-align:center;border:1px solid #e8edf2}
    </style>
    ${buildMinutesHTML(d)}
  `;
  document.body.appendChild(el);
  
  const filename = `minutes_${d.month||'unknown'}.pdf`;
  html2pdf().set({
    margin: [10,10,10,10],
    filename,
    html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(el).save().then(()=>{
    document.body.removeChild(el);
    showToast('📄 PDF 다운로드 완료', 'success');
  });
}

function printMinutes(){
  const d = currentMinutesData || collectData();
  document.getElementById('print-area').innerHTML = buildMinutesHTML(d);
  window.print();
}

// ===================== ARCHIVE =====================
async function loadArchive(){
  try {
    const snap = await db.collection('minutes_rcnet').orderBy('month','desc').get();
    allArchive = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderArchive(allArchive);
    populateYearFilter();
  } catch(err) {
    console.error('Archive load error:', err);
    renderArchive([]);
  }
}

function renderArchive(list){
  const container = document.getElementById('archive-list');
  if(!list.length){
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div><p>저장된 회의록이 없습니다.</p></div>`;
    return;
  }
  container.innerHTML = list.map(item=>{
    const [y,m] = (item.month||'').split('-');
    const label = y && m ? `${y}년 ${m}월` : item.month;
    const updated = item.updatedAt ? new Date(item.updatedAt).toLocaleDateString('ko-KR') : '-';
    const attCnt = item.attendees?.length || 0;
    const tLabel = item.meetingType==='exec' ? '임원회의' : '월례회';
    const tColor = item.meetingType==='exec' ? '#7c3aed' : '#1a6e3a';
    const tBg   = item.meetingType==='exec' ? '#ede9fe' : '#d1fae5';
    return `
      <div class="archive-item">
        <div>
          <div class="month-label" style="display:flex;align-items:center;gap:8px">
            📋 ${label}
            <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:${tBg};color:${tColor}">${tLabel}</span>
          </div>
          <div class="meta-info">장소: ${item.place||'-'} · 참석 ${item.totalCount||attCnt}명 · 수정: ${updated}</div>
        </div>
        <div class="archive-actions">
          <button onclick="loadMinutes('${item.month}')">👁️ 열기</button>
          <button onclick="previewArchiveItem('${item.month}')">🔍 미리보기</button>
          <button onclick="downloadArchivePDF('${item.month}')">📄 PDF</button>
          <button onclick="deleteMinutes('${item.month}')" style="color:#b91c1c">🗑️</button>
        </div>
      </div>
    `;
  }).join('');
}

function filterArchive(){
  const kw = document.getElementById('search-keyword').value.toLowerCase();
  const yr = document.getElementById('filter-year').value;
  const filtered = allArchive.filter(item=>{
    const matchYear = !yr || (item.month||'').startsWith(yr);
    const matchKw = !kw || JSON.stringify(item).toLowerCase().includes(kw);
    return matchYear && matchKw;
  });
  renderArchive(filtered);
}

function populateYearFilter(){
  const sel = document.getElementById('filter-year');
  const years = [...new Set(allArchive.map(i=>(i.month||'').split('-')[0]).filter(Boolean))].sort().reverse();
  const cur = sel.value;
  sel.innerHTML = '<option value="">연도</option>' + years.map(y=>`<option value="${y}" ${y===cur?'selected':''}>${y}년</option>`).join('');
}

async function loadMinutes(month){
  try {
    const doc = await db.collection('minutes_rcnet').doc(month).get();
    if(!doc.exists){showToast('회의록을 찾을 수 없습니다.','error');return}
    const d = doc.data();
    fillFormFromData(d);
    switchTab('write');
    showToast(`${month} 회의록을 불러왔습니다.`, 'success');
  } catch(err) {
    showToast('불러오기 실패: '+err.message,'error');
  }
}

function fillFormFromData(d){
  setMeetingType(d.meetingType||'monthly');
  document.getElementById('meeting-month').value = d.month||'';
  document.getElementById('meeting-date').value = d.date||'';
  document.getElementById('meeting-time').value = d.time||'10:00';
  document.getElementById('meeting-place').value = d.place||'';
  document.getElementById('writer').value = d.writer||'';
  document.getElementById('total-count').value = d.totalCount||'';
  document.getElementById('sect-open').value = d.open||'';
  document.getElementById('sect-report').value = d.report||'';
  document.getElementById('sect-agenda').value = d.agenda||'';
  document.getElementById('sect-other').value = d.other||'';
  document.getElementById('sect-close').value = d.close||'';
  document.getElementById('sect-award').value = d.award||'';
  document.getElementById('sect-plan').value = d.plan||'';
  
  document.getElementById('attendee-list').innerHTML = '';
  (d.attendees||[]).forEach(a=>{
    addAttendee();
    const rows = document.querySelectorAll('.attendee-row');
    const last = rows[rows.length-1];
    last.querySelector('.att-name').value = a.name||'';
    last.querySelector('.att-call').value = a.call||'';
  });
  if(!d.attendees?.length) for(let i=0;i<3;i++) addAttendee();
}

async function previewArchiveItem(month){
  try {
    const doc = await db.collection('minutes_rcnet').doc(month).get();
    if(!doc.exists){showToast('없는 회의록입니다.','error');return}
    const d = doc.data();
    currentMinutesData = d;
    document.getElementById('modal-body').innerHTML = buildMinutesHTML(d);
    document.getElementById('preview-modal').classList.add('open');
  } catch(err) {
    showToast('오류: '+err.message,'error');
  }
}

async function downloadArchivePDF(month){
  try {
    const doc = await db.collection('minutes_rcnet').doc(month).get();
    if(!doc.exists){showToast('없는 회의록입니다.','error');return}
    currentMinutesData = doc.data();
    downloadPDF();
  } catch(err) {
    showToast('오류: '+err.message,'error');
  }
}

async function deleteMinutes(month){
  if(!confirm(`${month} 회의록을 삭제하시겠습니까?`)) return;
  try {
    await db.collection('minutes_rcnet').doc(month).delete();
    showToast('삭제 완료', 'success');
    loadArchive();
  } catch(err) {
    showToast('삭제 실패: '+err.message,'error');
  }
}

// ===================== CLEAR FORM =====================
function clearForm(){
  if(!confirm('입력된 내용을 모두 초기화하시겠습니까?')) return;
  const now = new Date();
  document.getElementById('meeting-month').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('meeting-date').value = now.toISOString().split('T')[0];
  document.getElementById('meeting-time').value = '10:00';
  document.getElementById('meeting-place').value = '';
  document.getElementById('writer').value = 'HL2TLS';
  document.getElementById('total-count').value = '';
  document.getElementById('sect-open').value = '';
  document.getElementById('sect-report').value = '';
  document.getElementById('sect-agenda').value = '';
  document.getElementById('sect-other').value = '';
  document.getElementById('sect-close').value = '';
  document.getElementById('sect-award').value = '';
  document.getElementById('sect-plan').value = '';
  document.getElementById('attendee-list').innerHTML = '';
  for(let i=0;i<3;i++) addAttendee();
  uploadedPhotos = [];
  document.getElementById('preview-images').innerHTML = '';
  document.getElementById('btn-extract').style.display = 'none';
  document.getElementById('ai-status').className = 'ai-status';
  showToast('초기화 완료', 'success');
}

// ===================== TOAST =====================
function showToast(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.getElementById('preview-modal').addEventListener('click', e=>{
  if(e.target===e.currentTarget) closeModal();
});
</script>
