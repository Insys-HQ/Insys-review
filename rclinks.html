<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>대한적십자사 서울특별시지사 재난대응봉사회 - 링크 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --rc-red:#a71930;
    --rc-red-dark:#7d1224;
    --rc-red-soft:#fbecef;
    --ink:#25292e;
    --ink-sub:#5b6169;
    --line:#e4e2df;
    --bg:#f6f5f3;
    --card:#ffffff;
    --ok:#2e7d4f;
    --danger:#b3261e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR',sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- 로그인 화면 ---------- */
  #loginScreen{
    position:fixed; inset:0;
    background:linear-gradient(160deg,#7d1224 0%,#a71930 55%,#8f1729 100%);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    padding:24px;
  }
  .login-box{
    width:100%; max-width:380px;
    background:var(--card);
    border-radius:16px;
    padding:36px 32px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    text-align:center;
  }
  .rc-emblem{
    width:56px; height:56px;
    margin:0 auto 16px;
    position:relative;
  }
  .rc-emblem::before, .rc-emblem::after{
    content:"";
    position:absolute;
    background:var(--rc-red);
    border-radius:3px;
  }
  .rc-emblem::before{ width:100%; height:32%; top:34%; left:0; }
  .rc-emblem::after{ height:100%; width:32%; left:34%; top:0; }
  .login-org{
    font-size:12px; color:var(--ink-sub); font-weight:500;
    letter-spacing:.3px; margin-bottom:2px;
  }
  .login-title{
    font-size:19px; font-weight:900; color:var(--ink);
    margin:0 0 22px;
  }
  .field{ text-align:left; margin-bottom:12px; }
  .field label{ display:block; font-size:11px; font-weight:700; color:var(--ink-sub); margin-bottom:5px; }
  .field input{
    width:100%; padding:11px 13px;
    border:1.5px solid var(--line); border-radius:9px;
    font-size:14px; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
    background:#fafafa;
  }
  .field input:focus{ outline:none; border-color:var(--rc-red); background:#fff; }
  #loginBtn{
    width:100%; margin-top:6px;
    background:var(--rc-red); color:#fff; border:none;
    padding:12px; border-radius:9px;
    font-size:14px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
    cursor:pointer;
  }
  #loginBtn:hover{ background:var(--rc-red-dark); }
  #loginError{
    margin-top:12px; font-size:12px; color:var(--danger);
    min-height:16px; font-weight:500;
  }

  /* ---------- 메인 화면 ---------- */
  #app{ display:none; min-height:100vh; }
  header.top{
    background:var(--rc-red);
    color:#fff;
  }
  .nav-inner{
    max-width:1100px; margin:0 auto;
    padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .rc-emblem{ width:30px; height:30px; margin:0; }
  .brand .rc-emblem::before, .brand .rc-emblem::after{ background:#fff; }
  .brand-text .b1{ font-size:11px; opacity:.85; font-weight:500; }
  .brand-text .b2{ font-size:15px; font-weight:900; }
  .top-actions{ display:flex; align-items:center; gap:8px; }
  .ver-badge{
    font-size:10px; background:rgba(255,255,255,.18);
    padding:3px 9px; border-radius:20px; font-weight:700;
  }
  .btn-ghost{
    background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35);
    padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .btn-ghost:hover{ background:rgba(255,255,255,.26); }

  main{ max-width:1100px; margin:0 auto; padding:20px; }
  #app.mode-mobile main{ max-width:480px; }
  #app.mode-mobile .nav-inner{ max-width:480px; }

  .panel{
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:18px 20px; margin-bottom:16px;
  }
  .panel-title{ font-size:14px; font-weight:900; margin:0 0 12px; color:var(--ink); }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  #app.mode-mobile .form-grid{ grid-template-columns:1fr; }
  .form-grid .full{ grid-column:1/-1; }
  .form-grid label{ display:block; font-size:11px; font-weight:700; color:var(--ink-sub); margin-bottom:5px; }
  .form-grid input{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13px; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  }
  .form-grid input:focus{ outline:none; border-color:var(--rc-red); }
  .form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .btn{
    padding:9px 16px; border-radius:8px; font-size:12px; font-weight:700;
    border:none; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .btn-primary{ background:var(--rc-red); color:#fff; }
  .btn-primary:hover{ background:var(--rc-red-dark); }
  .btn-plain{ background:#eee; color:var(--ink-sub); }
  .btn-plain:hover{ background:#e2e2e2; }

  .list-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .count-tag{ font-size:11px; color:var(--ink-sub); font-weight:600; }

  .link-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  #app.mode-mobile .link-grid{ grid-template-columns:1fr; }

  .link-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 15px; display:flex; flex-direction:column; gap:6px;
  }
  .link-card .lname{ font-size:14px; font-weight:700; color:var(--ink); word-break:break-all; }
  .link-card .lmemo{ font-size:12px; color:var(--ink-sub); }
  .link-card .lurl{ font-size:11px; color:var(--rc-red); word-break:break-all; text-decoration:none; }
  .link-card .lurl:hover{ text-decoration:underline; }
  .card-actions{ display:flex; gap:6px; margin-top:8px; }
  .mini-btn{
    flex:1; text-align:center; padding:7px 0; border-radius:7px; font-size:11px; font-weight:700;
    border:none; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .mini-open{ background:var(--rc-red-soft); color:var(--rc-red); }
  .mini-open:hover{ background:#f5dde1; }
  .mini-edit{ background:#eef1f4; color:var(--ink-sub); }
  .mini-edit:hover{ background:#e4e8ec; }
  .mini-del{ background:#fbeceb; color:var(--danger); }
  .mini-del:hover{ background:#f6dad8; }

  .empty{
    text-align:center; padding:36px 10px; color:var(--ink-sub); font-size:13px;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:9px;
    font-size:12px; font-weight:600; opacity:0; transition:.25s;
    pointer-events:none; z-index:300;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer.foot{
    text-align:center; padding:20px; font-size:11px; color:#9aa0a6;
  }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-box">
    <div class="rc-emblem"></div>
    <div class="login-org">대한적십자사 서울특별시지사</div>
    <div class="login-title">재난대응봉사회 링크 관리</div>
    <div class="field">
      <label>아이디</label>
      <input type="text" id="loginId" placeholder="아이디 입력" autocomplete="off">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="off">
    </div>
    <button id="loginBtn">로그인</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- 메인 화면 -->
<div id="app" class="mode-mobile">
  <header class="top">
    <div class="nav-inner">
      <div class="brand">
        <div class="rc-emblem"></div>
        <div class="brand-text">
          <div class="b1">대한적십자사 서울특별시지사</div>
          <div class="b2">재난대응봉사회 링크 관리</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="ver-badge">v1.0</span>
        <button class="btn-ghost" id="viewToggleBtn">PC 화면</button>
        <button class="btn-ghost" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-title" id="formTitle">링크 추가</div>
      <div class="form-grid">
        <div class="full">
          <label>제목 *</label>
          <input type="text" id="fTitle" placeholder="예: 재난안전포털">
        </div>
        <div class="full">
          <label>URL *</label>
          <input type="text" id="fUrl" placeholder="https://...">
        </div>
        <div class="full">
          <label>설명 (선택)</label>
          <input type="text" id="fMemo" placeholder="간단한 설명">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-plain" id="cancelEditBtn" style="display:none;">취소</button>
        <button class="btn btn-primary" id="saveBtn">저장</button>
      </div>
    </div>

    <div class="panel">
      <div class="list-head">
        <div class="panel-title" style="margin:0;">등록된 링크</div>
        <span class="count-tag" id="countTag">0건</span>
      </div>
      <div class="link-grid" id="linkGrid"></div>
      <div class="empty" id="emptyState" style="display:none;">등록된 링크가 없습니다. 위에서 새 링크를 추가하세요.</div>
    </div>
  </main>

  <footer class="foot">담당: 인시스 AI혁신 연구개발실 · ys.kim@in-sys.co.kr</footer>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYqd2uRr1ZvFLDCWuS15h9qFkT-Dvg5Es",
  authDomain: "insys-work.firebaseapp.com",
  projectId: "insys-work",
  storageBucket: "insys-work.appspot.com",
  messagingSenderId: "225275784859",
  appId: "1:225275784859:web:bd12815c6dc47c0c49e03e"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const linksCol = collection(db, "rc_disaster_links");

const LOGIN_ID = "hl0frc";
const LOGIN_PW = "145.620";
const SESSION_KEY = "rclinks_session_v1";

const $ = (id) => document.getElementById(id);
let editingId = null;
let allLinks = [];

/* ---------------- 로그인 ---------------- */
function tryLogin(){
  const id = $("loginId").value.trim();
  const pw = $("loginPw").value;
  if(id === LOGIN_ID && pw === LOGIN_PW){
    sessionStorage.setItem(SESSION_KEY, "1");
    showApp();
  } else {
    $("loginError").textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
  }
}
function showApp(){
  $("loginScreen").style.display = "none";
  $("app").style.display = "block";
}
$("loginBtn").addEventListener("click", tryLogin);
$("loginPw").addEventListener("keydown", (e) => { if(e.key === "Enter") tryLogin(); });
$("loginId").addEventListener("keydown", (e) => { if(e.key === "Enter") $("loginPw").focus(); });

$("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

if(sessionStorage.getItem(SESSION_KEY) === "1"){
  showApp();
}

/* ---------------- 모바일/PC 토글 ---------------- */
$("viewToggleBtn").addEventListener("click", () => {
  const el = $("app");
  const isMobile = el.classList.toggle("mode-mobile");
  $("viewToggleBtn").textContent = isMobile ? "PC 화면" : "모바일 화면";
});

/* ---------------- 토스트 ---------------- */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------------- 링크 CRUD ---------------- */
function normalizeUrl(u){
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}

function resetForm(){
  editingId = null;
  $("fTitle").value = "";
  $("fUrl").value = "";
  $("fMemo").value = "";
  $("formTitle").textContent = "링크 추가";
  $("saveBtn").textContent = "저장";
  $("cancelEditBtn").style.display = "none";
}

$("cancelEditBtn").addEventListener("click", resetForm);

$("saveBtn").addEventListener("click", async () => {
  const title = $("fTitle").value.trim();
  const urlRaw = $("fUrl").value.trim();
  const memo = $("fMemo").value.trim();
  if(!title || !urlRaw){
    toast("제목과 URL을 입력하세요.");
    return;
  }
  const url = normalizeUrl(urlRaw);
  $("saveBtn").disabled = true;
  try{
    if(editingId){
      await updateDoc(doc(db, "rc_disaster_links", editingId), { title, url, memo, updatedAt: serverTimestamp() });
      toast("수정되었습니다.");
    } else {
      await addDoc(linksCol, { title, url, memo, createdAt: serverTimestamp() });
      toast("추가되었습니다.");
    }
    resetForm();
  } catch(e){
    console.error(e);
    toast("저장 중 오류가 발생했습니다.");
  } finally {
    $("saveBtn").disabled = false;
  }
});

function startEdit(link){
  editingId = link.id;
  $("fTitle").value = link.title || "";
  $("fUrl").value = link.url || "";
  $("fMemo").value = link.memo || "";
  $("formTitle").textContent = "링크 수정";
  $("saveBtn").textContent = "수정 완료";
  $("cancelEditBtn").style.display = "inline-block";
  window.scrollTo({ top:0, behavior:"smooth" });
}

async function removeLink(id, title){
  if(!confirm(`"${title}" 링크를 삭제하시겠습니까?`)) return;
  try{
    await deleteDoc(doc(db, "rc_disaster_links", id));
    toast("삭제되었습니다.");
  } catch(e){
    console.error(e);
    toast("삭제 중 오류가 발생했습니다.");
  }
}

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function render(){
  const grid = $("linkGrid");
  $("countTag").textContent = `${allLinks.length}건`;
  if(allLinks.length === 0){
    grid.innerHTML = "";
    $("emptyState").style.display = "block";
    return;
  }
  $("emptyState").style.display = "none";
  grid.innerHTML = allLinks.map((l) => `
    <div class="link-card">
      <div class="lname">${escapeHtml(l.title)}</div>
      ${l.memo ? `<div class="lmemo">${escapeHtml(l.memo)}</div>` : ""}
      <a class="lurl" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.url)}</a>
      <div class="card-actions">
        <button class="mini-btn mini-open" data-act="open" data-id="${l.id}">열기</button>
        <button class="mini-btn mini-edit" data-act="edit" data-id="${l.id}">수정</button>
        <button class="mini-btn mini-del" data-act="del" data-id="${l.id}">삭제</button>
      </div>
    </div>
  `).join("");
}

$("linkGrid").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const id = btn.dataset.id;
  const link = allLinks.find((l) => l.id === id);
  if(!link) return;
  if(btn.dataset.act === "open") window.open(link.url, "_blank", "noopener");
  if(btn.dataset.act === "edit") startEdit(link);
  if(btn.dataset.act === "del") removeLink(link.id, link.title);
});

onSnapshot(query(linksCol, orderBy("createdAt", "desc")), (snap) => {
  allLinks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  render();
}, (err) => {
  console.error(err);
  toast("링크 목록을 불러오지 못했습니다.");
});
</script>
</body>
</html>
