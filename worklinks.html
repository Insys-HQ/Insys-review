<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>업무용 검토자료 링크 모음 | 인시스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1f2d3d;
    --navy-2:#2c3e50;
    --blue:#3b5fa4;
    --blue-light:#eaf0fb;
    --gray-txt:#33404d;
    --gray-sub:#66707a;
    --border:#dde3ea;
    --bg:#f4f6f9;
    --card-bg:#ffffff;
    --danger:#b23a3a;
    --danger-bg:#fbebeb;
    --ok:#2f7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR',sans-serif;
    background:var(--bg);
    color:var(--gray-txt);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:13px;}

  /* ===== NAV ===== */
  .nav{
    width:100%;
    background:var(--navy);
    border-bottom:3px solid var(--blue);
  }
  .nav-inner{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:58px;
  }
  .nav-brand{display:flex;align-items:center;gap:8px;color:#fff;}
  .nav-brand .logo{
    width:28px;height:28px;border-radius:6px;
    background:var(--blue);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:13px;color:#fff;
  }
  .nav-brand .title{font-weight:700;font-size:15px;}
  .nav-brand .ver{font-size:10px;color:#9fb0c3;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:10px;margin-left:4px;}
  .nav-user{display:flex;align-items:center;gap:10px;font-size:12px;color:#cfd8e3;}
  .nav-user .email{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btn-nav{
    background:rgba(255,255,255,.1);
    color:#fff;border:1px solid rgba(255,255,255,.2);
    padding:6px 12px;border-radius:6px;font-size:12px;
  }
  .btn-nav:hover{background:rgba(255,255,255,.18);}

  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;}

  /* ===== AUTH SCREEN ===== */
  .auth-shell{
    min-height:calc(100vh - 58px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;max-width:380px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:28px 24px 24px;
    box-shadow:0 2px 10px rgba(31,45,61,.06);
  }
  .auth-head{text-align:center;margin-bottom:18px;}
  .auth-head .logo{
    width:44px;height:44px;border-radius:10px;background:var(--blue);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:900;font-size:18px;margin:0 auto 10px;
  }
  .auth-head h1{font-size:16px;margin:0 0 4px;color:var(--navy);}
  .auth-head p{font-size:12px;color:var(--gray-sub);margin:0;}
  .tabs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;}
  .tabs button{flex:1;padding:9px 0;background:#fff;border:none;font-size:13px;font-weight:500;color:var(--gray-sub);}
  .tabs button.active{background:var(--blue);color:#fff;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--gray-sub);margin-bottom:5px;}
  .field input{
    width:100%;padding:10px 12px;border:1px solid var(--border);
    border-radius:7px;color:var(--navy);background:#fbfcfd;
  }
  .field input:focus{outline:none;border-color:var(--blue);background:#fff;}
  .row-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-sub);margin:2px 0 16px;}
  .row-check input{width:14px;height:14px;}
  .btn-main{
    width:100%;padding:11px 0;border:none;border-radius:7px;
    background:var(--blue);color:#fff;font-size:14px;font-weight:700;
  }
  .btn-main:hover{background:#32508c;}
  .btn-main:disabled{background:#a9b7cc;cursor:not-allowed;}
  .auth-msg{font-size:12px;text-align:center;margin-top:12px;min-height:16px;}
  .auth-msg.err{color:var(--danger);}
  .auth-msg.ok{color:var(--ok);}

  /* ===== MAIN ===== */
  .main{display:none;padding:20px 0 60px;}
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .toolbar h2{font-size:17px;color:var(--navy);margin:0;font-weight:700;}
  .toolbar .sub{font-size:12px;color:var(--gray-sub);margin-top:2px;}
  .toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .search-box{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);border-radius:7px;
    background:#fff;padding:7px 10px;min-width:180px;
  }
  .search-box input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--navy);}
  select.cat-filter{
    border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:#fff;color:var(--navy);
  }
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .view-toggle button{padding:8px 14px;background:#fff;border:none;font-size:12px;color:var(--gray-sub);font-weight:500;}
  .view-toggle button.active{background:var(--navy-2);color:#fff;}
  .btn-add{
    background:var(--blue);color:#fff;border:none;border-radius:7px;
    padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;
  }
  .btn-add:hover{background:#32508c;}

  .empty{
    text-align:center;color:var(--gray-sub);font-size:13px;
    padding:60px 20px;border:1px dashed var(--border);border-radius:10px;background:#fff;
  }

  /* PC: grid / Mobile: list -- controlled by body class */
  #linkGrid{display:grid;gap:12px;}
  body.view-pc #linkGrid{grid-template-columns:repeat(3,1fr);}
  body.view-mobile #linkGrid{grid-template-columns:1fr;}

  .lcard{
    background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 1px 3px rgba(31,45,61,.04);
  }
  .lcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .lcard-title{font-size:14px;font-weight:700;color:var(--navy);word-break:break-all;}
  .lcard-cat{
    flex:none;font-size:10px;font-weight:700;color:var(--blue);
    background:var(--blue-light);padding:3px 8px;border-radius:10px;white-space:nowrap;
  }
  .lcard-url{
    font-size:11.5px;color:var(--gray-sub);word-break:break-all;
    background:#f7f9fb;border:1px solid var(--border);border-radius:6px;padding:6px 8px;
  }
  .lcard-memo{font-size:12px;color:var(--gray-sub);}
  .lcard-btns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .lbtn{
    border:1px solid var(--border);background:#fff;color:var(--gray-txt);
    padding:6px 10px;border-radius:6px;font-size:11.5px;font-weight:500;
  }
  .lbtn:hover{border-color:var(--blue);color:var(--blue);}
  .lbtn.open{background:var(--navy-2);color:#fff;border-color:var(--navy-2);}
  .lbtn.open:hover{background:var(--navy);}
  .lbtn.copy.copied{background:var(--ok);color:#fff;border-color:var(--ok);}
  .lbtn.del{color:var(--danger);}
  .lbtn.del:hover{background:var(--danger-bg);border-color:var(--danger);}

  /* ===== MODAL ===== */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(20,28,38,.5);
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:#fff;border-radius:12px;width:100%;max-width:420px;
    padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.2);
  }
  .modal h3{margin:0 0 14px;font-size:15px;color:var(--navy);}
  .modal .field label{color:var(--gray-sub);}
  .modal-btns{display:flex;gap:8px;margin-top:16px;}
  .modal-btns button{flex:1;padding:10px 0;border-radius:7px;border:none;font-size:13px;font-weight:700;}
  .modal-btns .cancel{background:#eef1f4;color:var(--gray-txt);}
  .modal-btns .save{background:var(--blue);color:#fff;}

  footer{
    text-align:center;font-size:11px;color:var(--gray-sub);
    padding:20px 0 30px;
  }

  @media (max-width:820px){
    body.view-pc #linkGrid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .nav-user .email{display:none;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar-right{justify-content:space-between;}
    body.view-pc #linkGrid{grid-template-columns:1fr;}
  }
</style>
</head>
<body class="view-mobile">

<div class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="logo">IS</div>
      <div class="title">업무용 검토자료 링크</div>
      <div class="ver">v1.0</div>
    </div>
    <div class="nav-user" id="navUser" style="display:none;">
      <span class="email" id="navEmail"></span>
      <button class="btn-nav" id="btnLogout">로그아웃</button>
    </div>
  </div>
</div>

<!-- ===== 로그인 / 회원가입 ===== -->
<div class="auth-shell" id="authShell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="logo">IS</div>
      <h1>인시스 업무용 검토자료</h1>
      <p>여러 업무 검토용 웹 링크를 한곳에서 관리합니다</p>

    <div class="tabs">
      <button id="tabLogin" class="active">로그인</button>

    <div id="loginForm">
      <div class="field">
        <label>이메일(아이디)</label>
        <input type="email" id="loginEmail" placeholder="name@in-sys.co.kr" autocomplete="username">

      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <div class="row-check">
        <input type="checkbox" id="loginRemember" checked>
        <label for="loginRemember">이 브라우저에서 로그인 상태 유지 (아이디·자동로그인 저장)</label>

      <button class="btn-main" id="btnLogin">로그인</button>

    <div id="signupForm" style="display:none;">

        <label>이메일(아이디)</label>

      </div>
      <div class="field">
        <label>이름</label>
        <input type="text" id="suName" placeholder="예: 김양섭">

      <div class="field">
        <label>비밀번호 (6자 이상)</label>
        <input type="password" id="suPw" placeholder="비밀번호 설정" autocomplete="new-password">
      </div>
      <div class="field">
        <label>비밀번호 확인</label>
        <input type="password" id="suPw2" placeholder="비밀번호 재입력" autocomplete="new-password">

      <button class="btn-main" id="btnSignup">계정 등록</button>

    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ===== 메인(로그인 후) ===== -->
<div class="main" id="mainArea">
  <div class="wrap">
    <div class="toolbar">
      <div>
        <h2>업무 검토자료 링크</h2>
        <div class="sub" id="countInfo">0개 링크</div>
      </div>
      <div class="toolbar-right">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="제목·URL 검색">
        </div>
        <select class="cat-filter" id="catFilter">
          <option value="">전체 분류</option>
        </select>
        <div class="view-toggle">
          <button id="btnViewMobile" class="active">모바일</button>

    <div id="emptyMsg" class="empty" style="display:none;">

    </div>
    <div id="linkGrid"></div>
  </div>
  <footer>인시스 AI혁신 연구개발실 &nbsp;|&nbsp; ys.kim@in-sys.co.kr &nbsp;|&nbsp; worklinks.html v1.0</footer>
</div>

<!-- ===== 링크 추가/수정 모달 ===== -->
<div class="modal-bg" id="linkModalBg">
  <div class="modal">
    <h3 id="linkModalTitle">링크 추가</h3>
    <input type="hidden" id="linkId">
    <div class="field">
      <label>제목</label>
      <input type="text" id="linkTitle" placeholder="예: 근로기준법 전문 조회">
    </div>
    <div class="field">
      <label>URL</label>
      <input type="text" id="linkUrl" placeholder="https://...">
    </div>
    <div class="field">
      <label>분류</label>
      <input type="text" id="linkCat" placeholder="예: 노무, 법률, 시공, 재무, 기타" list="catList">
      <datalist id="catList"></datalist>
    </div>

      <input type="text" id="linkMemo" placeholder="간단한 설명">

      <button class="save" id="btnLinkSave">저장</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, setPersistence,
  browserLocalPersistence, browserSessionPersistence, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, query, where, orderBy,
  addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYqd2uRr1ZvFLDCWuS15h9qFkT-Dvg5Es",
  authDomain: "insys-work.firebaseapp.com",
  projectId: "insys-work",
  storageBucket: "insys-work.firebasestorage.app",
  messagingSenderId: "225275784859",
  appId: "1:225275784859:web:bd12815c6dc47c0c49e03e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const LS_EMAIL_KEY = "worklinks_saved_email";
const LS_VIEW_KEY = "worklinks_view_mode";

let currentUser = null;
let unsubLinks = null;
let allLinks = [];

/* ---------- DOM refs ---------- */
const authShell = document.getElementById("authShell");
const mainArea = document.getElementById("mainArea");
const navUser = document.getElementById("navUser");
const navEmail = document.getElementById("navEmail");
const authMsg = document.getElementById("authMsg");

const tabLogin = document.getElementById("tabLogin");
const tabSignup = document.getElementById("tabSignup");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

/* ---------- 탭 전환 ---------- */
tabLogin.addEventListener("click", () => {
  tabLogin.classList.add("active"); tabSignup.classList.remove("active");
  loginForm.style.display = "block"; signupForm.style.display = "none";
  clearMsg();
});
tabSignup.addEventListener("click", () => {
  tabSignup.classList.add("active"); tabLogin.classList.remove("active");
  signupForm.style.display = "block"; loginForm.style.display = "none";
  clearMsg();
});

function showMsg(text, type){
  authMsg.textContent = text;
  authMsg.className = "auth-msg " + (type || "");
}
function clearMsg(){ authMsg.textContent = ""; authMsg.className = "auth-msg"; }

function mapAuthError(err){
  const code = err && err.code ? err.code : "";
  if (code.includes("email-already-in-use")) return "이미 등록된 이메일입니다. 로그인 탭을 이용하세요.";
  if (code.includes("invalid-email")) return "이메일 형식이 올바르지 않습니다.";
  if (code.includes("weak-password")) return "비밀번호는 6자 이상이어야 합니다.";
  if (code.includes("user-not-found") || code.includes("wrong-password") || code.includes("invalid-credential")) return "이메일 또는 비밀번호가 일치하지 않습니다.";
  if (code.includes("too-many-requests")) return "잠시 후 다시 시도해 주세요.";
  return "처리 중 오류가 발생했습니다. (" + code + ")";
}

/* ---------- 저장된 아이디 자동입력 ---------- */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem(LS_EMAIL_KEY);
  if (saved) document.getElementById("loginEmail").value = saved;
  const savedView = localStorage.getItem(LS_VIEW_KEY);
  if (savedView) setViewMode(savedView, false);
});

/* ---------- 회원가입 ---------- */
document.getElementById("btnSignup").addEventListener("click", async () => {
  clearMsg();
  const email = document.getElementById("suEmail").value.trim();
  const name = document.getElementById("suName").value.trim();
  const pw = document.getElementById("suPw").value;
  const pw2 = document.getElementById("suPw2").value;

  if (!email || !pw){ showMsg("이메일과 비밀번호를 입력하세요.", "err"); return; }
  if (pw.length < 6){ showMsg("비밀번호는 6자 이상이어야 합니다.", "err"); return; }
  if (pw !== pw2){ showMsg("비밀번호가 일치하지 않습니다.", "err"); return; }

  const btn = document.getElementById("btnSignup");
  btn.disabled = true;
  try{
    await setPersistence(auth, browserLocalPersistence);
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    if (name) await updateProfile(cred.user, { displayName: name });
    localStorage.setItem(LS_EMAIL_KEY, email);
    showMsg("계정이 등록되었습니다. 자동으로 로그인됩니다.", "ok");
  }catch(err){
    showMsg(mapAuthError(err), "err");
  }finally{
    btn.disabled = false;
  }
});

/* ---------- 로그인 ---------- */
document.getElementById("btnLogin").addEventListener("click", async () => {
  clearMsg();
  const email = document.getElementById("loginEmail").value.trim();
  const pw = document.getElementById("loginPw").value;
  const remember = document.getElementById("loginRemember").checked;

  if (!email || !pw){ showMsg("이메일과 비밀번호를 입력하세요.", "err"); return; }

  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  try{
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, pw);
    if (remember){ localStorage.setItem(LS_EMAIL_KEY, email); }
    else { localStorage.removeItem(LS_EMAIL_KEY); }
  }catch(err){
    showMsg(mapAuthError(err), "err");
  }finally{
    btn.disabled = false;
  }
});

/* ---------- 로그아웃 ---------- */
document.getElementById("btnLogout").addEventListener("click", async () => {
  await signOut(auth);
});

/* ---------- 인증 상태 감지 ---------- */
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user){
    authShell.style.display = "none";
    mainArea.style.display = "block";
    navUser.style.display = "flex";
    navEmail.textContent = user.displayName ? (user.displayName + " · " + user.email) : user.email;
    subscribeLinks(user.uid);
  } else {
    authShell.style.display = "flex";
    mainArea.style.display = "none";
    navUser.style.display = "none";
    if (unsubLinks){ unsubLinks(); unsubLinks = null; }
    allLinks = [];
    renderLinks();
  }
});

/* ---------- Firestore 구독 ---------- */
function subscribeLinks(uid){
  if (unsubLinks) unsubLinks();
  const q = query(
    collection(db, "worklinks"),
    where("uid", "==", uid),
    orderBy("createdAt", "desc")
  );
  unsubLinks = onSnapshot(q, (snap) => {
    allLinks = [];
    snap.forEach(d => allLinks.push({ id: d.id, ...d.data() }));
    refreshCatFilter();
    renderLinks();
  }, (err) => {
    console.error(err);
  });
}

/* ---------- 분류 필터 옵션 ---------- */
function refreshCatFilter(){
  const sel = document.getElementById("catFilter");
  const dl = document.getElementById("catList");
  const current = sel.value;
  const cats = [...new Set(allLinks.map(l => (l.category || "").trim()).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">전체 분류</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  sel.value = cats.includes(current) ? current : "";
  dl.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}"></option>`).join("");
}

/* ---------- 렌더링 ---------- */
function renderLinks(){
  const grid = document.getElementById("linkGrid");
  const empty = document.getElementById("emptyMsg");
  const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
  const catTerm = document.getElementById("catFilter").value;

  let list = allLinks.filter(l => {
    const matchSearch = !searchTerm ||
      (l.title || "").toLowerCase().includes(searchTerm) ||
      (l.url || "").toLowerCase().includes(searchTerm);
    const matchCat = !catTerm || (l.category || "") === catTerm;
    return matchSearch && matchCat;
  });

  document.getElementById("countInfo").textContent = list.length + "개 링크";

  if (list.length === 0){
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = list.map(l => `
    <div class="lcard" data-id="${l.id}">
      <div class="lcard-top">
        <div class="lcard-title">${escapeHtml(l.title || "(제목 없음)")}</div>
        ${l.category ? `<div class="lcard-cat">${escapeHtml(l.category)}</div>` : ""}
      </div>
      <div class="lcard-url">${escapeHtml(l.url || "")}</div>
      ${l.memo ? `<div class="lcard-memo">${escapeHtml(l.memo)}</div>` : ""}
      <div class="lcard-btns">
        <button class="lbtn open" data-act="open" data-url="${escapeAttr(l.url || "")}">열기</button>
        <button class="lbtn copy" data-act="copy" data-url="${escapeAttr(l.url || "")}">복사</button>
        <button class="lbtn" data-act="edit" data-id="${l.id}">수정</button>
        <button class="lbtn del" data-act="del" data-id="${l.id}">삭제</button>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- 검색/필터 이벤트 ---------- */
document.getElementById("searchInput").addEventListener("input", renderLinks);
document.getElementById("catFilter").addEventListener("change", renderLinks);

/* ---------- 카드 버튼 클릭(위임) ---------- */
document.getElementById("linkGrid").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === "open"){
    const url = btn.dataset.url;
    if (url) window.open(normalizeUrl(url), "_blank", "noopener");
  }
  if (act === "copy"){
    const url = btn.dataset.url;
    try{
      await navigator.clipboard.writeText(url);
      const original = btn.textContent;
      btn.textContent = "복사됨";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1200);
    }catch(err){
      alert("복사에 실패했습니다. 브라우저 권한을 확인해 주세요.");
    }
  }
  if (act === "edit"){
    openLinkModal(allLinks.find(l => l.id === btn.dataset.id));
  }
  if (act === "del"){
    const target = allLinks.find(l => l.id === btn.dataset.id);
    if (target && confirm(`"${target.title}" 링크를 삭제할까요?`)){
      await deleteDoc(doc(db, "worklinks", target.id));
    }
  }
});

function normalizeUrl(u){
  if (!/^https?:\/\//i.test(u)) return "https://" + u;
  return u;
}

/* ---------- 링크 추가/수정 모달 ---------- */
const linkModalBg = document.getElementById("linkModalBg");
document.getElementById("btnAddLink").addEventListener("click", () => openLinkModal(null));
document.getElementById("btnLinkCancel").addEventListener("click", closeLinkModal);
linkModalBg.addEventListener("click", (e) => { if (e.target === linkModalBg) closeLinkModal(); });

function openLinkModal(link){
  document.getElementById("linkModalTitle").textContent = link ? "링크 수정" : "링크 추가";
  document.getElementById("linkId").value = link ? link.id : "";
  document.getElementById("linkTitle").value = link ? (link.title || "") : "";
  document.getElementById("linkUrl").value = link ? (link.url || "") : "";
  document.getElementById("linkCat").value = link ? (link.category || "") : "";
  document.getElementById("linkMemo").value = link ? (link.memo || "") : "";
  linkModalBg.classList.add("show");
}
function closeLinkModal(){ linkModalBg.classList.remove("show"); }

document.getElementById("btnLinkSave").addEventListener("click", async () => {
  if (!currentUser) return;
  const id = document.getElementById("linkId").value;
  const title = document.getElementById("linkTitle").value.trim();
  let url = document.getElementById("linkUrl").value.trim();
  const category = document.getElementById("linkCat").value.trim();
  const memo = document.getElementById("linkMemo").value.trim();

  if (!title || !url){ alert("제목과 URL을 입력하세요."); return; }
  url = normalizeUrl(url);

  const btn = document.getElementById("btnLinkSave");
  btn.disabled = true;
  try{
    if (id){
      await updateDoc(doc(db, "worklinks", id), { title, url, category, memo });
    } else {
      await addDoc(collection(db, "worklinks"), {
        uid: currentUser.uid, title, url, category, memo, createdAt: serverTimestamp()
      });
    }
    closeLinkModal();
  }catch(err){
    alert("저장 중 오류가 발생했습니다.");
    console.error(err);
  }finally{
    btn.disabled = false;
  }
});

/* ---------- PC / 모바일 보기 전환 ---------- */
function setViewMode(mode, persist){
  document.body.classList.toggle("view-pc", mode === "pc");
  document.body.classList.toggle("view-mobile", mode !== "pc");
  document.getElementById("btnViewPc").classList.toggle("active", mode === "pc");
  document.getElementById("btnViewMobile").classList.toggle("active", mode !== "pc");
  if (persist !== false) localStorage.setItem(LS_VIEW_KEY, mode);
}
document.getElementById("btnViewPc").addEventListener("click", () => setViewMode("pc"));
document.getElementById("btnViewMobile").addEventListener("click", () => setViewMode("mobile"));
</script>
