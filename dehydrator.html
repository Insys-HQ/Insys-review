<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탈수기 시뮬레이션 v2.0 | 인시스 AI혁신 R&D센터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1e3a5f;--blue:#2563a8;--sky:#0891b2;--bg:#eef2f7;--card:#fff;--border:#e2e8f0;--text:#1e293b;--sub:#475569;--mute:#94a3b8}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:12px;min-height:100vh}
/* TOP BAR */
.topbar{background:var(--navy);color:#fff;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;position:sticky;top:0;z-index:100}
.topbar b{font-size:12px;font-weight:700}
.fbs{padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700}
.fbs.ok{background:#dcfce7;color:#166534}.fbs.err{background:#fee2e2;color:#dc2626}.fbs.ld{background:#fef3c7;color:#b45309}
/* TABS */
.tabs{display:flex;gap:2px;padding:4px 10px;background:var(--navy)}
.tab{padding:4px 14px;border:none;border-radius:5px 5px 0 0;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:600;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75);transition:.15s}
.tab.on{background:#fff;color:var(--navy)}
/* MAIN LAYOUT */
.wrap{max-width:1100px;margin:0 auto;padding:8px 10px}
.layout{display:grid;grid-template-columns:270px 1fr 220px;gap:8px;align-items:start}
/* CARD */
.card{background:var(--card);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.ch{font-size:11px;font-weight:700;color:var(--navy);padding:5px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px}
.cb{padding:7px 10px}
/* SLIDER ROWS */
.sr{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.sr label{width:105px;flex-shrink:0;font-size:10px;color:var(--sub);font-weight:600;line-height:1.2}
.sr input[type=range]{flex:1;accent-color:var(--blue);height:3px;cursor:pointer}
.sr .sv{width:52px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--navy);text-align:right}
.sr .su{width:22px;font-size:9px;color:var(--mute);flex-shrink:0}
/* BTN */
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:11px;transition:.2s}
.btn-run{background:var(--navy);color:#fff;width:100%;padding:8px}
.btn-run:hover{background:var(--blue)}
.btn-play{background:var(--blue);color:#fff}
.btn-reset{background:#f1f5f9;color:var(--sub);border:1px solid var(--border)}
.btn-del{background:#dc2626;color:#fff}
.btn-sm{padding:4px 10px;font-size:10px;border-radius:5px}
/* STATUS BADGE */
.sbadge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.si{background:#f1f5f9;color:var(--sub)}.sr2{background:#dbeafe;color:#1d4ed8}
.sp{background:#fef3c7;color:#d97706}.sb{background:#fee2e2;color:#dc2626}.sd{background:#dcfce7;color:#16a34a}
/* DRUM */
.drum-area{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.drum{width:86px;height:86px;border:5px solid var(--navy);border-radius:50%;background:#f0f4f8;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.drum-inner{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;font-weight:700;text-align:center;line-height:1.3}
.drum.sp2{animation:spin var(--spd,.5s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* GAUGE BAR */
.gb-wrap{flex:1}
.gb-row{margin-bottom:4px}
.gb-row label{font-size:9px;color:var(--mute);font-weight:600;display:block;margin-bottom:1px}
.gb{height:16px;background:#e2e8f0;border-radius:8px;overflow:hidden}
.gbf{height:100%;border-radius:8px;transition:width .25s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.gbf span{color:#fff;font-size:9px;font-weight:700;white-space:nowrap}
.g-rpm{background:linear-gradient(90deg,var(--blue),var(--navy))}
.g-time{background:linear-gradient(90deg,var(--sky),#0e7490)}
.g-water{background:linear-gradient(90deg,#16a34a,#15803d)}
/* RESULT ITEMS */
.ri-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ri{background:#f8fafc;border-radius:6px;padding:5px 7px;border-left:2px solid var(--blue)}
.ri .rl{font-size:9px;color:var(--mute);font-weight:600;margin-bottom:1px}
.ri .rv{font-size:15px;font-weight:800;color:var(--navy);line-height:1}
.ri .ru{font-size:9px;color:var(--mute)}
/* TIMELINE */
.tl-item{display:flex;align-items:flex-start;gap:5px;padding:3px 0;border-bottom:1px solid #f8fafc}
.tl-item:last-child{border:none}
.tl-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.td-a{background:#dbeafe;color:#1d4ed8}.td-p{background:#fef3c7;color:#d97706}.td-b{background:#fee2e2;color:#dc2626}
.tl-body{flex:1}
.tl-t{font-size:11px;font-weight:600;color:var(--text)}
.tl-d{font-size:9.5px;color:var(--sub);margin-top:1px}
.tl-sec{font-size:10px;font-weight:700;color:var(--blue);white-space:nowrap}
/* WATER */
.water-bar-wrap{position:relative;height:120px;width:52px;border:2px solid var(--border);border-radius:6px;overflow:hidden;background:#f0f9ff;flex-shrink:0}
.water-bar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#38bdf8,#0369a1);transition:height .8s ease;border-radius:0 0 4px 4px}
.water-bar-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap}
.water-info{flex:1}
.water-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #f0f4f8;font-size:10px}
.water-row:last-child{border:none}
.water-row .wk{color:var(--sub);font-weight:600}
.water-row .wv{font-weight:800;color:var(--navy)}
/* CHART */
canvas{display:block;width:100%}
/* PROD */
.p4{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.pi{background:#f8fafc;border-radius:6px;padding:6px 8px;text-align:center}
.pi .pv{font-size:18px;font-weight:800;color:var(--navy)}
.pi .pl{font-size:9px;color:var(--mute);font-weight:600;margin-top:1px}
/* ALERT */
.alert{padding:7px 10px;border-radius:6px;font-size:11px;margin-top:6px}
.alert.ok{background:#dcfce7;color:#166534}.alert.ng{background:#fee2e2;color:#991b1b}
/* HISTORY */
.hi{display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid #f8fafc;font-size:10px}
.hi:last-child{border:none}
.hi .ht{color:var(--mute);width:70px;flex-shrink:0}
.hi .hb{font-size:9px;padding:1px 6px;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:700;white-space:nowrap}
/* PANEL */
.panel{display:none}.panel.on{display:block}
/* FULL WIDTH */
.full{grid-column:1/-1}
/* CHART CARD */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>

  <div style="display:flex;align-items:center;gap:8px">

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const cfg = {
  apiKey:"AIzaSyDummy_replace_with_real",
  databaseURL:"https://insys-gantt-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"insys-gantt"
};
let db=null, hRef=null;
try {
  const app = initializeApp(cfg);
  db = getDatabase(app);
  hRef = ref(db,'dehydrator_sim');
  document.getElementById('fbStatus').textContent='Firebase 연결됨';
  document.getElementById('fbStatus').className='fbs ok';
  loadHist();
} catch(e) {
  document.getElementById('fbStatus').textContent='로컬 저장';
  document.getElementById('fbStatus').className='fbs err';
  renderHist(JSON.parse(localStorage.getItem('dh_hist')||'[]'));
}
function loadHist(){
  if(!hRef)return;
  onValue(hRef,s=>{
    const d=s.val();
    const arr=d?Object.entries(d).reverse().slice(0,40).map(([k,v])=>({id:k,...v})):[];
    renderHist(arr);
  },()=>renderHist(JSON.parse(localStorage.getItem('dh_hist')||'[]')));
}
function renderHist(list){
  const el=document.getElementById('histList');
  if(!list||!list.length){el.innerHTML='<span style="color:var(--mute)">기록 없음</span>';return;}
  el.innerHTML=list.map(d=>`<div class="hi"><span class="ht">${d.dt||''}</span><span style="flex:1;color:var(--text)">${d.batch}장/회 · ${d.rpm}RPM · 사이클${d.cyc}s · <b>${d.ph}장/h</b> · 탈수${d.wr}%</span><span class="hb">${d.ok?'✅달성':'❌미달'}</span></div>`).join('');
}
window._fbSave=async function(d){
  if(hRef){try{await push(hRef,d);}catch(e){_local(d);}return;}
  _local(d);
};
function _local(d){
  const a=JSON.parse(localStorage.getItem('dh_hist')||'[]');
  a.unshift({...d,id:Date.now()});
  localStorage.setItem('dh_hist',JSON.stringify(a.slice(0,50)));
  renderHist(a.slice(0,40));
}
window._fbClear=async function(){
  if(hRef){try{await set(hRef,null);}catch(e){}}
  localStorage.removeItem('dh_hist');
  document.getElementById('histList').innerHTML='<span style="color:var(--mute)">기록 없음</span>';
};
</script>

<script>
// ===== SLIDER DEFINITIONS =====
const SLIDERS_MECH = [
  {id:'maxRpm', label:'최고 RPM', min:300, max:2000, val:800, step:50, unit:'RPM'},
  {id:'drumDia', label:'드럼 직경', min:600, max:2000, val:1000, step:50, unit:'mm'},
  {id:'batchSize', label:'1회 투입', min:1, max:60, val:10, step:1, unit:'장'},
  {id:'accelTime', label:'가속 시간', min:5, max:120, val:25, step:1, unit:'s'},
  {id:'peakTime', label:'최고속 유지', min:10, max:300, val:45, step:5, unit:'s'},
  {id:'brakeTime', label:'감속 시간', min:5, max:120, val:20, step:1, unit:'s'},
  {id:'loadTime', label:'투입/인출', min:10, max:120, val:30, step:1, unit:'s'},
  {id:'padWeight', label:'패드 무게', min:100, max:600, val:180, step:10, unit:'g'},
];
const SLIDERS_WATER = [
  {id:'initMoist', label:'초기 수분율', min:20, max:95, val:65, step:1, unit:'%'},
  {id:'padThick', label:'패드 두께', min:2, max:10, val:3, step:0.5, unit:'mm'},
  {id:'corrDepth', label:'골 깊이', min:0.5, max:4, val:1.5, step:0.1, unit:'mm'},
  {id:'fiberDens', label:'섬유 밀도', min:100, max:600, val:280, step:10, unit:'g/m²'},
];

function mkSliders(arr, targetId){
  const wrap = document.getElementById(targetId);
  wrap.innerHTML = arr.map(s=>`
    <div class="sr">
      <label>${s.label}</label>
      <input type="range" id="${s.id}" min="${s.min}" max="${s.max}" value="${s.val}" step="${s.step}"
        oninput="document.getElementById('${s.id}_v').textContent=this.value;autoCalc()">
      <span class="sv" id="${s.id}_v">${s.val}</span>
      <span class="su">${s.unit}</span>
    </div>
  `).join('');
}
mkSliders(SLIDERS_MECH, 'sliders-mech');
mkSliders(SLIDERS_WATER, 'sliders-water');

function gv(id){ return parseFloat(document.getElementById(id).value)||0; }

// ===== PHYSICS: 탈수율 계산 =====
// 골판지형 패드 탈수율 = G-force, 회전시간, 초기수분, 섬유구조 기반 경험식
function calcDehydration(maxRpm, drumDia, peakSec, initMoist, padThick, corrDepth, fiberDens){
  const r = drumDia/2/1000;
  const omega = maxRpm*2*Math.PI/60;
  const G = omega*omega*r/9.81;
  // 골판지 내부 수분 이탈 모델
  // 유효 G-factor: 골 채널이 원심 통로 역할 → 보정계수
  const corrFactor = Math.min(1.4, 1 + corrDepth/padThick*0.5);
  const effectiveG = G * corrFactor;
  // 섬유 밀도 저항: 고밀도일수록 탈수 어려움
  const densRes = Math.max(0.5, 1 - (fiberDens-200)/600);
  // 탈수율 경험식: Suter 모델 기반 단순화
  // Sw = S_inf * (1 - exp(-k * G^n * t))
  const S_inf = Math.min(92, initMoist * 0.95); // 최대 탈수 가능률
  const k = 0.008 * densRes;
  const n = 0.65;
  const Sw = S_inf * (1 - Math.exp(-k * Math.pow(effectiveG, n) * peakSec));
  // 잔류 수분율
  const finalMoist = Math.max(2, initMoist - Sw * initMoist/100);
  return {
    G: G.toFixed(1),
    effectiveG: effectiveG.toFixed(1),
    corrFactor: corrFactor.toFixed(2),
    Sw: Math.min(95, Sw).toFixed(1),         // 탈수율(%)
    initMoist: initMoist.toFixed(1),
    finalMoist: finalMoist.toFixed(1),
    removedWater: (initMoist - finalMoist).toFixed(1),
    tipSpeed: (omega * r).toFixed(1),
  };
}

let simData = null, animFrame = null, animStart = null;

function autoCalc(){ /* 슬라이더 변경 시 결과도 자동 갱신 */ if(simData) runSim(true); }

function runSim(silent=false){
  const maxRpm=gv('maxRpm'), drumDia=gv('drumDia'), batch=gv('batchSize');
  const accel=gv('accelTime'), peak=gv('peakTime'), brake=gv('brakeTime'), load=gv('loadTime');
  const padWt=gv('padWeight'), initMoist=gv('initMoist');
  const padThick=gv('padThick'), corrDepth=gv('corrDepth'), fiberDens=gv('fiberDens');

  const cyc = accel+peak+brake+load;
  const r = drumDia/2/1000;
  const omega = maxRpm*2*Math.PI/60;
  const G = omega*omega*r/9.81;
  const tipSpeed = omega*r;
  const batchWt = batch*padWt;
  const perHour = Math.floor(3600/cyc*batch);
  const per8h = perHour*8;
  const achievable = per8h>=2000;
  const dw = calcDehydration(maxRpm, drumDia, peak, initMoist, padThick, corrDepth, fiberDens);

  simData = {maxRpm,drumDia,batch,accel,peak,brake,load,padWt,cyc,batchWt,perHour,per8h,achievable,G,tipSpeed,dw};

  // 사이클 결과
  document.getElementById('cycleResult').innerHTML=[
    {l:'사이클 시간', v:cyc, u:'초'},
    {l:'1회 투입', v:batch, u:'장'},
    {l:'시간당 처리', v:perHour.toLocaleString(), u:'장/h'},
    {l:'8h 처리량', v:per8h.toLocaleString(), u:'장'},
    {l:'원심가속도', v:G.toFixed(1), u:'G'},
    {l:'팁 속도', v:tipSpeed.toFixed(1), u:'m/s'},
    {l:'적재 무게', v:batchWt.toLocaleString(), u:'g'},
    {l:'목표 달성', v:achievable?'✅':'❌', u:achievable?'달성':'미달'},
  ].map(i=>`<div class="ri"><div class="rl">${i.l}</div><div class="rv">${i.v}<span class="ru"> ${i.u}</span></div></div>`).join('');

  // 탈수 결과
  const wPct = parseFloat(dw.Sw);
  document.getElementById('waterBarFill').style.height = wPct+'%';
  document.getElementById('waterBarLbl').textContent = wPct+'%';
  document.getElementById('waterInfo').innerHTML=[
    {k:'초기 수분율', v:dw.initMoist+'%'},
    {k:'최종 수분율', v:dw.finalMoist+'%'},
    {k:'제거 수분', v:dw.removedWater+'%p'},
    {k:'탈수율', v:'<b style="color:#15803d">'+dw.Sw+'%</b>'},
    {k:'유효 G', v:dw.effectiveG+'G'},
    {k:'골 보정', v:'×'+dw.corrFactor},
  ].map(r=>`<div class="water-row"><span class="wk">${r.k}</span><span class="wv">${r.v}</span></div>`).join('');
  document.getElementById('waterNote').textContent=
    `※ 골판지 채널 원심 통로 효과(×${dw.corrFactor}) 적용 | G${dw.effectiveG} 기준 Suter 모델 | 실측값과 ±5~10%p 차이 가능`;

  // 타임라인
  const hl=load/2;
  const phases=[
    {dot:'td-a',t:`📥 패드 ${batch}장 투입`,d:`적재 무게 ${batchWt.toLocaleString()}g · 초기 수분 ${initMoist}%`,s:hl},
    {dot:'td-a',t:`⬆️ 가속`,d:`0 → ${maxRpm} RPM · G ${G.toFixed(1)} · 팁속 ${tipSpeed.toFixed(1)}m/s`,s:accel},
    {dot:'td-p',t:`💫 최고속 유지`,d:`${maxRpm} RPM · 탈수 ${dw.Sw}% 달성 · 유효G ${dw.effectiveG}`,s:peak},
    {dot:'td-b',t:`⛔ 감속·정지`,d:`${maxRpm} → 0 RPM · 브레이크 작동`,s:brake},
    {dot:'td-a',t:`📤 패드 인출`,d:`최종 수분 ${dw.finalMoist}% · 제거량 ${dw.removedWater}%p`,s:hl},
  ];
  document.getElementById('timeline').innerHTML=phases.map((p,i)=>`
    <div class="tl-item">
      <div class="tl-dot ${p.dot}">${i+1}</div>
      <div class="tl-body"><div class="tl-t">${p.t}</div><div class="tl-d">${p.d}</div></div>
      <div class="tl-sec">${p.s}s</div>
    </div>`).join('');

  renderChart();
  renderProd();
  resetAnim();

  if(!silent){
    const now=new Date();
    const dt=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    if(window._fbSave) window._fbSave({dt,rpm:maxRpm,batch,cyc,ph:perHour,per8h,ok:achievable,wr:dw.Sw,initM:initMoist,finM:dw.finalMoist});
  }
}

// ===== CHARTS =====
function renderChart(){
  if(!simData) return;
  const {maxRpm,accel,peak,brake,load,cyc,dw} = simData;
  const c = document.getElementById('rpmChart');
  c.width = c.parentElement.offsetWidth||600;
  const W=c.width, H=130;
  c.height=H;
  const ctx=c.getContext('2d');
  const pad={t:14,r:12,b:22,l:38};
  const iW=W-pad.l-pad.r, iH=H-pad.t-pad.b;
  const hl=load/2;

  const tx=t=>pad.l+(t/cyc)*iW;
  const tRpm=r=>pad.t+iH-(r/maxRpm)*iH;
  const tWater=w=>pad.t+iH-(w/100)*iH;

  ctx.clearRect(0,0,W,H);

  // 배경 영역
  const bg=[[0,hl,'#f0f9ff'],[hl,hl+accel,'#dbeafe'],[hl+accel,hl+accel+peak,'#fef3c7'],[hl+accel+peak,hl+accel+peak+brake,'#fee2e2'],[hl+accel+peak+brake,cyc,'#f0f9ff']];
  bg.forEach(([s,e,col])=>{ctx.fillStyle=col;ctx.fillRect(tx(s),pad.t,tx(e)-tx(s),iH);});

  // 그리드
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.6;
  [0,.25,.5,.75,1].forEach(f=>{
    const y=tRpm(maxRpm*f);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='9px Noto Sans KR';ctx.textAlign='right';
    ctx.fillText(Math.round(maxRpm*f),pad.l-3,y+3);
  });

  // RPM 곡선 (파랑)
  const rpmPts=[[0,0],[hl,0],[hl+accel,maxRpm],[hl+accel+peak,maxRpm],[hl+accel+peak+brake,0],[cyc,0]];
  ctx.beginPath();ctx.strokeStyle='#2563a8';ctx.lineWidth=2;
  rpmPts.forEach(([t,r],i)=>i===0?ctx.moveTo(tx(t),tRpm(r)):ctx.lineTo(tx(t),tRpm(r)));
  ctx.stroke();

  // 탈수율 곡선 (초록)
  // 탈수는 가속시작 후 G-force에 비례하여 누적
  const Sw=parseFloat(dw.Sw);
  const waterPts=[];
  const steps=60;
  for(let i=0;i<=steps;i++){
    const t=cyc*i/steps;
    let w=0;
    if(t>=hl && t<=hl+accel){
      // 가속: rpm비례 G 증가, 탈수 시작
      const frac=(t-hl)/accel;
      const gNow=parseFloat(dw.G)*frac*frac;
      w=Sw*0.15*frac*frac;
    } else if(t>hl+accel && t<=hl+accel+peak){
      const frac=(t-hl-accel)/peak;
      w=Sw*(0.15+0.82*frac);
    } else if(t>hl+accel+peak){
      w=Sw;
    }
    waterPts.push([t,Math.min(w,Sw)]);
  }
  ctx.beginPath();ctx.strokeStyle='#16a34a';ctx.lineWidth=1.8;ctx.setLineDash([4,3]);
  waterPts.forEach(([t,w],i)=>i===0?ctx.moveTo(tx(t),tWater(w)):ctx.lineTo(tx(t),tWater(w)));
  ctx.stroke();ctx.setLineDash([]);

  // 범례
  ctx.fillStyle='#2563a8';ctx.fillRect(pad.l,2,14,5);
  ctx.fillStyle='#334155';ctx.font='9px Noto Sans KR';ctx.textAlign='left';ctx.fillText('RPM',pad.l+17,8);
  ctx.strokeStyle='#16a34a';ctx.setLineDash([4,3]);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(pad.l+60,4);ctx.lineTo(pad.l+74,4);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#166534';ctx.fillText('탈수율',pad.l+77,8);

  // X 레이블
  ctx.fillStyle='#64748b';ctx.font='9px Noto Sans KR';ctx.textAlign='center';
  [['투입',0,hl],['가속',hl,hl+accel],['최고속',hl+accel,hl+accel+peak],['감속',hl+accel+peak,hl+accel+peak+brake],['인출',hl+accel+peak+brake,cyc]]
    .forEach(([l,s,e])=>ctx.fillText(l,tx((s+e)/2),H-3));

  // Y축 우측 탈수율 스케일
  ctx.fillStyle='#16a34a';ctx.font='9px Noto Sans KR';ctx.textAlign='left';
  [0,50,100].forEach(w=>ctx.fillText(w+'%',W-pad.r+1,tWater(w)+3));
}

function renderProd(){
  if(!simData) return;
  const {batch,cyc,perHour,per8h,achievable,G} = simData;
  const cph=Math.floor(3600/cyc);
  const deficit=Math.max(0,2000-per8h);
  const need=deficit>0?Math.ceil(2000*cyc/3600/8):batch;
  document.getElementById('prodGrid').innerHTML=[
    {l:'8h 처리량',v:per8h.toLocaleString(),u:'장'},
    {l:'시간당',v:perHour.toLocaleString(),u:'장/h'},
    {l:'사이클/h',v:cph,u:'회'},
    {l:'총사이클',v:(cph*8),u:'회/8h'},
  ].map(i=>`<div class="pi"><div class="pv">${i.v}</div><div class="pl">${i.l} (${i.u})</div></div>`).join('');

  document.getElementById('prodAlert').innerHTML=
    `<div class="alert ${achievable?'ok':'ng'}">${achievable
      ?`✅ 목표달성 — 2,000장 대비 <b>${(per8h-2000).toLocaleString()}장</b> 초과`
      :`❌ ${deficit.toLocaleString()}장 부족 — 1회 투입 <b>${need}장</b> 이상 필요`}</div>`;

  document.getElementById('prodNote').textContent=
    `계산: 8h × ${cph}사이클 × ${batch}장 | G-force ${G.toFixed(1)}G | 휴식 10% 감안 실생산 ≈ ${Math.floor(per8h*.9).toLocaleString()}장/일`;

  // 시간별 누적 차트
  const pc=document.getElementById('prodChart');
  pc.width=pc.parentElement.offsetWidth||300; pc.height=160;
  const ctx=pc.getContext('2d');
  const W=pc.width,H=160,pad={t:16,r:12,b:24,l:42};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const hrs=8;
  const data=Array.from({length:hrs},(_,i)=>perHour*(i+1));
  ctx.clearRect(0,0,W,H);
  const maxV=Math.max(data[hrs-1],2000)*1.15;
  const tx2=i=>pad.l+i*(iW/(hrs-1));
  const ty2=v=>pad.t+iH-(v/maxV)*iH;
  // 목표선
  ctx.strokeStyle='#dc2626';ctx.lineWidth=1;ctx.setLineDash([5,3]);
  ctx.beginPath();ctx.moveTo(pad.l,ty2(2000));ctx.lineTo(W-pad.r,ty2(2000));ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#dc2626';ctx.font='9px Noto Sans KR';ctx.textAlign='left';ctx.fillText('목표 2000',pad.l+2,ty2(2000)-2);
  // 막대
  const bw=iW/hrs*0.6;
  data.forEach((v,i)=>{
    const x=pad.l+i*(iW/hrs)+(iW/hrs-bw)/2;
    const h2=iH*(v/maxV);
    ctx.fillStyle=v>=2000?'#16a34a':'#2563a8';
    ctx.fillRect(x,pad.t+iH-h2,bw,h2);
    ctx.fillStyle='#334155';ctx.font='9px Noto Sans KR';ctx.textAlign='center';
    ctx.fillText((i+1)+'h',x+bw/2,H-5);
    if(i===hrs-1||i===3){
      ctx.fillStyle=v>=2000?'#166534':'#1d4ed8';
      ctx.fillText(v.toLocaleString(),x+bw/2,pad.t+iH-h2-3);
    }
  });
  // Y그리드
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=0.5;
  [0,.25,.5,.75,1].forEach(f=>{
    const y=ty2(maxV*f);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='8px Noto Sans KR';ctx.textAlign='right';
    ctx.fillText(Math.round(maxV*f),pad.l-3,y+3);
  });
}

// ===== ANIMATION =====
function playAnim(){
  if(!simData){alert('먼저 시뮬레이션을 실행하세요.');return;}
  resetAnim();
  document.getElementById('playBtn').disabled=true;
  const {maxRpm,accel,peak,brake,load,cyc,dw} = simData;
  const hl=load/2, Sw=parseFloat(dw.Sw);
  animStart=null;
  const playSpeed=15; // 15배속
  function frame(ts){
    if(!animStart) animStart=ts;
    const t=Math.min((ts-animStart)/1000*(cyc/playSpeed),cyc);
    let rpm=0,phase='';
    if(t<hl){rpm=0;phase='투입';}
    else if(t<hl+accel){rpm=maxRpm*(t-hl)/accel;phase='가속';}
    else if(t<hl+accel+peak){rpm=maxRpm;phase='최고속';}
    else if(t<hl+accel+peak+brake){rpm=maxRpm*(1-(t-hl-accel-peak)/brake);phase='감속';}
    else{rpm=0;phase='인출';}
    // 탈수율 애니
    let water=0;
    if(t>=hl&&t<=hl+accel){const f=(t-hl)/accel;water=Sw*0.15*f*f;}
    else if(t>hl+accel&&t<=hl+accel+peak){const f=(t-hl-accel)/peak;water=Sw*(0.15+0.82*f);}
    else if(t>hl+accel+peak){water=Sw;}
    water=Math.min(water,Sw);
    const rp=(rpm/maxRpm)*100, tp=(t/cyc)*100, wp=(water/100)*100;
    document.getElementById('rpmGauge').style.width=rp+'%';
    document.getElementById('rpmVal').textContent=Math.round(rpm)+'RPM';
    document.getElementById('timeGauge').style.width=tp+'%';
    document.getElementById('timeVal').textContent=t.toFixed(1)+'s';
    document.getElementById('waterGauge').style.width=water+'%';
    document.getElementById('waterVal').textContent=water.toFixed(1)+'%';
    // 드럼
    const drum=document.getElementById('drumEl');
    if(rpm>10){drum.style.setProperty('--spd',Math.max(.04,.8-(rpm/maxRpm)*.76)+'s');drum.classList.add('sp2');}
    else drum.classList.remove('sp2');
    document.getElementById('drumLbl').textContent=phase+'\n'+Math.round(rpm)+'\nRPM';
    // 배지
    const bm={'투입':'si','가속':'sr2','최고속':'sp','감속':'sb','인출':'si'};
    const sb=document.getElementById('statusBadge');
    sb.className='sbadge '+(bm[phase]||'si');sb.textContent=phase;
    if(t<cyc) animFrame=requestAnimationFrame(frame);
    else{
      drum.classList.remove('sp2');
      sb.className='sbadge sd';sb.textContent='완료';
      document.getElementById('playBtn').disabled=false;
    }
  }
  animFrame=requestAnimationFrame(frame);
}

function resetAnim(){
  if(animFrame) cancelAnimationFrame(animFrame);
  ['rpmGauge','timeGauge','waterGauge'].forEach(id=>{document.getElementById(id).style.width='0%';});
  document.getElementById('rpmVal').textContent='0RPM';
  document.getElementById('timeVal').textContent='0s';
  document.getElementById('waterVal').textContent='0%';
  document.getElementById('drumEl').classList.remove('sp2');
  document.getElementById('drumLbl').textContent='대기\n0\nRPM';
  document.getElementById('statusBadge').className='sbadge si';
  document.getElementById('statusBadge').textContent='대기';
  if(document.getElementById('playBtn')) document.getElementById('playBtn').disabled=false;
}

function showTab(name,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
  el.classList.add('on');
}

function clearHist(){
  if(!confirm('전체 기록 삭제?')) return;
  if(window._fbClear) window._fbClear();
}

window.addEventListener('resize',()=>{if(simData){renderChart();renderProd();}});
// 최초 실행
setTimeout(()=>runSim(true),300);
</script>
