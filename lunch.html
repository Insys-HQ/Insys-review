<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>인시스 점심주문관리 v2.2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #1A3A5C;
  --orange: #E85D26;
  --bg:     #F2F0EB;
  --card:   #FFFFFF;
  --border: #DDD8CF;
  --text:   #1A1A1A;
  --muted:  #505050;
  --green:  #2D7A4F;
  --red:    #B03020;
  --teal:   #0D6B70;
  --tagbg:  #EEF2F7;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; }
.hidden { display:none !important; }

/* ── 헤더 ─────────────────────────────────────────── */
header {
  background:var(--navy); color:#fff;
  padding:10px 16px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:200; gap:8px; flex-wrap:wrap;
}
.hd-left h1 { font-size:16px; font-weight:700; }
.hd-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
#weatherInfo { font-size:13px; color:#fff; opacity:.9; display:flex; align-items:center; gap:4px; }
.w-temp { font-size:15px; font-weight:700; }
.w-desc { font-size:12px; opacity:.8; }
#clock { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:1px; }
#userBadge {
  background:rgba(255,255,255,.15); color:#fff;
  border:1px solid rgba(255,255,255,.25); border-radius:14px;
  padding:4px 12px; font-size:13px; cursor:pointer;
}
#userBadge:hover { background:rgba(255,255,255,.25); }
.ver-badge { font-size:10px; opacity:.45; }

/* ── 배너 ─────────────────────────────────────────── */
#noticeBanner { background:var(--orange); color:#fff; padding:12px 16px; display:none; }
#noticeBanner.show { display:block; }
#noticeBanner strong { font-size:15px; }
#noticeBanner p { font-size:13px; opacity:.9; margin-top:3px; }

/* ── 메인 ─────────────────────────────────────────── */
main { max-width:660px; margin:0 auto; padding:14px 13px 100px; transition:max-width .3s; }
main.wide { max-width:1100px; }
main.narrow { max-width:420px; }

/* ── 로그인 ───────────────────────────────────────── */
#loginScreen { min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
.login-card {
  background:var(--card); border-radius:16px; padding:34px 28px;
  width:100%; max-width:340px; text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.09);
}
.login-card h2 { font-size:21px; font-weight:700; color:var(--navy); margin-bottom:6px; }
.login-card p  { font-size:13px; color:var(--muted); margin-bottom:22px; line-height:1.7; }
.login-card select {
  width:100%; padding:12px 13px; border:1.5px solid var(--border);
  border-radius:8px; font-size:15px; font-family:inherit;
  background:#fff; color:var(--text); outline:none; margin-bottom:12px;
}
.btn-primary {
  width:100%; background:var(--orange); color:#fff; border:none;
  border-radius:9px; padding:13px; font-size:15px; font-weight:700;
  font-family:inherit; cursor:pointer;
}
.btn-primary:hover { background:#c94d1c; }

/* ── 상태/통계 ────────────────────────────────────── */
.top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.status-badge { border-radius:14px; padding:5px 13px; font-size:13px; font-weight:700; }
.status-badge.open   { background:#e6f4ed; color:#1f6b3f; }
.status-badge.closed { background:#fde8e6; color:var(--red); }
.status-badge.done   { background:#e3eeff; color:var(--navy); }
.stats-row { display:flex; gap:8px; margin-bottom:14px; }
.stat-card { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 8px; text-align:center; }
.stat-num { font-size:22px; font-weight:700; color:var(--navy); }
.stat-lbl { font-size:11px; color:var(--muted); margin-top:2px; }

/* ── 탭 ──────────────────────────────────────────── */
.tabs { display:flex; gap:5px; margin-bottom:13px; flex-wrap:wrap; }
.tab-btn {
  flex:1; min-width:calc(33% - 4px); padding:9px 4px; border-radius:8px;
  font-size:12px; font-weight:700; cursor:pointer;
  border:1.5px solid var(--border); background:var(--bg); color:var(--muted);
  font-family:inherit; transition:all .15s;
}
.tab-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }

/* ── 카드 ─────────────────────────────────────────── */
.card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:15px; margin-bottom:12px; }
.card-title { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; margin-bottom:10px; }

/* ── 식당 버튼 ────────────────────────────────────── */
#restaurantGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; }
.rest-btn {
  background:var(--tagbg); border:1.5px solid var(--border); border-radius:7px;
  padding:8px 6px; font-size:13px; cursor:pointer; text-align:left;
  font-family:inherit; color:var(--text); transition:all .15s; position:relative;
}
.rest-btn:hover,.rest-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
.rest-cnt { position:absolute; top:3px; right:3px; background:var(--orange); color:#fff; border-radius:7px; font-size:10px; padding:1px 4px; }
.rest-btn.active .rest-cnt { background:rgba(255,255,255,.9); color:var(--navy); }

/* ── 메뉴 태그 ────────────────────────────────────── */
#menuTags { display:flex; flex-wrap:wrap; gap:6px; min-height:30px; margin-bottom:10px; }
.menu-tag {
  background:var(--tagbg); border:1.5px solid var(--border); border-radius:16px;
  padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit;
  color:var(--text); transition:all .15s;
}
.menu-tag:hover,.menu-tag.active { background:var(--orange); color:#fff; border-color:var(--orange); }
.tag-cnt { background:rgba(0,0,0,.1); border-radius:7px; font-size:10px; padding:1px 4px; margin-left:3px; }
.tag-hint { font-size:13px; color:var(--muted); align-self:center; }

/* ── 추천 ─────────────────────────────────────────── */
#recommendList { display:flex; flex-wrap:wrap; gap:7px; }
.rec-btn {
  display:flex; flex-direction:column; background:var(--tagbg); border:1.5px solid var(--border);
  border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer;
  font-family:inherit; color:var(--text); transition:all .15s; min-width:96px;
}
.rec-btn:hover { background:var(--navy); color:#fff; border-color:var(--navy); }
.rec-menu { font-weight:700; font-size:13px; }
.rec-rest { font-size:11px; color:var(--muted); margin-top:2px; }
.rec-cnt  { font-size:11px; color:var(--orange); margin-top:2px; }
.rec-btn:hover .rec-rest,.rec-btn:hover .rec-cnt { color:rgba(255,255,255,.75); }

/* ── 폼 ──────────────────────────────────────────── */
.form-row { margin-bottom:11px; }
.form-row label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; }
.form-row input,.form-row select,.form-row textarea {
  width:100%; border:1.5px solid var(--border); border-radius:8px;
  padding:11px 13px; font-size:15px; font-family:inherit;
  background:var(--bg); color:var(--text); outline:none; transition:border-color .15s;
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus { border-color:var(--navy); background:#fff; }
.form-row textarea { resize:none; }
.qty-row { display:flex; align-items:center; gap:12px; }
.qty-btn {
  width:34px; height:34px; border:1.5px solid var(--border); border-radius:7px;
  background:var(--bg); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.qty-btn:hover { background:var(--border); }
#qtyDisplay { font-size:17px; font-weight:700; min-width:22px; text-align:center; }

/* ── 주문 목록 ────────────────────────────────────── */
#orderList { list-style:none; }
.empty-item { padding:26px; text-align:center; color:var(--muted); font-size:14px; }
.order-group { background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.group-header { background:var(--navy); color:#fff; padding:9px 14px; display:flex; justify-content:space-between; align-items:center; }
.group-rest { font-size:15px; font-weight:700; }
.group-cnt  { font-size:12px; opacity:.7; }
.order-row { display:flex; align-items:center; gap:9px; padding:10px 14px; border-top:1px solid var(--border); }
.order-row.mine { background:#f0f6ff; }
.order-seq { width:22px; height:22px; background:var(--tagbg); border-radius:50%; font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.order-body { flex:1; }
.order-name { font-size:14px; font-weight:700; }
.order-menu { font-size:14px; color:var(--teal); margin-left:6px; }
.order-note { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
.order-time { font-size:12px; color:var(--muted); flex-shrink:0; }
.del-btn { background:none; border:none; color:#bbb; font-size:17px; cursor:pointer; padding:0 3px; flex-shrink:0; }
.del-btn:hover { color:var(--red); }

/* ── 요약 ─────────────────────────────────────────── */
#summaryBox { background:#f0f6ff; border:1.5px solid #b8d0f0; border-radius:12px; padding:16px; margin-bottom:12px; }
#summaryText { font-size:13px; line-height:2.1; white-space:pre-line; color:var(--text); }
.btn-copy {
  width:100%; margin-top:11px; background:var(--navy); color:#fff; border:none;
  border-radius:7px; padding:11px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;
}
.btn-copy:hover { background:#0f2a45; }

/* ── 식당별 완료 버튼 ─────────────────────────────── */
.rest-complete-btn {
  width:100%; padding:13px 16px; border-radius:9px; border:1.5px solid var(--border);
  background:var(--card); font-size:14px; font-weight:700; font-family:inherit;
  color:var(--navy); cursor:pointer; text-align:left; transition:all .15s; margin-bottom:8px;
  display:block;
}
.rest-complete-btn:hover { background:var(--tagbg); border-color:var(--navy); }
.rest-complete-btn.done { background:#e6f4ed; border-color:#2D7A4F; color:#1f6b3f; }

/* ── 컨트롤 버튼 ──────────────────────────────────── */
.ctrl-row { display:flex; gap:8px; margin-top:4px; }
.ctrl-btn { flex:1; border:none; border-radius:9px; padding:13px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
.btn-close    { background:#fde8e6; color:var(--red); }
.btn-reopen   { background:#fff3cd; color:#7a5c00; }
.btn-complete { background:var(--green); color:#fff; }

/* ── 주문 담당자 ─────────────────────────────────── */
.duty-card { background:var(--card); border:1.5px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; }
.duty-filled { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.duty-icon { font-size:24px; }
.duty-name { font-size:16px; font-weight:700; color:var(--navy); }
.duty-label { font-size:13px; color:var(--muted); }
.duty-cancel-btn { background:#fde8e6; color:var(--red); border:none; border-radius:6px; padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; margin-left:auto; }
.duty-empty { text-align:center; padding:6px 0; }
.duty-empty p { font-size:13px; color:var(--muted); margin-bottom:10px; }
.duty-volunteer-btn { background:var(--orange); color:#fff; border:none; border-radius:9px; padding:12px 24px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; }
.duty-volunteer-btn:hover { background:#c94d1c; }

/* ── 이력 ─────────────────────────────────────────── */
.hist-card { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:8px; }
.hist-date { font-size:13px; font-weight:700; margin-bottom:3px; }
.hist-rest { font-size:12px; color:var(--muted); }
.hist-rest-wrap { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.hist-rest-item { font-size:12px; color:var(--muted); background:var(--tagbg); border-radius:6px; padding:3px 8px; }

/* ── 식당 관리 ────────────────────────────────────── */
.admin-rest-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:9px; }
.arc-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.arc-name { font-size:15px; font-weight:700; color:var(--navy); }
.arc-actions { display:flex; gap:6px; }
.arc-info { font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
.arc-edit { margin-top:12px; border-top:1px solid var(--border); padding-top:12px; }
.arc-edit-row { display:flex; gap:8px; margin-top:8px; }
.arc-btn { border:none; border-radius:6px; padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; }
.arc-btn.edit   { background:var(--tagbg); color:var(--navy); }
.arc-btn.del    { background:#fde8e6; color:var(--red); }
.arc-btn.save   { background:var(--green); color:#fff; flex:1; padding:10px; font-size:13px; }
.arc-btn.cancel { background:var(--tagbg); color:var(--muted); flex:1; padding:10px; font-size:13px; }
.add-rest-row { display:flex; gap:8px; margin-bottom:14px; }
.add-rest-row input { flex:1; border:1.5px solid var(--border); border-radius:8px; padding:11px 13px; font-size:15px; font-family:inherit; background:var(--bg); color:var(--text); outline:none; }
.add-rest-row input:focus { border-color:var(--navy); background:#fff; }
.add-rest-row button { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:11px 16px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; white-space:nowrap; }
.add-rest-row button:hover { background:#0f2a45; }

/* ── 플로팅 패널 ──────────────────────────────────── */
#floatPanel { position:fixed; bottom:20px; right:14px; z-index:500; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.float-vm-row { display:flex; gap:4px; background:rgba(26,58,92,.92); border-radius:22px; padding:7px 10px; box-shadow:0 3px 12px rgba(0,0,0,.2); }
.vm-btn { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.22); border-radius:6px; padding:4px 9px; font-size:12px; cursor:pointer; font-family:inherit; transition:all .15s; }
.vm-btn.active,.vm-btn:hover { background:var(--orange); border-color:var(--orange); }
.float-add-btn { background:var(--orange); color:#fff; border:none; border-radius:20px; padding:10px 18px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:0 3px 12px rgba(232,93,38,.4); white-space:nowrap; }
.float-add-btn:hover { background:#c94d1c; }

/* ── 푸터 ─────────────────────────────────────────── */
.footer-info { text-align:center; font-size:11px; color:var(--muted); padding:12px 0; margin-top:8px; border-top:1px solid var(--border); }

/* ── 토스트 ───────────────────────────────────────── */
#toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(14px); background:var(--navy); color:#fff; border-radius:18px; padding:10px 20px; font-size:13px; font-weight:700; opacity:0; transition:all .27s; pointer-events:none; z-index:999; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── 반응형 ───────────────────────────────────────── */
@media(max-width:420px) {
  #restaurantGrid { grid-template-columns:repeat(2,1fr); }
  .stats-row .stat-card:last-child { display:none; }
  .ctrl-row { flex-direction:column; }
}

/* ── 식당별 담당자 ───────────────────────────────────── */
.rest-duty-row {
  border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; margin-bottom:8px; background:var(--card);
}
.rest-duty-header {
  display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;
}
.rest-duty-name { font-size:15px; font-weight:700; color:var(--navy); }
.rest-duty-deadline { font-size:12px; color:var(--orange); font-weight:700; }
.rest-duty-done-badge { font-size:12px; color:var(--green); font-weight:700; margin-left:auto; }
.rest-duty-filled { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* 완료된 식당 버튼 */
.rest-btn.rest-done {
  background:#e6f4ed !important; border-color:#2D7A4F !important;
  color:#1f6b3f !important; opacity:.7; cursor:not-allowed !important;
}
.rest-done-tag { position:absolute; top:3px; right:3px; font-size:11px; }
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <h1>인시스 점심주문관리</h1>
  </div>
  <div class="hd-right">
    <div id="weatherInfo">🌡️ 로딩중</div>
    <span id="clock">--:--:--</span>
    <span id="userBadge">—</span>
    <span class="ver-badge">v2.2</span>
  </div>
</header>

<div id="noticeBanner">
  <strong>🍱 점심 주문 시간입니다!</strong>
  <p>지금 메뉴를 등록해 주세요</p>
</div>

<!-- ── 로그인 ── -->
<div id="loginScreen" class="hidden">
  <div class="login-card">
    <h2>점심주문관리</h2>
    <p>이름을 선택하고 시작하세요</p>
    <select id="nameSelect"><option value="">이름 선택</option></select>
    <button class="btn-primary" id="loginBtn">시작하기</button>
  </div>
</div>

<!-- ── 메인 ── -->
<div id="mainScreen" class="hidden">
<main id="mainEl">

  <div class="top-bar">
    <span id="statusBadge" class="status-badge open">🟢 접수 중</span>
    <span style="font-size:12px;color:var(--muted)" id="todayDate"></span>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="statPeople">0</div><div class="stat-lbl">참여 인원</div></div>
    <div class="stat-card"><div class="stat-num" id="statQty">0</div><div class="stat-lbl">총 수량</div></div>
    <div class="stat-card"><div class="stat-num" id="statRests">0</div><div class="stat-lbl">식당 수</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="order">📝 주문 등록</button>
    <button class="tab-btn" data-tab="list">📋 주문 목록</button>
    <button class="tab-btn" data-tab="summary">📞 요약/완료</button>
    <button class="tab-btn" data-tab="history">📅 이력</button>
    <button class="tab-btn" data-tab="admin">🏪 식당관리</button>
  </div>

  <!-- 탭: 주문 등록 -->
  <div class="tab-panel" data-panel="order">
    <div id="orderForm">
      <div class="card" id="recommendSection">
        <div class="card-title">⭐ 자주 주문한 메뉴</div>
        <div id="recommendList"></div>
      </div>
      <div class="card">
        <div class="card-title">식당 선택</div>
        <div id="restaurantGrid"></div>
        <div class="form-row" style="margin-bottom:0">
          <input type="text" id="inputRestaurant" placeholder="식당명 (선택 또는 직접 입력)">
        </div>
      </div>
      <div class="card">
        <div class="card-title">메뉴 선택</div>
        <div id="menuTags"><span class="tag-hint">식당을 먼저 선택하세요</span></div>
        <div class="form-row">
          <label>주문자 이름 <span style="font-weight:400;color:var(--muted);font-size:11px">(본인 또는 대신 입력)</span></label>
          <select id="inputOrderName"></select>
        </div>
        <div class="form-row">
          <label>메뉴</label>
          <input type="text" id="inputMenu" placeholder="메뉴명 (선택 또는 직접 입력)">
        </div>
        <div class="form-row">
          <label>수량</label>
          <div class="qty-row">
            <button class="qty-btn" id="qtyMinus">−</button>
            <span id="qtyDisplay">1</span>
            <button class="qty-btn" id="qtyPlus">+</button>
          </div>
        </div>
        <div class="form-row">
          <label>요청사항 (선택)</label>
          <textarea id="inputNote" rows="2" placeholder="예: 매운맛, 안맵게, 곱빼기 등"></textarea>
        </div>
        <button class="btn-primary" id="addOrderBtn">주문 등록하기</button>
      </div>
    </div>
  </div>

// ── 상태 ─────────────────────────────────────────────
let myName          = localStorage.getItem('insys_lunch_name') || '';
let qty             = 1;
let selRest         = '';
let dynRestaurants  = [];
let recData         = {};
let todayOrders     = [];
let isClosed        = false;
let isCompleted     = false;
let restaurantStatus = {};
let restDuty        = {}; // {식당명: 담당자이름}
let lastRestFreq    = {};
let lastSortedRests = null;

const todayKey = () => new Date().toISOString().slice(0,10);
const fmtTime  = d  => d ? new Date(d.seconds*1000).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '';
const fmtDate  = s  => { const [,m,d]=s.split('-'); return `${+m}월 ${+d}일`; };
const $        = id => document.getElementById(id);
const esc      = s  => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const showToast = msg => {
  const t=$('toast'); t.textContent=msg; t.classList.add('show');

// ══════════════════════════════════════════════════════
// 초기화
// ══════════════════════════════════════════════════════
$('todayDate').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
populateNames();
bindEvents();

// ── 이름 목록 채우기 ──────────────────────────────────
function populateNames() {
  ['nameSelect','inputOrderName'].forEach(id => {
    const sel = $(id); if (!sel) return;
    if (id==='inputOrderName') {
      const def=document.createElement('option'); def.value=''; def.textContent='이름 선택'; sel.appendChild(def);
    }
    MEMBERS.forEach(n => {
      const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o);
    });
  });
}

// ── 앱 시작 ───────────────────────────────────────────
function startApp() {
  $('loginScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
  $('userBadge').textContent = myName;
  $('inputOrderName').value  = myName;
  subscribeToday();
  loadRestaurants();
}

// ══════════════════════════════════════════════════════
// Firebase 실시간 구독
// ══════════════════════════════════════════════════════
function subscribeToday() {
  const dk = todayKey();
  onSnapshot(doc(db,'lunch_days',dk), snap => {
    const d = snap.exists() ? snap.data() : {};
    isClosed          = !!d.closed;
    isCompleted       = !!d.completed;
    restaurantStatus  = d.restaurantStatus || {};
    restDuty          = d.restDuty || {};
    updateStatusUI();
    renderDutyPanel();
    renderRestCompleteArea();
  });
  onSnapshot(
    query(collection(db,'lunch_days',dk,'orders'), orderBy('createdAt')),
    snap => {
      todayOrders = snap.docs.map(d=>({id:d.id,...d.data()}));
      renderOrders();
      renderSummary();
      renderRestCompleteArea();
      updateStats();
    }
  );
}

// ══════════════════════════════════════════════════════
// 식당 목록 로드 (Firebase)
// ══════════════════════════════════════════════════════
async function loadRestaurants() {
  try {
    const snap = await getDocs(collection(db,'restaurant_list'));
    if (snap.empty) {
      for (let i=0; i<DEFAULT_RESTAURANTS.length; i++) {
        const r = DEFAULT_RESTAURANTS[i];
        await setDoc(doc(db,'restaurant_list',r.name), {...r, order:i});
      }
      dynRestaurants = DEFAULT_RESTAURANTS.map((r,i)=>({...r,order:i}));
    } else {
      dynRestaurants = snap.docs.map(d=>d.data()).sort((a,b)=>(a.order||0)-(b.order||0));
    }
  } catch(e) {
    dynRestaurants = DEFAULT_RESTAURANTS;
  }
  buildRestButtons({});
  renderRestaurantAdmin();
  loadHistory();
}

// ══════════════════════════════════════════════════════
// 이력 & 추천
// ══════════════════════════════════════════════════════
async function loadHistory() {
  try {
    const snap = await getDocs(query(collection(db,'lunch_history'),orderBy('date','desc'),limit(40)));
    recData = {};
    const restFreq = {};
    snap.docs.forEach(d => {
      (d.data().orders||[]).forEach(o => {
        if (!o.menu||!o.restaurant) return;
        recData[o.restaurant+'||'+o.menu] = (recData[o.restaurant+'||'+o.menu]||0)+1;
        restFreq[o.restaurant] = (restFreq[o.restaurant]||0)+1;
      });
    });
    const sorted = [...dynRestaurants].sort((a,b)=>(restFreq[b.name]||0)-(restFreq[a.name]||0));
    lastRestFreq = restFreq; lastSortedRests = sorted;
    buildRestButtons(restFreq, sorted);
    renderRecommend();
    renderTopMenus();
    renderHistoryCards(snap.docs.map(d=>d.data()).slice(0,5));
  } catch(e) { console.warn('history:', e); }
}

// ══════════════════════════════════════════════════════
// 식당 버튼
// ══════════════════════════════════════════════════════
function buildRestButtons(freq, sorted) {
  const list = sorted || dynRestaurants;
  const grid = $('restaurantGrid');
  grid.innerHTML = '';
  list.slice(0,15).forEach(r => {
    const btn = document.createElement('button');
    const done = restaurantStatus[r.name] || false;
    btn.className = 'rest-btn' + (done ? ' rest-done' : '');
    btn.dataset.name = r.name;
    if (done) btn.disabled = true;
    const cnt = freq[r.name] ? '<span class="rest-cnt">'+freq[r.name]+'</span>' : '';
    const doneTag = done ? '<span class="rest-done-tag">✅</span>' : '';
    btn.innerHTML = esc(r.name) + cnt + doneTag;
    if (!done) btn.addEventListener('click', () => selectRest(r.name));
    grid.appendChild(btn);
  });
}

function selectRest(name) {
  selRest = name;
  $('inputRestaurant').value = name;
  document.querySelectorAll('.rest-btn').forEach(b=>b.classList.toggle('active',b.dataset.name===name));
  const rest = dynRestaurants.find(r=>r.name===name);
  const el = $('menuTags');
  if (!rest || !rest.menus || !rest.menus.length) {
    el.innerHTML='<span class="tag-hint">직접 입력해 주세요</span>'; return;
  }
  const sorted = [...rest.menus].sort((a,b)=>(recData[name+'||'+b]||0)-(recData[name+'||'+a]||0));
  el.innerHTML = sorted.map(m => {
    const cnt = recData[name+'||'+m];
    const btn = `<button class="menu-tag" data-menu="${esc(m)}">${esc(m)}${cnt?`<span class="tag-cnt">${cnt}</span>`:''}</button>`;
    return btn;
  }).join('');
  el.querySelectorAll('.menu-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      $('inputMenu').value = btn.dataset.menu;
      el.querySelectorAll('.menu-tag').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

// ── 추천 메뉴 ──────────────────────────────────────
function renderRecommend() {
  const top = Object.entries(recData).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([k,cnt])=>{ const [rest,menu]=k.split('||'); return {rest,menu,cnt}; });
  if (!top.length) { $('recommendSection').classList.add('hidden'); return; }
  $('recommendSection').classList.remove('hidden');
  const el = $('recommendList');
  el.innerHTML = '';
  top.forEach(({rest,menu,cnt}) => {
    const btn = document.createElement('button');
    btn.className = 'rec-btn';
    btn.innerHTML = `<span class="rec-menu">${esc(menu)}</span><span class="rec-rest">${esc(rest)}</span><span class="rec-cnt">${cnt}회</span>`;
    btn.addEventListener('click', () => { selectRest(rest); $('inputMenu').value=menu; });
    el.appendChild(btn);
  });
}

function renderTopMenus() {
  const top = Object.entries(recData).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([k,cnt])=>{ const [rest,menu]=k.split('||'); return {rest,menu,cnt}; });
  const el = $('topMenuList'); if (!el) return;
  el.innerHTML = top.map(({rest,menu,cnt})=>
    `<div style="background:var(--tagbg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;">
      <div style="font-weight:700;font-size:13px">${esc(menu)}</div>
      <div style="color:var(--muted);margin-top:2px">${esc(rest)} · ${cnt}회</div>
    </div>`
  ).join('');
}

// ══════════════════════════════════════════════════════
// 주문 추가
// ══════════════════════════════════════════════════════
async function addOrder() {
  if (isClosed) { showToast('주문이 마감되었습니다'); return; }
  const orderName  = $('inputOrderName').value || myName;
  const menu       = $('inputMenu').value.trim();
  const restaurant = $('inputRestaurant').value.trim();
  const note       = $('inputNote').value.trim();
  if (!orderName)  { showToast('주문자 이름을 선택해 주세요'); return; }
  if (!restaurant) { showToast('식당을 선택해 주세요'); return; }
  if (!menu)       { showToast('메뉴를 입력해 주세요'); return; }
  if (todayOrders.find(o=>o.name===orderName&&o.restaurant===restaurant&&o.menu===menu))
    { showToast('이미 같은 주문이 있습니다'); return; }
  try {
    await addDoc(collection(db,'lunch_days',todayKey(),'orders'),
      { name:orderName, menu, restaurant, qty, note, createdAt:serverTimestamp() });
    $('inputMenu').value=''; $('inputNote').value='';
    qty=1; $('qtyDisplay').textContent='1';
    selRest=''; $('inputRestaurant').value='';
    $('inputOrderName').value = myName;
    document.querySelectorAll('.menu-tag,.rest-btn').forEach(t=>t.classList.remove('active'));
    $('menuTags').innerHTML='<span class="tag-hint">식당을 선택하세요</span>';
    showToast(orderName+'님 주문 등록 완료!');
  } catch(e) { showToast('오류: '+e.message); }
}

async function deleteOrder(id, ownerName) {
  if (isCompleted) { showToast('주문 완료 건은 삭제 불가합니다'); return; }
  if (ownerName !== myName && !confirm(ownerName+'님 주문을 삭제할까요?')) return;
  await deleteDoc(doc(db,'lunch_days',todayKey(),'orders',id));
  showToast('삭제되었습니다');
}

// ══════════════════════════════════════════════════════
// 마감 / 식당별 완료
// ══════════════════════════════════════════════════════
async function toggleClose() {
  const ref = doc(db,'lunch_days',todayKey());
  if (!isClosed) {
    if (!confirm('주문을 마감할까요?')) return;
    await setDoc(ref,{closed:true,closedBy:myName,closedAt:serverTimestamp()},{merge:true});
    showToast('마감되었습니다');
  } else {
    if (!confirm('마감을 해제할까요?')) return;
    await setDoc(ref,{closed:false},{merge:true});
    showToast('마감이 해제되었습니다');
  }
}

async function toggleRestComplete(restName) {
  const ref = doc(db,'lunch_days',todayKey());
  const cur = restaurantStatus[restName] || false;
  const newStatus = Object.assign({}, restaurantStatus, {[restName]: !cur});
  await setDoc(ref,{restaurantStatus:newStatus},{merge:true});
  const allRests = [...new Set(todayOrders.map(o=>o.restaurant||'기타'))];
  const allDone  = allRests.every(r=>newStatus[r]);
  if (allDone && !isCompleted) {
    if (confirm('모든 식당 완료! 전체 완료 처리할까요?')) {
      await setDoc(doc(db,'lunch_history',todayKey()),{
        date:todayKey(),
        orders:todayOrders.map(o=>({name:o.name,menu:o.menu,restaurant:o.restaurant,qty:o.qty,note:o.note||''})),
        restDuty: restDuty,
        completedBy:myName, updatedAt:serverTimestamp()
      },{merge:true});
      await setDoc(ref,{completed:true,completedBy:myName,completedAt:serverTimestamp()},{merge:true});
      loadHistory();
      showToast('전체 주문 완료! 🎉');
    }
  } else {
    showToast(!cur ? restName+' 완료 ✅' : restName+' 완료 취소');
  }
}

async function cancelAllComplete() {
  if (!confirm('전체 완료를 취소할까요?')) return;
  await setDoc(doc(db,'lunch_days',todayKey()),{completed:false,restaurantStatus:{},restDuty:{}},{merge:true});
  showToast('완료가 취소되었습니다');
}

// ══════════════════════════════════════════════════════
// 주문 담당자
// ══════════════════════════════════════════════════════
async function volunteerDuty(restName) {
  const cur = restDuty[restName] || '';
  if (cur && cur!==myName) {
    if (!confirm(cur+'님이 '+restName+' 담당 중입니다. 변경할까요?')) return;
  }
  const newDuty = Object.assign({}, restDuty, {[restName]: myName});
  await setDoc(doc(db,'lunch_days',todayKey()),{restDuty:newDuty},{merge:true});
  showToast(myName+'님이 '+restName+' 주문 담당자로 등록되었습니다!');
}

async function cancelDuty(restName) {
  if (!confirm(restName+' 주문 담당을 취소할까요?')) return;
  const newDuty = Object.assign({}, restDuty, {[restName]: ''});
  await setDoc(doc(db,'lunch_days',todayKey()),{restDuty:newDuty},{merge:true});
  showToast('담당이 취소되었습니다');
}

// ══════════════════════════════════════════════════════
// 식당 관리
// ══════════════════════════════════════════════════════
function renderRestaurantAdmin() {
  const el = $('restaurantAdminList'); if (!el) return;
  if (!dynRestaurants.length) { el.innerHTML='<p class="empty-item">등록된 식당이 없습니다.</p>'; return; }
  el.innerHTML = dynRestaurants.map((r,i) => `
    <div class="admin-rest-card">
      <div class="arc-header">
        <span class="arc-name">${esc(r.name)}</span>
        <div class="arc-actions">
          <button class="arc-btn edit" data-edit="${i}">수정</button>
          <button class="arc-btn del"  data-del="${i}" data-name="${esc(r.name)}">삭제</button>
        </div>
      </div>
      <div class="arc-info">
        <span>📞 ${esc(r.phone)||'전화번호 없음'}</span>
        <span>⏰ 마감 ${esc(r.deadline)||'미설정'}</span>
      </div>
      <div class="arc-edit hidden" id="are_${i}">
        <div class="form-row" style="margin-top:10px"><label>전화번호</label>
          <input type="tel" id="arPhone_${i}" value="${esc(r.phone||'')}" placeholder="055-000-0000">
        </div>
        <div class="form-row"><label>마감 시간</label>
          <input type="text" id="arDeadline_${i}" value="${esc(r.deadline||'')}" placeholder="예: 10:45">
        </div>
        <div class="form-row"><label>메뉴 (쉼표로 구분)</label>
          <textarea id="arMenus_${i}" rows="3">${esc((r.menus||[]).join(', '))}</textarea>
        </div>
        <div class="arc-edit-row">
          <button class="arc-btn save" data-save="${i}" data-name="${esc(r.name)}">저장</button>
          <button class="arc-btn cancel" data-cancel="${i}">취소</button>
        </div>
      </div>
    </div>`).join('');

  // 이벤트 바인딩
  el.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.arc-edit').forEach(e=>e.classList.add('hidden'));
      $(`are_${btn.dataset.edit}`).classList.remove('hidden');
    });
  });
  el.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', () => $(`are_${btn.dataset.cancel}`).classList.add('hidden'));
  });
  el.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = btn.dataset.save, name = btn.dataset.name;
      const phone    = $(`arPhone_${i}`).value.trim();
      const deadline = $(`arDeadline_${i}`).value.trim();
      const menus    = $(`arMenus_${i}`).value.split(',').map(m=>m.trim()).filter(Boolean);
      await setDoc(doc(db,'restaurant_list',name),{name,phone,deadline,menus,order:+i},{merge:true});
      const idx = dynRestaurants.findIndex(r=>r.name===name);
      if (idx>=0) dynRestaurants[idx] = Object.assign({},dynRestaurants[idx],{phone,deadline,menus});
      renderRestaurantAdmin();
      showToast(name+' 저장 완료');
    });
  });
  el.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.name;
      if (!confirm('"'+name+'" 을 삭제할까요?')) return;
      await deleteDoc(doc(db,'restaurant_list',name));
      dynRestaurants = dynRestaurants.filter(r=>r.name!==name);
      buildRestButtons({});
      renderRestaurantAdmin();
      showToast(name+' 삭제 완료');
    });
  });
}

async function addNewRestaurant() {
  const name = $('newRestName').value.trim();
  if (!name) { showToast('식당 이름을 입력해 주세요'); return; }
  if (dynRestaurants.find(r=>r.name===name)) { showToast('이미 등록된 식당입니다'); return; }
  const newRest = {name, phone:'', deadline:'', menus:[], order:dynRestaurants.length};
  await setDoc(doc(db,'restaurant_list',name), newRest);
  dynRestaurants.push(newRest);
  buildRestButtons({});
  renderRestaurantAdmin();
  $('newRestName').value = '';
  showToast(name+' 추가 완료');
}

// ══════════════════════════════════════════════════════
// 렌더링
// ══════════════════════════════════════════════════════
function updateStatusUI() {
  const badge = $('statusBadge');
  if (isCompleted) { badge.textContent='✅ 주문 완료'; badge.className='status-badge done'; }
  else if (isClosed) { badge.textContent='🔒 마감'; badge.className='status-badge closed'; }
  else { badge.textContent='🟢 접수 중'; badge.className='status-badge open'; }
  $('orderForm').style.opacity       = isClosed ? '0.45' : '1';
  $('orderForm').style.pointerEvents = isClosed ? 'none' : '';
  $('btnClose').textContent = isClosed ? '🔓 마감 해제' : '🔒 주문 마감';
  $('btnClose').className   = 'ctrl-btn ' + (isClosed ? 'btn-reopen' : 'btn-close');
  if (isCompleted) $('btnComplete').classList.remove('hidden');
  else $('btnComplete').classList.add('hidden');
}

function renderDutyPanel() {
  const el = $('dutyPanel'); if (!el) return;
  // 오늘 주문한 식당 목록
  const rests = [...new Set(todayOrders.map(o=>o.restaurant||'기타'))];
  if (!rests.length) {
    el.innerHTML = '<p style="font-size:13px;color:var(--muted);text-align:center;padding:8px">주문 등록 후 담당자를 지정할 수 있습니다.</p>';
    return;
  }
  el.innerHTML = rests.map(rest => {
    const duty = restDuty[rest] || '';
    const done = restaurantStatus[rest] || false;
    const restInfo = dynRestaurants.find(r=>r.name===rest);
    const deadline = restInfo && restInfo.deadline ? ' (마감 '+restInfo.deadline+')' : '';
    return '<div class="rest-duty-row">' +
      '<div class="rest-duty-header">' +
        '<span class="rest-duty-name">' + esc(rest) + '</span>' +
        '<span class="rest-duty-deadline">' + esc(deadline) + '</span>' +
        (done ? '<span class="rest-duty-done-badge">✅ 완료</span>' : '') +
      '</div>' +
      (duty
        ? '<div class="rest-duty-filled">' +
            '<span class="duty-icon">👤</span>' +
            '<span class="duty-name">' + esc(duty) + '</span>' +
            '<span class="duty-label">담당</span>' +
            (!done && duty===myName ? '<button class="duty-cancel-btn" data-rest="' + esc(rest) + '">취소</button>' : '') +
          '</div>'
        : (!done ? '<div class="duty-empty" style="padding:6px 0">' +
            '<button class="duty-volunteer-btn" data-rest="' + esc(rest) + '">📞 내가 ' + esc(rest) + ' 주문할게요!</button>' +
          '</div>' : '')
      ) +
    '</div>';
  }).join('');

  // 이벤트 바인딩
  el.querySelectorAll('.duty-volunteer-btn').forEach(btn => {
    btn.addEventListener('click', () => volunteerDuty(btn.dataset.rest));
  });
  el.querySelectorAll('.duty-cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => cancelDuty(btn.dataset.rest));
  });
}

function renderRestCompleteArea() {
  const el = $('restCompleteArea'); if (!el) return;
  if (!todayOrders.length) { el.innerHTML=''; return; }
  const rests = [...new Set(todayOrders.map(o=>o.restaurant||'기타'))];
  el.innerHTML = rests.map(rest => {
    const done = restaurantStatus[rest] || false;
    const ri = dynRestaurants.find(r=>r.name===rest);
    const dl = ri&&ri.deadline?' · 마감 '+ri.deadline:'';
    const dy = restDuty[rest]?' · 👤 '+restDuty[rest]+' 담당':'';
    return '<button class="rest-complete-btn ' + (done?'done':'') + '" data-rest="' + esc(rest) + '" ' + (done?'disabled style="cursor:default"':'') + '>' +
      (done ? '✅ ' : '📞 ') + esc(rest) + esc(dl) + esc(dy) + ' — ' + (done ? '주문 완료' : '주문완료 처리') +
    '</button>';
  }).join('');
  el.querySelectorAll('.rest-complete-btn:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => toggleRestComplete(btn.dataset.rest));
  });
  // 완료 상태 변경 시 식당 버튼도 재렌더
  buildRestButtons(lastRestFreq, lastSortedRests);
}

function renderOrders() {
  const ul = $('orderList');
  updateStats();
  if (!todayOrders.length) { ul.innerHTML='<li class="empty-item">아직 주문이 없습니다.</li>'; return; }
  const grouped = {};
  todayOrders.forEach(o => {
    const r=o.restaurant||'기타';
    if (!grouped[r]) grouped[r]=[];
    grouped[r].push(o);
  });
  ul.innerHTML = Object.entries(grouped).map(([rest,items]) => `
    <li class="order-group">
      <div class="group-header">
        <span class="group-rest">${esc(rest)}</span>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
          ${(()=>{
            const ri=dynRestaurants.find(r=>r.name===rest);
            const dl=ri&&ri.deadline?'<span style="font-size:11px;color:#ffd0a0;font-weight:700">⏰ '+ri.deadline+' 마감</span>':'';
            const dy=restDuty[rest]?'<span style="font-size:11px;opacity:.85">👤 '+esc(restDuty[rest])+' 담당</span>':'';
            return dl+dy;
          })()}
          <span class="group-cnt">${items.length}명</span>
        </div>
      </div>
      ${items.map((o,i) => `
        <div class="order-row${o.name===myName?' mine':''}">
          <span class="order-seq">${i+1}</span>
          <div class="order-body">
            <span class="order-name">${esc(o.name)}</span>
            <span class="order-menu">${esc(o.menu)} × ${o.qty}</span>
            ${o.note?`<span class="order-note">${esc(o.note)}</span>`:''}
          </div>
          <span class="order-time">${fmtTime(o.createdAt)}</span>
          ${!isCompleted?`<button class="del-btn" data-id="${o.id}" data-owner="${esc(o.name)}">×</button>`:''}
        </div>`).join('')}
    </li>`).join('');
  ul.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteOrder(btn.dataset.id, btn.dataset.owner));
  });
}

function renderSummary() {
  const el = $('summaryBox');
  if (!todayOrders.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const grouped = {};
  todayOrders.forEach(o => {
    const r=o.restaurant||'기타';
    if (!grouped[r]) grouped[r]={};
    const k=o.note?`${o.menu}(${o.note})`:o.menu;
    if (!grouped[r][k]) grouped[r][k]={qty:0,names:[]};
    grouped[r][k].qty+=o.qty; grouped[r][k].names.push(o.name);
  });
  const today = new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  let text=`[인시스 점심주문] ${today}\n━━━━━━━━━━━━━━━━━\n`;
  Object.entries(grouped).forEach(([rest,menus]) => {
    const ri2=dynRestaurants.find(r=>r.name===rest);
    const dl2=ri2&&ri2.deadline?' (마감 '+ri2.deadline+')':'';
    const dy2=restDuty[rest]?' → '+restDuty[rest]+' 담당':'';
    text+=`\n▶ ${rest}${dl2}${dy2}\n`;
    Object.entries(menus).forEach(([menu,d]) => { text+=`  ${menu} ${d.qty}개 — ${d.names.join(', ')}\n`; });
  });
  text+=`\n━━━━━━━━━━━━━━━━━\n합계 ${todayOrders.reduce((s,o)=>s+o.qty,0)}개 / ${todayOrders.length}명`;
  $('summaryText').textContent=text;
}

function updateStats() {
  $('statPeople').textContent = todayOrders.length;
  $('statQty').textContent    = todayOrders.reduce((s,o)=>s+o.qty,0);
  $('statRests').textContent  = new Set(todayOrders.map(o=>o.restaurant)).size;
}

function renderHistoryCards(list) {
  const el=$('historyList'); if (!el) return;
  if (!list.length) { el.innerHTML='<p class="empty-item">기록 없음</p>'; return; }
  el.innerHTML=list.map(day=>{
    const byR={};
    (day.orders||[]).forEach(o=>{byR[o.restaurant||'기타']=(byR[o.restaurant||'기타']||0)+o.qty;});
    const duty = day.restDuty || {};
    const restRows = Object.entries(byR).map(([r,q])=>{
      const d = duty[r] ? ' · 👤 '+esc(duty[r]) : '';
      return '<span class="hist-rest-item">'+esc(r)+' '+q+'개'+d+'</span>';
    }).join('');
    return '<div class="hist-card">' +
      '<div class="hist-date">'+fmtDate(day.date)+' · '+(day.orders||[]).length+'명'+(day.completedBy?' · ✅ '+esc(day.completedBy)+' 처리':'')+'</div>' +
      '<div class="hist-rest-wrap">'+restRows+'</div>' +
    '</div>';
  }).join('');
}

// ══════════════════════════════════════════════════════
// 날씨 (창원)
// ══════════════════════════════════════════════════════
async function loadWeather() {
  try {
    const res  = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.2281&longitude=128.6812&current=temperature_2m,weathercode&timezone=Asia%2FSeoul');
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weathercode;
    const icon = code===0?'☀️':code<=2?'🌤️':code<=3?'☁️':code<=49?'🌫️':code<=59?'🌦️':code<=69?'🌧️':code<=79?'🌨️':'⛈️';
    const desc = code===0?'맑음':code<=2?'구름조금':code<=3?'흐림':code<=49?'안개':code<=59?'이슬비':code<=69?'비':code<=79?'눈':'천둥번개';
    $('weatherInfo').innerHTML = `${icon} <span class="w-temp">${temp}°C</span><span class="w-desc">${desc}</span>`;
  } catch(e) { $('weatherInfo').textContent=''; }
}

// ══════════════════════════════════════════════════════
// 시계 & 알림
// ══════════════════════════════════════════════════════
function startClock() {
  let notified=false;
  setInterval(()=>{
    const now=new Date();
    $('clock').textContent=[now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
    const is10=now.getHours()===10&&now.getMinutes()===0;
    if (is10&&!notified) {
      notified=true;
      $('noticeBanner').classList.add('show');
      setTimeout(()=>$('noticeBanner').classList.remove('show'),90000);
      if ('Notification' in window&&Notification.permission==='granted')
        new Notification('🍱 점심 주문 시간!',{body:'지금 메뉴를 등록해 주세요 (마감 10:30)'});
    }
    if (!is10) notified=false;
  },1000);
  if ('Notification' in window&&Notification.permission==='default') Notification.requestPermission();
}

// ══════════════════════════════════════════════════════
// 이벤트 바인딩 (모두 addEventListener 방식)
// ══════════════════════════════════════════════════════
function bindEvents() {
  // 로그인
  $('loginBtn').addEventListener('click', () => {
    const n=$('nameSelect').value;
    if (!n) { showToast('이름을 선택해 주세요'); return; }
    myName=n; localStorage.setItem('insys_lunch_name',n);
    startApp();
  });

  // 이름 클릭 → 로그인 화면으로
  $('userBadge').addEventListener('click', () => {
    $('mainScreen').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
  });

  // 수량
  $('qtyMinus').addEventListener('click', ()=>{ qty=Math.max(1,qty-1); $('qtyDisplay').textContent=qty; });
  $('qtyPlus').addEventListener('click',  ()=>{ qty=Math.min(10,qty+1); $('qtyDisplay').textContent=qty; });

  // 주문 등록
  $('addOrderBtn').addEventListener('click', addOrder);

  // 마감
  $('btnClose').addEventListener('click', toggleClose);

  // 전체 완료 취소
  $('btnComplete').addEventListener('click', cancelAllComplete);

  // 복사
  $('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText($('summaryText').textContent).then(()=>showToast('복사 완료!'));
  });

  // 식당 추가
  $('addRestBtn').addEventListener('click', addNewRestaurant);
  $('newRestName').addEventListener('keydown', e=>{ if(e.key==='Enter') addNewRestaurant(); });

  // 탭 전환
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===btn));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!==btn.dataset.tab));
    });
  });

  // 플로팅 화면전환
  document.querySelectorAll('.vm-btn').forEach(btn => {
    btn.addEventListener('click', ()=>{
      const mode=btn.dataset.vm;
      localStorage.setItem('insys_viewmode',mode);
      applyViewMode(mode);
      document.querySelectorAll('.vm-btn').forEach(b=>b.classList.toggle('active',b===btn));
    });
  });

  // 플로팅 추가 주문
  $('floatAddBtn').addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='order'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('hidden',p.dataset.panel!=='order'));
    window.scrollTo({top:0,behavior:'smooth'});
  });

  // 담당자 패널 초기 렌더 (주문 후 동적 렌더로 대체)
  renderDutyPanel();
}

function applyViewMode(mode) {
  const m=$('mainEl');
  m.classList.remove('wide','narrow');
  if (mode==='pc') m.classList.add('wide');
  else if (mode==='mobile') m.classList.add('narrow');
  document.querySelectorAll('.vm-btn').forEach(b=>b.classList.toggle('active',b.dataset.vm===mode));
}
</script>
